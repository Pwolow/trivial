<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivial Pourcuite</title>
<style>
:root{--bg:#0f0d16;--panel:#1b1826;--panel2:#252135;--panel3:#2f2a42;--line:#383150;--text:#f5f1fc;--muted:#a49dbd;--gold:#ffb627;--gold2:#ff8c1a;--good:#34d399;--bad:#fb7185;--violet:#a78bfa;--blue:#60a5fa;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(1000px 520px at 50% -8%,#2c2148 0%,rgba(15,13,22,0) 70%),var(--bg);background-color:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:1020px;margin:0 auto;padding:24px 18px 64px}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:650;font-size:16px;cursor:pointer;background:var(--panel2);color:var(--text);transition:transform .08s,background .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){background:var(--panel3)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#221400;box-shadow:0 8px 24px -10px rgba(255,160,40,.7)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:linear-gradient(135deg,var(--gold),var(--gold2))}
.btn.good{background:var(--good);color:#052b1d}
.btn.good:hover:not(:disabled){background:#4be3a8}
.btn.bad{background:var(--bad);color:#2b0710}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.lg{padding:16px 24px;font-size:18px}
.btn.xl{padding:20px 34px;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.card h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;font-weight:700}
.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}.gold{color:var(--gold)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h2{font-size:22px;letter-spacing:-.02em}
.brand{font-weight:800;letter-spacing:-.02em;font-size:18px}
.brand span{color:var(--gold)}
.home{text-align:center;padding-top:6vh}
.logo{font-size:72px;filter:drop-shadow(0 10px 30px rgba(255,170,40,.35))}
.title{font-size:clamp(40px,8vw,72px);font-weight:900;letter-spacing:-.04em;line-height:1;margin:14px 0 12px}
.title span{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:18px;max-width:560px;margin:0 auto 34px}
.menu{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:0 auto}
.meta{margin-top:28px;color:var(--muted);font-size:14px}
.foot{margin-top:36px;color:#7d7696;font-size:12.5px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:14px;padding:6px;margin-bottom:14px}
.stepper button{width:40px;height:40px;border:0;border-radius:10px;background:var(--panel3);font-size:22px;cursor:pointer}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper span{min-width:56px;text-align:center;font-size:22px;font-weight:800}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.inp{width:100%;background:#13101d;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--gold)}
textarea.inp{resize:vertical}
select.inp{appearance:auto}
label.f{display:block;font-size:14px;color:var(--muted);font-weight:600}
label.f .inp{margin-top:6px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:16px;cursor:pointer;transition:border-color .15s}
.mode:hover{border-color:var(--line)}
.mode.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,182,39,.10),var(--panel2))}
.mode .me{font-size:28px}
.mode .mn{font-size:18px;font-weight:800;margin:6px 0 4px}
.mode .md{font-size:13.5px;color:var(--muted)}
.mode .mx{font-size:12.5px;margin-top:10px;color:var(--gold);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.segbtn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
.segbtn.sel{background:var(--text);color:#16121f;border-color:var(--text)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .inp{width:110px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.catbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.catbtn.sel{background:rgba(255,182,39,.15);border-color:var(--gold);color:var(--gold)}
.startbar{position:sticky;bottom:14px;display:flex;justify-content:center;margin-top:8px;z-index:5}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);font-size:13.5px;font-weight:650;white-space:nowrap}
.chip.gold{background:rgba(255,182,39,.16);color:var(--gold)}
.chip.bad{background:rgba(251,113,133,.16);color:var(--bad)}
.chip.d1{color:var(--good)}.chip.d2{color:var(--blue)}.chip.d3{color:var(--bad)}
.chip.ghost{background:transparent;border:1px solid var(--line)}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:16px}

/* ---------- Tableau des scores en direct ---------- */
.score{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px;margin-bottom:16px}
.pchip{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;transition:border-color .2s,box-shadow .2s,transform .2s}
.pchip.cur{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,182,39,.18)}
.pchip.lead{background:linear-gradient(135deg,rgba(255,182,39,.10),var(--panel) 60%)}
.pinfo{min-width:0;flex:1}
.pchip .pn{font-weight:750;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .ps{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.pchip .ps b{font-weight:800}
.pflame{position:absolute;top:-10px;right:-6px;font-size:18px;filter:drop-shadow(0 0 6px rgba(255,120,30,.9));animation:flicker 1s ease-in-out infinite}
.pflame small{font-size:11px;font-weight:900;color:var(--gold);margin-left:1px}
.ring{--p:0;--c:var(--good);width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#3a3350 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";grid-area:1/1;width:34px;height:34px;border-radius:50%;background:var(--panel)}
.ring span{grid-area:1/1;font-size:11.5px;font-weight:800;z-index:1}
.ring.big{width:92px;height:92px}
.ring.big::before{width:74px;height:74px}
.ring.big span{font-size:20px}

/* ---------- Scène ---------- */
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;min-height:380px}
.stage::after{content:"";position:absolute;inset:-1px;border-radius:24px;pointer-events:none;opacity:0;transition:opacity .4s}
.stage.st1::after{opacity:1;box-shadow:0 0 0 1px rgba(255,150,50,.45),0 0 26px -6px rgba(255,150,50,.55)}
.stage.st2::after{opacity:1;--hc:255,150,50;animation:halo 1.6s ease-in-out infinite}
.stage.st3::after{opacity:1;--hc:255,95,40;animation:halo .9s ease-in-out infinite}
.stage.st4::after{opacity:1;--hc:120,150,255;animation:halo .55s ease-in-out infinite}
@keyframes halo{0%,100%{box-shadow:0 0 0 2px rgba(var(--hc),.5),0 0 30px -4px rgba(var(--hc),.45)}50%{box-shadow:0 0 0 3px rgba(var(--hc),.95),0 0 80px 8px rgba(var(--hc),.55)}}
.turn{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:8px}
.lbl{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.turn .name{font-size:clamp(30px,5vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1.1;display:block}
.potbox{text-align:right}
.potv{font-size:44px;font-weight:900;color:var(--gold);line-height:1;display:block;font-variant-numeric:tabular-nums}
.streak{margin:8px 0 18px;font-weight:600}
.streakbadge{position:relative;display:flex;align-items:center;gap:6px;padding:4px 12px}
.flame{display:inline-block;line-height:1;filter:drop-shadow(0 0 10px rgba(255,120,30,.85));animation:flicker 1.2s ease-in-out infinite;transform-origin:50% 90%}
.streakbadge .sb{display:flex;flex-direction:column;line-height:1}
.streakbadge .sb b{font-size:30px;font-weight:900;color:var(--gold)}
.streakbadge .sb small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.streakbadge.t2 .sb b{color:#ffa94d}
.streakbadge.t3 .flame{animation:flicker .6s ease-in-out infinite,shakeS .22s linear infinite}
.streakbadge.t3 .sb b{color:#ff7a3d;text-shadow:0 0 12px rgba(255,110,40,.8)}
.streakbadge.t4 .flame{filter:hue-rotate(200deg) saturate(1.8) drop-shadow(0 0 18px rgba(110,140,255,1));animation:flicker .4s ease-in-out infinite,shakeS .16s linear infinite}
.streakbadge.t4 .sb b{color:#a5b8ff;text-shadow:0 0 16px rgba(120,150,255,1)}
.streakbadge.t3,.streakbadge.t4{animation:tremble .35s linear infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.08,1.14) rotate(2deg)}60%{transform:scale(.96,1.05) rotate(-1deg)}}
@keyframes shakeS{0%,100%{translate:0 0}25%{translate:1px -1px}50%{translate:-1px 1px}75%{translate:1px 1px}}
@keyframes tremble{0%,100%{transform:translate(0,0)}25%{transform:translate(.8px,-.6px)}50%{transform:translate(-.8px,.5px)}75%{transform:translate(.5px,.8px)}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe08a;box-shadow:0 0 8px 2px rgba(255,210,120,.9);animation:twinkle 1.4s ease-in-out infinite;opacity:0;pointer-events:none}
.t4 .spark{background:#dbe5ff;box-shadow:0 0 10px 3px rgba(140,170,255,.95)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.3)}}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.diff{background:var(--panel2);border:2px solid transparent;border-radius:18px;padding:20px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .08s,border-color .15s}
.diff:hover{border-color:var(--line)}.diff:active{transform:scale(.97)}
.diff .dl{font-weight:800;font-size:18px}
.diff .dv{font-size:36px;font-weight:900}
.diff.d1 .dv{color:var(--good)}.diff.d2 .dv{color:var(--blue)}.diff.d3 .dv{color:var(--bad)}
.diff .ds{font-size:13px;color:var(--muted)}
.toggle{display:flex;gap:14px;align-items:center;text-align:left;width:100%;margin-top:16px;background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:14px 16px;cursor:pointer}
.toggle.on{border-color:var(--bad);background:rgba(251,113,133,.08)}
.sw{flex:none;width:44px;height:26px;border-radius:999px;background:#3b3452;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle.on .sw{background:var(--bad)}.toggle.on .sw::after{transform:translateX(18px)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.qtext{font-size:clamp(22px,3.2vw,30px);line-height:1.25;letter-spacing:-.015em;margin-bottom:24px;font-weight:800}
.qtext.sm{font-size:19px;margin-bottom:16px;color:var(--muted);font-weight:700}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:16px;background:var(--panel2);border:2px solid transparent;font-size:18px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s,opacity .2s;min-height:72px}
.ans:hover:not(:disabled){border-color:var(--line);background:var(--panel3)}
.ans:active:not(:disabled){transform:scale(.98)}
.ans:disabled{cursor:default}
.ans .l{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#120f1b;font-weight:900;color:var(--gold)}
.ans.correct{border-color:var(--good);background:rgba(52,211,153,.13);animation:pop .35s ease-out}
.ans.correct .l{background:var(--good);color:#052b1d}
.ans.wrong{border-color:var(--bad);background:rgba(251,113,133,.12)}
.ans.wrong .l{background:var(--bad);color:#2b0710}
.ans.dim{opacity:.4}
.ans.picked{border-color:var(--gold);background:rgba(255,182,39,.14);animation:lockpulse .3s ease-in-out infinite alternate}
.ans.picked .l{background:var(--gold);color:#221400}
@keyframes lockpulse{from{box-shadow:0 0 0 0 rgba(255,182,39,.0)}to{box-shadow:0 0 0 6px rgba(255,182,39,.35)}}
.suspense{margin:0 0 16px;display:flex;align-items:center;gap:12px;font-weight:800;color:var(--gold)}
.suspense .bar{flex:1;height:6px;border-radius:999px;background:#2a2540;overflow:hidden}
.suspense .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:fill var(--susp,1.2s) linear forwards}
@keyframes fill{to{width:100%}}
.hint{margin-top:16px;text-align:center;color:var(--muted);font-size:13px}
.result{border-radius:18px;padding:16px 20px;margin-bottom:16px;font-size:17px}
.result .big{font-size:26px;font-weight:900;letter-spacing:-.02em}
.result.good{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4)}
.result.bad{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.4)}
.result.violet{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4)}
.banner{border-radius:14px;padding:12px 16px;margin-bottom:14px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35);font-size:15px}
.banner.bad{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.35)}
.info{margin-top:16px;background:#15121f;border-left:3px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:15.5px}
.info .il{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:800;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}

/* ---------- Chrono ---------- */
.timer{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.tbar{flex:1;height:10px;background:#2a2540;border-radius:999px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),#7ee0b5);border-radius:999px;transition:width .1s linear}
.tsec{font-weight:900;font-size:22px;min-width:60px;text-align:right;font-variant-numeric:tabular-nums}
.timer.warn .tbar i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.timer.alarm .tbar i{background:var(--bad)}
.timer.alarm .tsec{color:var(--bad);animation:blink .5s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
#alarmv{position:fixed;inset:0;pointer-events:none;z-index:40}
body.alarm #alarmv{animation:vign .5s steps(2,start) infinite}
@keyframes vign{0%{box-shadow:inset 0 0 140px 24px rgba(251,50,70,.6)}100%{box-shadow:inset 0 0 0 0 rgba(251,50,70,0)}}

/* ---------- Jauge de risque ---------- */
.gauge{margin-top:18px;border:1px solid var(--line);border-radius:16px;background:#15121f;overflow:hidden}
.gauge-lock{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:transparent;border:0;cursor:pointer;text-align:left}
.gauge-lock:hover{background:#1c1829}
.gauge-lock .cost{color:var(--bad);font-weight:800;white-space:nowrap}
.gauge-body{padding:14px 16px}
.grow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.grow:last-of-type{border-bottom:0}
.grow.best{background:rgba(52,211,153,.07);border-radius:10px;padding:8px}
.pbar{height:12px;border-radius:999px;background:#2a2540;overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:999px}
.grow .gd{font-size:13px;color:var(--muted)}
.ev{font-weight:900;font-variant-numeric:tabular-nums;text-align:right;min-width:70px}
.verdict{margin-top:10px;font-weight:700}
.gstats{margin-top:8px;font-size:13px;color:var(--muted)}

.disthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:12px}
.disthead h2{font-size:26px;letter-spacing:-.02em}
.rem{text-align:right}
.rem.ok .potv{color:var(--good)}
.drows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel2);border-radius:14px;padding:10px 12px 10px 16px}
.dn{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dctl{display:flex;align-items:center;gap:8px;flex:none}
.rb{width:40px;height:40px;border-radius:11px;border:0;background:var(--panel3);font-size:22px;font-weight:700;cursor:pointer}
.rb:disabled{opacity:.3;cursor:not-allowed}
.dval{min-width:36px;text-align:center;font-size:22px;font-weight:900;color:var(--gold)}
.event{text-align:center;padding:10px 0 6px}
.evemoji{font-size:64px}
.evtitle{font-size:32px;font-weight:900;letter-spacing:-.03em;margin:6px 0}
.evtext{font-size:18px;max-width:600px;margin:0 auto 16px}

/* ---------- Estimation ---------- */
.estform{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin:10px 0}
.estform .inp{max-width:260px;font-size:24px;font-weight:800;text-align:center;-webkit-text-security:disc}
.estform .unit{font-weight:800;color:var(--muted)}
.estans{font-size:44px;font-weight:900;color:var(--gold);text-align:center;margin:6px 0 2px}
.erow{display:grid;grid-template-columns:28px minmax(80px,160px) 1fr 90px 70px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.erow .pbar{height:14px}
.erow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.erow .e{text-align:right;color:var(--muted);font-size:14px}

/* ---------- Succès (superposition) ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,14,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px}
.achcard{width:min(460px,100%);text-align:center;border-radius:24px;padding:28px 24px;background:var(--panel);border:2px solid var(--tc,var(--gold));box-shadow:0 0 60px -10px var(--tc,var(--gold));animation:achin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes achin{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.achicon{font-size:72px;line-height:1;animation:flicker 1.4s ease-in-out infinite}
.achname{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:6px 0}
.achwho{font-size:20px;font-weight:800;color:var(--tc,var(--gold));margin:8px 0}
.achreward{margin:14px 0;padding:12px;border-radius:14px;background:#15121f;font-weight:700}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.tier1{--tc:#d48a4f}.tier2{--tc:#c7d2e0}.tier3{--tc:#ffc83d}.tier4{--tc:#8fd3ff}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pt{position:absolute;width:9px;height:9px;border-radius:2px;will-change:transform,opacity;animation:burst var(--d,1.1s) cubic-bezier(.15,.7,.3,1) forwards}
.pt.shard{width:10px;height:14px;border-radius:0;clip-path:polygon(50% 0,100% 70%,30% 100%,0 40%);background:linear-gradient(135deg,#fff,#9fb3c8)}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6);opacity:0}}
.crack{position:absolute;inset:0;pointer-events:none;border-radius:24px;overflow:hidden;animation:crackfade 2.2s ease-out forwards;z-index:3}
.crack svg{width:100%;height:100%}
@keyframes crackfade{0%{opacity:0}8%{opacity:1}70%{opacity:.85}100%{opacity:0}}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);z-index:70;background:#241f36;border:1px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .25s;opacity:0;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- Fin de partie / KPI ---------- */
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.award{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.award .ae{font-size:30px}.award .at{font-weight:800;margin-top:6px}.award .an{font-size:20px;font-weight:900;color:var(--gold);margin-top:4px}.award .av{color:var(--muted);font-size:14px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:16px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.kcard.first{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,182,39,.25)}
.khead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.kname{font-size:22px;font-weight:900;letter-spacing:-.02em}
.krank{font-size:13px;color:var(--muted);font-weight:700}
.ktiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.ktile{background:var(--panel2);border-radius:12px;padding:10px 12px}
.ktile .kv{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.ktile .kl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.dbars{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.dbar{display:grid;grid-template-columns:72px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.dbar .pbar{height:10px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--tc,var(--line))}
.chart{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:minmax(80px,150px) 1fr 70px;gap:10px;align-items:center}
.crow .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar{position:relative;height:18px;background:#1a1726;border-radius:6px;overflow:hidden}
.cbar .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.cbar i{position:absolute;top:0;bottom:0;border-radius:6px}
.crow .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.inp.ok{border-color:rgba(52,211,153,.55)}
.msg{font-size:14px;margin-top:10px}.msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
.qitem{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.qitem p{margin-top:6px}
.rules p,.rules li{margin-bottom:8px}
.rules ul{padding-left:20px}
.rules h4{margin:18px 0 8px;font-size:17px}
.rules h4:first-child{margin-top:0}
@keyframes pop{0%{transform:scale(.94);opacity:.3}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)}30%{transform:translateX(10px)}45%{transform:translateX(-7px)}60%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
.pop{animation:pop .3s ease-out}.shake{animation:shake .45s}
/* ---------- Multijoueur ---------- */
#mpbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:45;background:rgba(27,24,38,.94);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;display:none;gap:8px;align-items:center;box-shadow:0 10px 30px -12px #000;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mpbar.show{display:flex}
#mpbar.turn{border-color:var(--gold);background:rgba(58,40,10,.96);color:var(--gold);animation:lockpulse .6s ease-in-out infinite alternate}
body.mp #app{padding-bottom:96px}
.locked{cursor:not-allowed!important}
.btn.locked,.diff.locked,.toggle.locked,.gauge-lock.locked,.rb.locked{opacity:.45}
.ans.locked{opacity:.5;filter:saturate(.6)}
.pchip.me{outline:2px dashed var(--violet);outline-offset:2px}
.qrbox{background:#fff;border-radius:16px;padding:12px;display:inline-block}
.qrbox svg,.qrbox img{display:block;width:230px;height:230px}
.roomcode{font-size:56px;font-weight:900;letter-spacing:.15em;color:var(--gold);line-height:1.1}
.lobbyp{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:12px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--good);flex:none}.dot.off{background:#666}
@media (max-width:640px){.answers,.grid2{grid-template-columns:1fr}.stage{padding:20px}.potv{font-size:36px}.grow{grid-template-columns:90px 1fr auto}.erow{grid-template-columns:22px 80px 1fr 70px}.erow .e{display:none}.score{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
