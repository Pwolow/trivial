let S = null;
let screen = "home";
const ED = {msg:"",err:false,lastCat:"",lastD:2};

/* ===================== Moteur de jeu ===================== */
const mode = () => MODES[S.mode];
const P = () => S.players[S.cur];
const nb = () => S.players.length;
const cap = n => S.cap>0 ? Math.min(n,S.cap) : n;
const nextMult = () => mode().mult(S.streak+1) * (S.active.double ? 2 : 1);
const avgDrunk = () => S.players.reduce((s,p)=>s+p.drunk,0)/nb();
const net = p => p.given - p.drunk;
function bump(obj,key,ok){ const s=obj[key]||(obj[key]={ok:0,tot:0}); s.tot++; if(ok) s.ok++; }
function newPlayer(name){ return {name,drunk:0,given:0,ok:0,tot:0,best:0,maxLoss:0,byD:{1:{ok:0,tot:0},2:{ok:0,tot:0},3:{ok:0,tot:0}},byCat:{},hardRun:0,estN:0,estErr:0,estWins:0,gaugePaid:0,timeouts:0,culsec:0,ach:[]}; }
const streakTier = s => s>=8?4 : s>=5?3 : s>=3?2 : s>=1?1 : 0;

function pickQuestion(diffs){
  const all = allQuestions();
  let pool = all.filter(q=>diffs.includes(q.d) && S.cats.includes(q.c));
  if(!pool.length) pool = all.filter(q=>S.cats.includes(q.c));
  if(!pool.length) pool = all;
  let fresh = pool.filter(q=>!S.used.has(qkey(q)) && !SEEN.has(qkey(q)));
  if(!fresh.length){
    pool.forEach(q=>SEEN.delete(qkey(q)));
    S.cycleMsg = true;
    fresh = pool.filter(q=>!S.used.has(qkey(q)));
    if(!fresh.length){ pool.forEach(q=>S.used.delete(qkey(q))); fresh = pool; }
  }
  const q = fresh[rnd(fresh.length)];
  S.used.add(qkey(q)); SEEN.add(qkey(q)); saveSeen();
  const idx = shuffle(q.a.map((_,i)=>i));
  return {c:q.c,d:q.d,q:q.q,i:q.i||"",opts:idx.map(i=>q.a[i]),correct:idx.indexOf(0)};
}

function startTurn(){
  S.pot=0; S.potFrom=0; S.streak=0; S.qod=false; S.q=null; S.pick=null; S.res=null; S.steal=null; S.gauge=false; S.broken=0;
  S.active=S.pending; S.pending={};
  S.phase="choose"; render();
}

function askQuestion(d){
  const m = mode(); let base, diffs;
  if(S.points==="diff"){ base=d; diffs=[d]; } else { base=1+rnd(3); diffs=m.diffs; }
  S.q = pickQuestion(diffs);
  S.qVal = Math.ceil(base*nextMult());
  S.pick=null; S.res=null; S.steal=null; S.leftAtAnswer=null;
  S.phase="question"; render();
  startTimer();
}

/* ----- Chrono ----- */
const alarmMs = () => Math.min(5000, S.timer.total*0.35);
function startTimer(){
  stopTimer();
  if(!(S.timerSec>0)) return;
  S.timer={total:S.timerSec*1000,left:S.timerSec*1000,last:performance.now(),lastSec:null};
  S.timerInt=setInterval(tickTimer,100);
  updateTimerUI();
}
function stopTimer(){
  if(S && S.timerInt){ clearInterval(S.timerInt); S.timerInt=null; }
  document.body.classList.remove("alarm");
}
function tickTimer(){
  if(!S || !S.timer || S.phase!=="question"){ stopTimer(); return; }
  const now=performance.now(); const dt=now-S.timer.last; S.timer.last=now;
  if(!document.hidden) S.timer.left-=dt;
  if(S.timer.left<=0){ S.timer.left=0; updateTimerUI(); timeUp(); return; }
  const sec=Math.ceil(S.timer.left/1000);
  if(sec!==S.timer.lastSec){ S.timer.lastSec=sec; if(S.timer.left<=alarmMs()) SFX.tick(); }
  updateTimerUI();
}
function paintTimer(left,total,active){
  const box=document.getElementById("timer"); if(!box) return;
  const p=Math.max(0,left/total*100);
  box.querySelector("i").style.width=p+"%";
  box.querySelector(".tsec").textContent=Math.ceil(Math.max(0,left)/1000)+" s";
  const al=left<=Math.min(5000,total*0.35);
  box.classList.toggle("alarm",al); box.classList.toggle("warn",!al && p<50);
  document.body.classList.toggle("alarm",al && active);
}
function updateTimerUI(){
  const t=S && S.timer; if(!t) return;
  paintTimer(t.left,t.total,S.phase==="question");
}
function timeUp(){
  stopTimer();
  if(S.phase!=="question") return;
  SFX.alarm(); S.leftAtAnswer=0; P().timeouts++;
  resolveAnswer(-1);
}

/* ----- Réponse avec suspense ----- */
function answer(i){
  if(S.phase!=="question") return;
  S.leftAtAnswer = S.timer ? S.timer.left : null;
  stopTimer(); S.timer=null;
  S.pick=i; S.suspKind="main"; S.phase="suspense";
  SFX.drum(); render();
  S.suspT=setTimeout(resolveSuspense,SUSPENSE_MS);
}
function stealAnswer(i){
  if(S.phase!=="steal") return;
  S.stealPick=i; S.suspKind="steal"; S.phase="suspense";
  SFX.drum(); render();
  S.suspT=setTimeout(resolveSuspense,SUSPENSE_MS);
}
function resolveSuspense(){
  clearTimeout(S.suspT);
  if(S.phase!=="suspense") return;
  if(S.suspKind==="steal") resolveSteal(S.stealPick); else resolveAnswer(S.pick);
}

function resolveAnswer(i){
  const p = P(); S.pick=i; p.tot++;
  S.timer=null;
  const ok = i===S.q.correct; S.lastOk=ok; S.timedOut = i===-1;
  recordQ(S.q,ok); bump(p.byD,S.q.d,ok); bump(p.byCat,S.q.c,ok);
  const wasQod=S.qod;
  if(ok){
    p.ok++; S.streak++; p.best=Math.max(p.best,S.streak);
    p.hardRun = S.q.d===3 ? p.hardRun+1 : 0;
    const before = S.pot;
    S.pot = S.qod ? S.pot*2 + S.qVal : S.pot + S.qVal;
    S.potFrom = before; S.gain = S.pot - before;
    S.anim="pop"; S.phase="reveal";
    S.fx={type:"win",streak:S.streak};
    SFX.correct(S.streak);
    if([3,5,8,12].includes(S.streak)){ setTimeout(()=>SFX.fire(),260); showToast(`🔥 ${esc(p.name)} : ${S.streak} bonnes réponses d'affilée !`); }
    checkAch(S.cur,"correct",{d:S.q.d,left:S.leftAtAnswer,qod:wasQod});
  } else {
    p.hardRun=0;
    S.broken=S.streak; S.streak=0;
    let raw = S.pot + S.qVal; if(S.qod) raw*=2;
    raw = Math.ceil(raw*mode().fail);
    S.stealAmt = S.pot + S.qVal;
    if(S.broken>=3){ SFX.glass(); S.fx={type:"break"}; } else { SFX.wrong(); S.fx={type:"lose"}; }
    if(S.active.inversion){
      S.res = {type:"invFail",amount:raw};
      S.anim="pop"; S.phase="reveal";
    } else {
      const d = cap(raw); p.drunk+=d; p.maxLoss=Math.max(p.maxLoss,d);
      S.res = {type:"fail",amount:d,raw};
      S.anim="shake";
      if(d>=10) checkAch(S.cur,"loss");
      if(S.active.braquage){ S.thief=(S.cur+1)%nb(); S.phase="steal"; }
      else S.phase="reveal";
    }
    S.potFrom=S.pot;
  }
  S.qod=false;
  render();
}

function resolveSteal(i){
  const th = S.players[S.thief]; th.tot++;
  const ok = i===S.q.correct; let drank=0;
  recordQ(S.q,ok); bump(th.byD,S.q.d,ok); bump(th.byCat,S.q.c,ok);
  if(ok){ th.ok++; SFX.correct(1); S.fx={type:"win",streak:1}; checkAch(S.thief,"steal"); }
  else { drank=cap(2); th.drunk+=drank; SFX.wrong(); }
  S.steal = {pick:i,ok,drank};
  S.anim = ok ? "pop" : "shake";
  S.phase="reveal"; render();
}

/* ----- Jauge de risque ----- */
const gaugeCost = () => cap(1 + Math.floor(S.streak/2));
function unlockGauge(){
  if(S.gauge) return;
  const c=gaugeCost(); P().drunk+=c; P().gaugePaid+=c; S.gauge=true;
  SFX.pay(); render();
}
function probFor(p,d){
  const prior=diffPrior(d);
  const prof=profileOf(p.name);
  const hist=prof && prof.byD && prof.byD[d] ? prof.byD[d] : {ok:0,tot:0};
  const ok=p.byD[d].ok+hist.ok, tot=p.byD[d].tot+hist.tot;
  const k=6;
  return {p:(ok+k*prior.p)/(tot+k), n:tot, ok, prior};
}
function gaugeOptions(forReveal){
  const m=mode(), p=P();
  const mult=mode().mult(S.streak+1)*(S.active.double?2:1);
  const qod = !forReveal && S.qod;
  const opts=[];
  const mk=(label,cls,pr,v)=>{
    const winTot = qod ? S.pot*2+v : S.pot+v;
    let loss = S.pot+v; if(qod) loss*=2; loss=cap(Math.ceil(loss*m.fail));
    const ev = pr*winTot - (1-pr)*loss;
    return {label,cls,p:pr,v,winTot,loss,ev};
  };
  if(S.points==="diff"){
    m.diffs.forEach(d=>{ const pr=probFor(p,d).p; opts.push(mk(DIFF[d],"d"+d,pr,Math.ceil(d*mult))); });
  } else {
    const pr=m.diffs.reduce((s,d)=>s+probFor(p,d).p,0)/m.diffs.length;
    const v=[1,2,3].reduce((s,b)=>s+Math.ceil(b*mult),0)/3;
    opts.push(mk("Au hasard","",pr,Math.round(v*10)/10));
  }
  return opts;
}
function gaugeHTML(forReveal){
  if(!S.gauge){
    return `<div class="gauge"><button class="gauge-lock" data-act="gauge"><span><b>📊 Jauge de risque</b><br><span class="muted small">Probabilités, gains, pertes et verdict du calcul pour tout ton tour</span></span><span class="cost">🔒 ${g(gaugeCost())}</span></button></div>`;
  }
  const p=P(); const opts=gaugeOptions(forReveal);
  const stopEv = S.pot;
  const best = opts.reduce((a,b)=>b.ev>a.ev?b:a, opts[0]);
  const stopBetter = S.pot>0 && stopEv>=best.ev;
  let rows = opts.map(o=>{
    const pc=Math.round(o.p*100);
    return `<div class="grow ${!stopBetter && o===best?"best":""}"><span class="chip ${o.cls}">${o.label}</span>
      <div><div class="pbar"><i style="width:${pc}%;background:${ringColor(pc)}"></i></div><div class="gd">${pc} % de réussite estimée · juste : pot à ${fmt(o.winTot)} · faux : tu bois ${o.loss}</div></div>
      <span class="ev ${o.ev>=0?"pos":"neg"}">${o.ev>=0?"+":""}${fmt(o.ev)}</span></div>`;
  }).join("");
  if(S.pot>0) rows += `<div class="grow ${stopBetter?"best":""}"><span class="chip">🛑 Encaisser</span><div><div class="pbar"><i style="width:100%;background:var(--good)"></i></div><div class="gd">100 % : tu distribues ${S.pot} tout de suite</div></div><span class="ev pos">+${S.pot}</span></div>`;
  const d = S.points==="diff" ? null : null;
  const st = S.points==="diff" ? mode().diffs.map(dd=>{ const r=probFor(p,dd); return `${DIFF[dd]} ${r.n?`${r.ok}/${r.n}`:"aucune donnée"}`; }).join(" · ") : "";
  const verdict = S.active.inversion ? `⚠️ Inversion active : le calcul ne s'applique pas à ce tour.`
    : stopBetter ? `Verdict du calcul : <b>encaisser</b> (+${S.pot} garanti contre ${fmt(best.ev)} en espérance).`
    : `Verdict du calcul : <b>jouer ${best.label}</b> (espérance ${best.ev>=0?"+":""}${fmt(best.ev)}${S.pot>0?` contre +${S.pot} en encaissant`:""}).`;
  return `<div class="gauge"><div class="gauge-body"><div class="lbl" style="margin-bottom:6px">📊 Jauge de risque · espérance en gorgées (+ données, − bues)</div>${rows}
    <div class="verdict">${verdict}</div>
    <div class="gstats">Historique de ${esc(p.name)} : ${st||`${p.ok}/${p.tot} cette partie`} · Série : ${S.streak} (prochaine ×${fmt(mode().mult(S.streak+1)*(S.active.double?2:1))}) · Record perso : ${Math.max(p.best,(profileOf(p.name)||{}).best||0)}<br>
    Probabilités estimées à partir de ton historique et de celui du groupe. Une série n'augmente pas tes chances de réussir, elle augmente seulement l'enjeu. L'espérance porte sur la prochaine question uniquement.</div></div></div>`;
}

/* ----- Encaisser, distribuer ----- */
function doStop(){
  if(!(S.pot>0)) return;
  if(S.active.inversion){
    const d = cap(S.pot); P().drunk+=d; P().maxLoss=Math.max(P().maxLoss,d);
    S.msg = {title:"🔄 Inversion !",text:`${esc(P().name)} s'arrête et boit donc son pot : <b>${g(d)}</b>.`,btn:"Tour suivant",next:"endTurn"};
    S.phase="msg"; render(); return;
  }
  SFX.coin();
  if(S.pot>=10) checkAch(S.cur,"cash10");
  if(S.pot>=20) checkAch(S.cur,"cash20");
  openDist(S.cur,S.pot,"endTurn");
}
function openDist(from,total,next){
  let t = total;
  if(S.cap>0) t = Math.min(t, S.cap*(nb()-1));
  S.dist = {from,total:t,orig:total,alloc:S.players.map(()=>0),next};
  S.phase="dist"; render();
}
const distRem = () => S.dist.total - S.dist.alloc.reduce((a,b)=>a+b,0);
const canAdd = i => i!==S.dist.from && distRem()>0 && (S.cap===0 || S.dist.alloc[i]<S.cap);

function endTurn(){
  S.turns++;
  S.cur = (S.cur+1)%nb();
  if(S.cur===0) S.round++;
  if(checkEnd()) return finish();
  const evDue = mode().events && S.turns%3===0;
  if(S.estEvery>0 && S.turns%S.estEvery===0){ S.evDue=evDue; return startEstimation(); }
  if(evDue) return triggerEvent();
  startTurn();
}
function checkEnd(){
  if(S.endType==="rounds") return S.round > S.endVal;
  return avgDrunk() >= S.endVal;
}
function finish(){
  stopTimer(); clearTimeout(S.suspT);
  if(!S.saved){ S.saved=true; saveGameToProfiles(); }
  S.over=true; screen="end"; render(); window.scrollTo(0,0);
  if(!REDUCED) setTimeout(()=>{ burst(window.innerWidth/2,90,90,["#ffb627","#ff8c1a","#34d399","#60a5fa","#a78bfa","#fb7185"],{up:true,power:420,gravity:260}); SFX.fanfare(); },120);
}
function afterEvent(){ if(checkEnd()) finish(); else startTurn(); }

/* ----- Profils persistants ----- */
function saveGameToProfiles(){
  S.players.forEach(p=>{
    const k=pkey(p.name); const pr=PROFILES[k]||emptyProfile(p.name);
    pr.name=p.name; pr.games++; pr.ok+=p.ok; pr.tot+=p.tot; pr.best=Math.max(pr.best,p.best);
    pr.drunk+=p.drunk; pr.given+=p.given; pr.estN+=p.estN; pr.estErr+=p.estErr; pr.estWins+=p.estWins; pr.last=Date.now();
    [1,2,3].forEach(d=>{ pr.byD[d]=pr.byD[d]||{ok:0,tot:0}; pr.byD[d].ok+=p.byD[d].ok; pr.byD[d].tot+=p.byD[d].tot; });
    Object.entries(p.byCat).forEach(([c,s])=>{ const t=pr.byCat[c]||(pr.byCat[c]={ok:0,tot:0}); t.ok+=s.ok; t.tot+=s.tot; });
    p.ach.forEach(id=>{ pr.ach[id]=(pr.ach[id]||0)+1; });
    PROFILES[k]=pr;
  });
  saveProfiles();
}

/* ----- Succès ----- */
function unlock(pi,id){
  const p=S.players[pi];
  if(!ACH_BY[id] || p.ach.includes(id)) return;
  p.ach.push(id); S.achQ.push({pi,id});
}
function checkAch(pi,ev,ctx){
  const p=S.players[pi]; const u=id=>unlock(pi,id); ctx=ctx||{};
  if(ev==="correct"){
    if(S.streak>=3) u("chauffe"); if(S.streak>=5) u("feu"); if(S.streak>=8) u("inarretable"); if(S.streak>=12) u("dieu");
    if(p.ok>=10) u("erudit");
    if(ctx.d===3) u("cassecou");
    if(p.hardRun>=3) u("cerveau");
    if(Object.values(p.byCat).filter(x=>x.ok>0).length>=5) u("touche");
    if(ctx.left!=null && ctx.left>0 && ctx.left<3000) u("fil");
    if(ctx.qod) u("flambeur");
    if(p.ok>=15 && p.ok===p.tot) u("sansfaute");
  }
  if(ev==="loss") u("kamikaze");
  if(ev==="cash10") u("encaisseur");
  if(ev==="cash20") u("banquier");
  if(ev==="steal") u("voleur");
  if(ev==="given" && p.given>=25) u("mecene");
  if(ev==="estWin") u("flair");
  if(ev==="sniper") u("sniper");
}
const OVERLAY_OK = ["choose","reveal","msg","event","duel","estReveal"];
function achDist(){
  const a=S.achShow; if(!a) return;
  const amount=TIERS[ACH_BY[a.id].tier].reward;
  S.achShow=null; S.resumePhase=S.phase;
  openDist(a.pi,amount,"resume");
}
function achCul(target){
  const a=S.achShow; if(!a) return;
  const t=S.players[target]; t.drunk+=CUL_SEC_SIPS; t.culsec++;
  S.achShow=null; SFX.coin();
  showToast(`🍺 ${esc(t.name)} doit finir son verre cul sec !`);
  render();
}
function achSkip(){ S.achShow=null; render(); }

/* ----- Evénements du mode Chaos ----- */
function hitExtreme(scoreFn, amount, useMax){
  const vals = S.players.map(scoreFn);
  const target = useMax ? Math.max(...vals) : Math.min(...vals);
  const idx = S.players.map((p,i)=>i).filter(i=>vals[i]===target);
  const d = cap(amount);
  idx.forEach(i=>{ S.players[i].drunk+=d; });
  const names = idx.map(i=>`<b>${esc(S.players[i].name)}</b>`).join(", ");
  return {names,multi:idx.length>1,d};
}
const EVENTS = [
  {id:"tournee",w:2,emoji:"🍻",title:"Tournée générale",run(){ const d=cap(2); S.players.forEach(p=>p.drunk+=d); return `Tout le monde boit <b>${g(d)}</b>.`; }},
  {id:"justice",w:1,emoji:"⚖️",title:"Justice sociale",run(){ const r=hitExtreme(p=>p.drunk,3,false); return `Le moins assoiffé jusqu'ici : ${r.names} ${r.multi?"boivent chacun":"boit"} <b>${g(r.d)}</b>.`; }},
  {id:"bourreau",w:1,emoji:"😈",title:"Taxe du bourreau",run(){
      if(Math.max(...S.players.map(p=>p.given))===0){ const r=hitExtreme(p=>p.drunk,3,false); return `Personne n'a encore distribué. Justice sociale à la place : ${r.names} ${r.multi?"boivent chacun":"boit"} <b>${g(r.d)}</b>.`; }
      const r=hitExtreme(p=>p.given,3,true); return `Celui qui a fait le plus boire paie sa taxe : ${r.names} ${r.multi?"boivent chacun":"boit"} <b>${g(r.d)}</b>.`; }},
  {id:"double",w:2,emoji:"🎉",title:"Happy hour",run(){ S.pending.double=true; return `Pendant le tour de <b>${esc(P().name)}</b>, toutes les questions valent double.`; }},
  {id:"inversion",w:2,emoji:"🔄",title:"Inversion",run(){ S.pending.inversion=true; return `Pendant le tour de <b>${esc(P().name)}</b>, tout s'inverse : s'arrêter, c'est boire son pot ; se tromper, c'est le distribuer.`; }},
  {id:"braquage",w:2,emoji:"🥷",title:"Braquage",run(){ S.pending.braquage=true; const th=S.players[(S.cur+1)%nb()]; return `Si <b>${esc(P().name)}</b> se trompe pendant son tour, <b>${esc(th.name)}</b> pourra voler la question et distribuer le pot.`; }},
  {id:"duel",w:3,emoji:"⚔️",title:"Duel"}
];
function triggerEvent(){
  const bag=[]; EVENTS.forEach(e=>{ for(let k=0;k<e.w;k++) bag.push(e); });
  let ev = bag[rnd(bag.length)];
  if(S.lastEv===ev.id) ev = bag[rnd(bag.length)];
  S.lastEv = ev.id; S.ev = ev;
  if(ev.id==="duel"){
    const a=rnd(nb()); let b=rnd(nb()-1); if(b>=a) b++;
    S.duel = {a,b,q:pickQuestion([2]),step:0,ans:[null,null],lose:[]};
    S.phase="duel"; render(); return;
  }
  S.evText = ev.run();
  S.anim="pop"; S.phase="event"; render();
}
function duelAnswer(i,by){
  const D=S.duel; if(D.step>1) return;
  let k;
  if(by!=null){ k = by===D.a ? 0 : by===D.b ? 1 : -1; if(k<0 || D.ans[k]!=null) return; }
  else k = D.ans[0]==null ? 0 : 1;
  D.ans[k]=i; D.step=D.ans.filter(x=>x!=null).length;
  if(D.step===2){
    [D.a,D.b].forEach((pi,k)=>{ const p=S.players[pi]; const ok=D.ans[k]===D.q.correct; p.tot++; recordQ(D.q,ok); bump(p.byD,D.q.d,ok); bump(p.byCat,D.q.c,ok); if(ok) p.ok++; else { const d=cap(3); p.drunk+=d; D.lose.push(pi); } });
    S.anim="pop"; if(D.lose.length<2) SFX.correct(1); else SFX.wrong();
  } else SFX.click();
  render();
}

/* ----- Estimation ----- */
const EST_WIN = 3, EST_LOSE = 3;
function estKey(e){ return "est|"+e.q.toLowerCase(); }
function startEstimation(){
  let pool=ESTIMS.filter(e=>!S.usedEst.has(estKey(e)) && !SEEN.has(estKey(e)));
  if(!pool.length){ ESTIMS.forEach(e=>SEEN.delete(estKey(e))); pool=ESTIMS.filter(e=>!S.usedEst.has(estKey(e))); }
  if(!pool.length){ S.usedEst.clear(); pool=ESTIMS.slice(); }
  const e=pool[rnd(pool.length)];
  S.usedEst.add(estKey(e)); SEEN.add(estKey(e)); saveSeen();
  const order=S.players.map((_,k)=>(S.cur+k)%nb());
  S.est={e,order,k:0,vals:{},err:""};
  S.phase="est"; SFX.fire(); render();
}
function parseNum(s){
  const t=String(s||"").replace(/[\s  ]/g,"").replace(",",".");
  if(!/^-?\d+(\.\d+)?$/.test(t)) return null;
  return parseFloat(t);
}
function estSubmit(){
  const inp=document.getElementById("estIn"); if(!inp || S.phase!=="est") return;
  const v=parseNum(inp.value);
  if(v===null){ S.est.err="Entre un nombre (ex. : 1250 ou 13,8)."; render(); return; }
  const pending=S.est.order.filter(pi=>!(pi in S.est.vals));
  if(!pending.length) return;
  S.est.vals[pending[0]]=v; S.est.err="";
  SFX.click();
  estCheckDone();
}
function estCheckDone(){
  if(S.est.order.every(pi=>pi in S.est.vals)) return estReveal();
  render();
}
function estReveal(){
  const a=S.est.e.a;
  const rows=S.est.order.map(pi=>{ const v=S.est.vals[pi]; const err=Math.abs(v-a)/Math.abs(a); return {pi,v,err}; }).sort((x,y)=>x.err-y.err);
  rows.forEach(r=>{ const p=S.players[r.pi]; p.estN++; p.estErr+=Math.min(r.err,1); });
  const win=rows[0]; const maxErr=rows[rows.length-1].err;
  const losers = nb()>=3 ? rows.filter(r=>r.err===maxErr && r.pi!==win.pi).map(r=>r.pi) : [];
  const d=cap(EST_LOSE); losers.forEach(pi=>{ S.players[pi].drunk+=d; });
  const exact = win.err<0.001;
  const amount = exact ? EST_WIN*2 : EST_WIN;
  S.players[win.pi].estWins++;
  checkAch(win.pi,"estWin"); if(win.err<0.02) checkAch(win.pi,"sniper");
  S.est.res={rows,win:win.pi,losers,d,amount,exact};
  S.phase="estReveal"; S.anim="pop"; SFX.correct(3); S.fx={type:"estwin"};
  render();
}
function afterEstimation(){
  S.est=null;
  if(checkEnd()) return finish();
  if(S.evDue){ S.evDue=false; return triggerEvent(); }
  startTurn();
}

    <li><b>Duel</b> : deux joueurs tirés au sort répondent à la même question, chacun sans voir la réponse de l'autre. Chaque perdant boit 3.</li></ul>
    <h4>📱 Multijoueur</h4>
    <p>Depuis l'accueil, « Multijoueur » crée un salon avec un QR code. Chacun le scanne avec l'appareil photo de son iPhone, tape son prénom, et voit la partie en direct sur son téléphone. Seul le joueur dont c'est le tour peut appuyer sur les boutons. L'estimation et le duel se jouent en secret, chacun sur son écran. L'appareil hôte peut toujours jouer à la place de quelqu'un (joueur sans téléphone, batterie à plat). Il faut une connexion internet.</p>
    <h4>Mémoire des questions</h4>
    <p>Le jeu retient les questions déjà posées d'une partie à l'autre et ne les repose pas tant qu'il en reste de nouvelles. Quand un niveau est épuisé, un nouveau cycle commence. Réinitialisation possible dans « Gérer les questions ».</p>
    <h4>Plafond</h4>
    <p>Personne ne peut boire plus que le plafond en une seule sanction, ni recevoir plus que le plafond lors d'une distribution. 0 = pas de plafond. Le cul sec légendaire n'est pas concerné.</p>
    <h4>Fin de partie</h4>
    <p>Après le nombre de tours choisi, ou dès que la moyenne de gorgées bues par joueur atteint le seuil.</p>
    <h4>Raccourcis clavier</h4>
    <p>A, B, C, D (ou 1 à 4) pour répondre. Entrée pour valider une distribution ou passer à la suite.</p>
  </div>`;
}

function answersHTML(q,o){
  o = o||{};
  const wrong = o.wrong||[], disabled = o.disabled||[];
  return `<div class="answers">`+q.opts.map((t,i)=>{
    let cls="";
    if(o.reveal){ cls = i===q.correct ? "correct" : (wrong.includes(i) ? "wrong" : "dim"); }
    else if(o.picked!==undefined){ cls = i===o.picked ? "picked" : (wrong.includes(i) ? "wrong" : "dim"); }
    else if(wrong.includes(i)) cls="wrong";
    const dis = o.reveal || o.picked!==undefined || disabled.includes(i);
    return `<button class="ans ${cls}" ${dis?"disabled":`data-act="${o.act}" data-i="${i}" data-key-ans="${i}"`}><span class="l">${"ABCDEF"[i]}</span><span class="t">${esc(t)}</span></button>`;
  }).join("")+`</div>`;
}

function banners(){
  let h="";
  if(S.active.double) h+=`<div class="banner">🎉 <b>Happy hour</b> : toutes tes questions valent double pendant ce tour.</div>`;
  if(S.active.inversion) h+=`<div class="banner">🔄 <b>Inversion</b> : si tu t'arrêtes, tu bois ton pot. Si tu te trompes, tu le distribues.</div>`;
  if(S.active.braquage) h+=`<div class="banner">🥷 <b>Braquage</b> : si tu te trompes, <b>${esc(S.players[(S.cur+1)%nb()].name)}</b> pourra voler ta question.</div>`;
  return h;
}

function streakBadge(s){
  if(!s) return "";
  const t=streakTier(s); const size=Math.min(30+s*5,82);
  let sp=""; for(let k=0;k<(t>=2?t*4:0);k++) sp+=`<i class="spark" style="left:${rnd(100)}%;top:${rnd(100)}%;animation-delay:${(Math.random()*1.4).toFixed(2)}s"></i>`;
  return `<div class="streakbadge t${t}" title="Série en cours"><span class="flame" style="font-size:${size}px">🔥</span><div class="sb"><b>${s}</b><small>d'affilée</small></div>${sp}</div>`;
}
function turnHeader(){
  const p=P();
  return `<div class="turn"><div><span class="lbl">Au tour de</span><span class="name">${esc(p.name)}</span></div>
    ${streakBadge(S.streak)}
    <div class="potbox"><span class="lbl">Pot</span><span class="potv" data-count data-from="${S.potFrom}" data-to="${S.pot}">${S.pot}</span></div></div>`;
}

function vChoose(){
  const m=mode(), mult=nextMult();
  let h = banners() + turnHeader();
  h += S.streak>0 ? `<p class="streak">🔥 Série de ${S.streak} · prochaine question ×${fmt(mult)}</p>` : `<p class="streak muted">Première question du tour · ×${fmt(mult)}</p>`;
  if(S.points==="diff"){
    h += `<div class="diffs">`+m.diffs.map(d=>`<button class="diff d${d}" data-act="ask" data-d="${d}"><span class="dl">${DIFF[d]}</span><span class="dv">+${Math.ceil(d*mult)}</span><span class="ds">${d} pt${d>1?"s":""} × ${fmt(mult)}</span></button>`).join("")+`</div>`;
  } else {
    h += `<div class="center"><button class="btn primary xl" data-act="ask" data-primary>Tirer une question</button><p class="muted small" style="margin-top:10px">Valeur tirée au hasard entre 1 et 3 points, puis × ${fmt(mult)}</p></div>`;
  }
  if(m.qod && S.pot>0){
    h += `<button class="toggle ${S.qod?"on":""}" data-act="toggleQod"><span class="sw"></span><span><b>Quitte ou double</b><br><span class="muted small">Juste : ton pot (${S.pot}) double, puis la question s'ajoute. Faux : tu bois le double.</span></span></button>`;
  }
  h += gaugeHTML(false);
  if(S.streak>0) h += `<div class="actions"><button class="btn ghost" data-act="stop">Finalement, je m'arrête (${S.active.inversion?"je bois":"je distribue"} ${S.pot})</button></div>`;
  return h;
}

function timerHTML(){
  if(!(S.timerSec>0)) return "";
  return `<div class="timer" id="timer"><span>⏱️</span><div class="tbar"><i></i></div><span class="tsec">${S.timerSec} s</span></div>`;
}

function vQuestion(){
  const q=S.q;
  return `${banners()}${timerHTML()}<div class="qmeta"><span class="chip">${esc(q.c)}</span><span class="chip d${q.d}">${DIFF[q.d]}</span><span class="chip gold">+${S.qVal} point${S.qVal>1?"s":""}</span>${S.qod?`<span class="chip bad">Quitte ou double</span>`:""}<span class="chip ghost">${esc(P().name)} · pot ${S.pot}${S.streak?` · 🔥 ${S.streak}`:""}</span></div>
  <h2 class="qtext">${esc(q.q)}</h2>${answersHTML(q,{act:"ans"})}<p class="hint">Clique ou tape ${"ABCDEF".slice(0,q.opts.length).split("").join(", ")}</p>`;
}

function vSuspense(){
  const q=S.q;
  const steal = S.suspKind==="steal";
  const who = steal ? S.players[S.thief].name : P().name;
  const picked = steal ? S.stealPick : S.pick;
  return `${steal?"":banners()}<div class="suspense" style="--susp:${SUSPENSE_MS}ms"><span>🔒 ${esc(who)} a choisi ${"ABCDEF"[picked]}...</span><div class="bar"><i></i></div></div>
  <h2 class="qtext">${esc(q.q)}</h2>${answersHTML(q,{picked,wrong:steal?[S.pick]:[]})}`;
}

function vSteal(){
  const th=S.players[S.thief];
  return `<div class="result bad"><div class="big">Raté !</div><div>${esc(P().name)} boit <b>${g(S.res.amount)}</b>.</div></div>
  <div class="banner">🥷 <b>Braquage !</b> ${esc(th.name)}, tu peux voler la question. Juste : tu distribues <b>${S.stealAmt}</b>. Faux : tu bois <b>${cap(2)}</b>.</div>
  <h2 class="qtext">${esc(S.q.q)}</h2>${answersHTML(S.q,{act:"stealAns",wrong:[S.pick],disabled:[S.pick]})}`;
}

function vReveal(){
  const q=S.q, p=P();
  const wrong=[]; if(!S.lastOk && S.pick>=0) wrong.push(S.pick); if(S.steal && !S.steal.ok) wrong.push(S.steal.pick);
  let h="";
  if(S.fxView==="break") h+=`<div class="crack">${CRACK_SVG}</div>`;
  if(S.lastOk){
    h += turnHeader();
    h += `<div class="result good"><div class="big">Bonne réponse !</div><div>+${S.gain} · pot de ${esc(p.name)} : <b>${S.pot}</b>${S.streak>=3?` · 🔥 série de ${S.streak}`:""}</div></div>`;
  } else if(S.res.type==="invFail"){
    h += `<div class="result violet"><div class="big">${S.timedOut?"⏰ Temps écoulé... ":"Raté... "}mais inversion !</div><div>${esc(p.name)} s'est trompé, donc il distribue <b>${S.res.amount}</b>.</div></div>`;
  } else {
    const capNote = S.res.raw>S.res.amount ? ` <span class="muted">(plafonné, au lieu de ${S.res.raw})</span>` : "";
    const title = S.timedOut ? "⏰ Temps écoulé !" : S.broken>=3 ? `💔 Série de ${S.broken} brisée !` : "Raté !";
    h += `<div class="result bad"><div class="big">${title}</div><div>${esc(p.name)} boit <b>${g(S.res.amount)}</b>${capNote}</div></div>`;
    if(S.steal){
      const th=S.players[S.thief];
      h += S.steal.ok ? `<div class="result good">🥷 ${esc(th.name)} a volé la question et va distribuer <b>${S.stealAmt}</b> !</div>`
                      : `<div class="result bad">🥷 ${esc(th.name)} rate aussi et boit <b>${g(S.steal.drank)}</b>.</div>`;
    }
  }
  h += `<h2 class="qtext sm">${esc(q.q)}</h2>${answersHTML(q,{reveal:true,wrong})}`;
  if(q.i) h += `<div class="info"><span class="il">Le saviez-vous ?</span>${esc(q.i)}</div>`;
  if(S.lastOk){
    const nm = mode().mult(S.streak+1)*(S.active.double?2:1);
    h += gaugeHTML(true);
    h += `<div class="actions"><button class="btn good lg" data-act="stop">${S.active.inversion?`S'arrêter (tu bois ${S.pot})`:`Encaisser : distribuer ${S.pot}`}</button><button class="btn primary lg" data-act="cont">Continuer · prochaine ×${fmt(nm)}</button></div>`;
  } else if(S.res.type==="invFail"){
    h += `<div class="actions"><button class="btn primary lg" data-act="invDist" data-primary>Distribuer ${S.res.amount}</button></div>`;
  } else if(S.steal && S.steal.ok){
    h += `<div class="actions"><button class="btn primary lg" data-act="stealDist" data-primary>${esc(S.players[S.thief].name)} distribue ${S.stealAmt}</button></div>`;
  } else {
    h += `<div class="actions"><button class="btn primary lg" data-act="endTurn" data-primary>Tour suivant</button></div>`;
  }
  return h;
}

function vDist(){
  const D=S.dist, from=S.players[D.from], rem=distRem();
  const rows = S.players.map((p,i)=> i===D.from ? "" : `<div class="drow"><span class="dn">${esc(p.name)}</span><div class="dctl">
      <button class="rb" data-act="dMinus" data-i="${i}" ${D.alloc[i]?"":"disabled"}>−</button><span class="dval">${D.alloc[i]}</span>
      <button class="rb" data-act="dPlus" data-i="${i}" ${canAdd(i)?"":"disabled"}>+</button>
      <button class="btn ghost sm" data-act="dAll" data-i="${i}" ${canAdd(i)?"":"disabled"}>Tout</button></div></div>`).join("");
  const note = D.total<D.orig ? `<p class="muted small">Plafond : ${D.orig} ramené à ${D.total} (${S.cap} max par personne).</p>` : "";
  const why = D.next==="resume" ? `<div class="banner">🏆 Récompense de succès</div>` : D.next==="afterEst" ? `<div class="banner">📏 Gagnant de l'estimation</div>` : "";
  return `${why}<div class="disthead"><div><span class="lbl">Distribution</span><h2>${esc(from.name)} distribue <span class="gold">${g(D.total)}</span></h2></div>
    <div class="rem ${rem===0?"ok":""}"><span class="lbl">Reste</span><span class="potv">${rem}</span></div></div>${note}
    <div class="drows">${rows}</div>
    <div class="actions"><button class="btn ghost" data-act="dRandom">🎲 Au hasard</button><button class="btn ghost" data-act="dReset">Remettre à zéro</button><button class="btn primary lg" data-act="dOk" data-primary ${rem===0?"":"disabled"}>Valider</button></div>`;
}

function vMsg(){
  return `<div class="result violet"><div class="big">${S.msg.title}</div><div>${S.msg.text}</div></div>
  <div class="actions"><button class="btn primary lg" data-act="msgNext" data-primary>${S.msg.btn}</button></div>`;
}

function vEvent(){
  return `<div class="event"><div class="lbl">Événement</div><div class="evemoji">${S.ev.emoji}</div><div class="evtitle">${S.ev.title}</div><div class="evtext">${S.evText}</div></div>
  <div class="actions"><button class="btn primary lg" data-act="afterEvent" data-primary>Continuer</button></div>`;
}

function vDuel(){
  const D=S.duel, a=S.players[D.a], b=S.players[D.b];
  let h = `<div class="event"><div class="lbl">Événement</div><div class="evemoji">⚔️</div><div class="evtitle">Duel : ${esc(a.name)} contre ${esc(b.name)}</div><div class="evtext">Même question pour les deux. Chaque perdant boit <b>${g(cap(3))}</b>.</div></div>`;
  if(D.step<2){
    const who = D.ans[0]==null ? a : b, other = D.ans[0]==null ? b : a;
    const st = (p,k)=>`${esc(p.name)} ${D.ans[k]!=null?"✅":"⏳"}`;
    h += MP.on ? `<div class="banner">📱 ${esc(a.name)} et ${esc(b.name)} répondent chacun sur leur téléphone, sans se montrer. ${st(a,0)} · ${st(b,1)}</div>`
      : `<div class="banner">${D.step===1?`✅ Réponse de ${esc(D.ans[0]!=null?a.name:b.name)} enregistrée. `:""}<b>${esc(who.name)}</b>, à toi. ${esc(other.name)}, ne regarde pas l'écran !</div>`;
    h += `<h2 class="qtext">${esc(D.q.q)}</h2>${answersHTML(D.q,{act:"duelAns"})}`;
  } else {
    const okA=D.ans[0]===D.q.correct, okB=D.ans[1]===D.q.correct;
    const line=(p,ok,i)=>`<div class="result ${ok?"good":"bad"}"><b>${esc(p.name)}</b> a répondu ${"ABCDEF"[i]} : ${ok?"juste !":`faux, boit ${g(cap(3))}.`}</div>`;
    h += line(a,okA,D.ans[0]) + line(b,okB,D.ans[1]);
    if(okA&&okB) h += `<p class="center muted">Égalité parfaite, personne ne boit.</p>`;
    const wrong=[D.ans[0],D.ans[1]].filter(x=>x!==D.q.correct);
    h += `<h2 class="qtext sm">${esc(D.q.q)}</h2>${answersHTML(D.q,{reveal:true,wrong})}`;
    if(D.q.i) h += `<div class="info"><span class="il">Le saviez-vous ?</span>${esc(D.q.i)}</div>`;
    h += `<div class="actions"><button class="btn primary lg" data-act="afterEvent" data-primary>Continuer</button></div>`;
  }
  return h;
}

function vEst(){
  const E=S.est, e=E.e;
  const pending=E.order.filter(i=>!(i in E.vals)); const pi=pending[0], p=S.players[pi];
  const done=E.order.filter(i=>i in E.vals).map(i=>`<span class="chip gold">✅ ${esc(S.players[i].name)}</span>`).join("");
  const todo=pending.slice(1).map(i=>`<span class="chip ghost">${esc(S.players[i].name)}</span>`).join("");
  return `<div class="event"><div class="lbl">Estimation · tout le monde joue</div><div class="evemoji">📏</div><div class="qtext" style="margin:6px auto 10px;max-width:720px">${esc(e.q)}</div>
    <div class="evtext">${MP.on?`📱 Chacun répond en secret sur son téléphone. Pour un joueur sans téléphone, saisis ici la réponse de <b>${esc(p.name)}</b>${e.u?` (en ${esc(e.u)})`:""}.`:`À <b>${esc(p.name)}</b> d'entrer son estimation${e.u?` (en ${esc(e.u)})`:""}. Les autres ne regardent pas !`}</div></div>
    <form class="estform" data-form="est"><input id="estIn" class="inp" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="?"><span class="unit">${esc(e.u)}</span><button class="btn primary lg" type="submit">Valider</button></form>
    ${E.err?`<p class="msg err center">${esc(E.err)}</p>`:""}
    <div class="chips" style="justify-content:center;margin-top:14px">${done}${todo}</div>`;
}

function vEstReveal(){
  const E=S.est, e=E.e, R=E.res;
  const rows=R.rows.map((r,k)=>{
    const close=Math.max(0,1-Math.min(r.err,1)); const pc=Math.round(close*100);
    const tag = r.pi===R.win ? "🏆" : R.losers.includes(r.pi) ? "🍺" : (k+1);
    return `<div class="erow"><span>${tag}</span><b>${esc(S.players[r.pi].name)}</b><div class="pbar"><i style="width:${pc}%;background:${ringColor(pc)}"></i></div><span class="v">${numFR(r.v)}</span><span class="e">${r.err<0.001?"pile !":`écart ${fmt(r.err*100)} %`}</span></div>`;
  }).join("");
  const w=S.players[R.win];
  return `<div class="event"><div class="lbl">Estimation · réponse</div><div class="qtext sm" style="margin:6px auto">${esc(e.q)}</div>
    <div class="estans">${numFR(e.a)} ${esc(e.u)}</div></div>
    <div class="card" style="margin:12px 0">${rows}</div>
    ${e.i?`<div class="info"><span class="il">Le saviez-vous ?</span>${esc(e.i)}</div>`:""}
    <div class="result good" style="margin-top:14px"><b>${esc(w.name)}</b> est le plus proche${R.exact?" et tombe pile":""} : il distribue <b>${g(R.amount)}</b>.${R.losers.length?` ${R.losers.map(i=>`<b>${esc(S.players[i].name)}</b>`).join(", ")} ${R.losers.length>1?"boivent":"boit"} <b>${g(R.d)}</b>.`:""}</div>
    <div class="actions"><button class="btn primary lg" data-act="estDist" data-primary>${esc(w.name)} distribue ${R.amount}</button></div>`;
}

function vAchOverlay(){
  const a=S.achShow; const A=ACH_BY[a.id], T=TIERS[A.tier], p=S.players[a.pi];
  let reward;
  if(T.reward==="cul"){
    reward = `<div class="achreward">Récompense légendaire : désigne un joueur qui finit son verre <b>cul sec</b>.</div>
      <div class="achgrid">${S.players.map((q,i)=>i===a.pi?"":`<button class="btn" data-act="achCul" data-i="${i}">${esc(q.name)}</button>`).join("")}</div>`;
  } else {
    reward = `<div class="achreward">Récompense : ${esc(p.name)} distribue <b>${g(T.reward)}</b></div>
      <div class="actions" style="margin-top:6px"><button class="btn primary lg" data-act="achDist" data-primary>Distribuer ${T.reward}</button></div>`;
  }
  return `<div class="overlay"><div class="achcard tier${A.tier}">
    <div class="achicon">${A.icon}</div><div class="lbl" style="margin-top:8px">${T.icon} Succès ${T.name} débloqué</div>
    <div class="achname">${esc(A.name)}</div><div class="muted">${esc(A.desc)}</div>
    <div class="achwho">${esc(p.name)}</div>${reward}
    <div style="margin-top:12px"><button class="btn ghost sm" data-act="achSkip">Renoncer à la récompense</button></div></div></div>`;
}

function vScore(){
  const hl = ["choose","question","suspense","reveal","steal"].includes(S.phase);
  const ranked=[...S.players].map((p,i)=>({i,n:net(p)})).sort((a,b)=>b.n-a.n);
  const leader = ranked.length>1 && ranked[0].n>ranked[1].n && ranked[0].n>0 ? ranked[0].i : -1;
  return `<div class="score">`+S.players.map((p,i)=>{
    const w=pct(p.ok,p.tot); const nt=net(p);
    const rank=ranked.findIndex(r=>r.i===i)+1;
    const streak = i===S.cur && hl && S.streak>0 ? `<span class="pflame">🔥<small>${S.streak}</small></span>` : "";
    return `<div class="pchip ${hl&&i===S.cur?"cur":""} ${i===leader?"lead":""}" title="Taux de réussite ${w} % (${p.ok} bonnes / ${p.tot-p.ok} ratées)">${streak}
      <div class="ring" style="--p:${w};--c:${ringColor(w)}"><span>${p.tot?w+"%":"?"}</span></div>
      <div class="pinfo"><span class="pn">${i===leader?"👑 ":`<span class="muted">#${rank}</span> `}${esc(p.name)}</span>
      <span class="ps"><span>${p.ok}V / ${p.tot-p.ok}D</span><b class="${nt>0?"pos":nt<0?"neg":""}">${sgn(nt)}</b></span>
      <span class="ps"><span>🍺 ${p.drunk}</span><span>🎯 ${p.given}</span><span>🔥 ${p.best}</span></span></div></div>`;
  }).join("")+`</div>`;
}

function vGame(){
  const m=mode();
  if(!S.achShow && S.achQ.length && OVERLAY_OK.includes(S.phase)){ S.achShow=S.achQ.shift(); S.achNew=true; }
  const prog = S.endType==="rounds" ? `Tour ${Math.min(S.round,S.endVal)} / ${S.endVal}` : `Moyenne ${fmt(avgDrunk())} / ${S.endVal} gorgées`;
  const views = {choose:vChoose,question:vQuestion,suspense:vSuspense,steal:vSteal,reveal:vReveal,dist:vDist,msg:vMsg,event:vEvent,duel:vDuel,est:vEst,estReveal:vEstReveal};
  const st = ["choose","question","suspense","reveal"].includes(S.phase) ? streakTier(S.streak) : 0;
  return `<div class="topbar"><div class="brand">Trivial <span>Pourcuite</span></div>
    <div class="chips"><span class="chip">${m.emoji} ${m.name}</span><span class="chip">${prog}</span>${S.cap>0?`<span class="chip ghost">Plafond ${S.cap}</span>`:""}${S.timerSec>0?`<span class="chip ghost">⏱️ ${S.timerSec} s</span>`:""}<button class="iconbtn" data-act="toggleSound" title="Sons">${SETUP.sound?"🔊":"🔇"}</button><button class="btn ghost sm" data-act="quitGame">Terminer</button></div></div>
    ${vScore()}
    <div class="stage ${S.anim||""} ${st?"st"+st:""}">${views[S.phase]()}</div>
    ${S.achShow?vAchOverlay():""}`;
}

/* ---------- Fin de partie ---------- */
function vEnd(){
  const ps=S.players;
  const total=ps.reduce((s,p)=>s+p.drunk,0);
  const best = (fn,min) => { const vals=ps.map(fn).map(v=>v==null?NaN:v); const ok=vals.filter(v=>!isNaN(v)); if(!ok.length) return null; const t=min?Math.min(...ok):Math.max(...ok); if(!min && !(t>0)) return null; return {names:ps.filter((p,i)=>vals[i]===t).map(p=>p.name),v:t}; };
  const acc = p => p.tot>=3 ? p.ok/p.tot : 0;
  const aw = [
    ["🧽","L'Éponge","a le plus bu",best(p=>p.drunk),v=>g(v)],
    ["😈","Le Bourreau","a le plus fait boire",best(p=>p.given),v=>`${g(v)} distribuée${v>1?"s":""}`],
    ["🎓","L'Encyclopédie","meilleur taux de réussite (3 réponses min.)",best(acc),v=>`${Math.round(v*100)} % de bonnes réponses`],
    ["🔥","La Série","plus longue série",best(p=>p.best),v=>`${v} bonne${v>1?"s":""} réponse${v>1?"s":""} d'affilée`],
    ["💥","Le Kamikaze","plus grosse chute en une fois",best(p=>p.maxLoss),v=>`${g(v)} d'un coup`],
    ["🏅","Le Collectionneur","le plus de succès",best(p=>p.ach.length),v=>`${v} succès`],
    ["🔮","L'Oracle","meilleure précision aux estimations",best(p=>p.estN?p.estErr/p.estN:null,true),v=>`${fmt(v*100)} % d'écart moyen`]
  ].filter(a=>a[3]);
  const awards = aw.map(a=>`<div class="award"><div class="ae">${a[0]}</div><div class="at">${a[1]}</div><div class="an">${a[3].names.map(esc).join(", ")}</div><div class="av">${a[2]} · ${a[4](a[3].v)}</div></div>`).join("");

  const order=[...ps].map((p,i)=>({p,i})).sort((a,b)=>net(b.p)-net(a.p));
  const medals=["🥇","🥈","🥉"];
  const cards = order.map((o,k)=>{
    const p=o.p, w=pct(p.ok,p.tot), nt=net(p);
    const dbars=[1,2,3].filter(d=>p.byD[d].tot>0).map(d=>{ const s=p.byD[d]; const r=pct(s.ok,s.tot); return `<div class="dbar"><span class="chip d${d}" style="padding:2px 8px">${DIFF[d]}</span><div class="pbar"><i style="width:${r}%;background:${ringColor(r)}"></i></div><span class="muted">${s.ok}/${s.tot}</span></div>`; }).join("") || `<p class="muted small">Aucune question jouée.</p>`;
    const cats=Object.entries(p.byCat).filter(([c,s])=>s.tot>=2).map(([c,s])=>({c,r:s.ok/s.tot,s}));
    cats.sort((a,b)=>b.r-a.r);
    const strong = cats.length ? `💪 ${esc(cats[0].c)} (${pct(cats[0].s.ok,cats[0].s.tot)} %)` : "";
    const weak = cats.length>1 ? `🩹 ${esc(cats[cats.length-1].c)} (${pct(cats[cats.length-1].s.ok,cats[cats.length-1].s.tot)} %)` : "";
    const badges = p.ach.length ? p.ach.map(id=>{ const A=ACH_BY[id]; return `<span class="badge tier${A.tier}" title="${esc(A.desc)}">${TIERS[A.tier].icon} ${esc(A.name)}</span>`; }).join("") : `<span class="muted small">Aucun succès</span>`;
    return `<div class="kcard ${k===0?"first":""}">
      <div class="khead"><div class="ring big" style="--p:${w};--c:${ringColor(w)}"><span>${p.tot?w+"%":"?"}</span></div>
        <div><div class="krank">${medals[k]||"#"+(k+1)} · ${p.ok}V / ${p.tot-p.ok}D</div><div class="kname">${esc(p.name)}</div><div class="${nt>0?"pos":nt<0?"neg":"muted"}" style="font-weight:800">Balance ${sgn(nt)}</div></div></div>
      <div class="ktiles">
        <div class="ktile"><div class="kv">${p.drunk}</div><div class="kl">🍺 Bues</div></div>
        <div class="ktile"><div class="kv">${p.given}</div><div class="kl">🎯 Distribuées</div></div>
        <div class="ktile"><div class="kv">${p.best}</div><div class="kl">🔥 Meilleure série</div></div>
        <div class="ktile"><div class="kv">${p.estN?fmt(100-p.estErr/p.estN*100)+" %":"?"}</div><div class="kl">📏 Précision estim.</div></div>
      </div>
      <div class="dbars">${dbars}</div>
      ${strong||weak?`<p class="small" style="margin-bottom:10px">${[strong,weak].filter(Boolean).join(" · ")}</p>`:""}
      ${p.gaugePaid||p.timeouts||p.culsec?`<p class="muted small" style="margin-bottom:10px">${[p.gaugePaid?`📊 ${g(p.gaugePaid)} payées pour la jauge`:"",p.timeouts?`⏰ ${p.timeouts} temps écoulé${p.timeouts>1?"s":""}`:"",p.culsec?`🍺 ${p.culsec} cul sec`:""].filter(Boolean).join(" · ")}</p>`:""}
      <div class="badges">${badges}</div></div>`;
  }).join("");

  const maxAbs=Math.max(1,...ps.map(p=>Math.abs(net(p))));
  const netChart=order.map(o=>{ const n=net(o.p); const w=Math.abs(n)/maxAbs*50; const style=n>=0?`left:50%;width:${w}%;background:var(--good)`:`right:50%;width:${w}%;background:var(--bad)`; return `<div class="crow"><span class="n">${esc(o.p.name)}</span><div class="cbar"><span class="mid"></span><i style="${style}"></i></div><span class="v ${n>0?"pos":n<0?"neg":""}">${sgn(n)}</span></div>`; }).join("");
  const accOrder=[...ps].sort((a,b)=>pct(b.ok,b.tot)-pct(a.ok,a.tot));
  const accChart=accOrder.map(p=>{ const w=pct(p.ok,p.tot); return `<div class="crow"><span class="n">${esc(p.name)}</span><div class="cbar"><i style="left:0;width:${w}%;background:${ringColor(w)}"></i></div><span class="v">${w} %</span></div>`; }).join("");

  const rows = [...ps].sort((x,y)=>y.drunk-x.drunk).map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td class="n">${p.drunk}</td><td class="n">${p.given}</td><td class="n">${sgn(net(p))}</td><td class="n">${p.ok} / ${p.tot}${p.tot?` (${pct(p.ok,p.tot)} %)`:""}</td><td class="n">${p.best}</td><td class="n">${p.ach.length}</td></tr>`).join("");
  return `<div class="home" style="padding-top:2vh"><div class="logo">🏁</div><h1 class="title">Fin de <span>partie</span></h1>
    <p class="sub">${S.turns} tours de joueur · ${g(total)} bues au total · moyenne de ${fmt(total/ps.length)} par joueur</p></div>
    <div class="awards">${awards}</div>
    <h3 class="lbl" style="margin:8px 0 10px">📊 Tableau de bord</h3>
    <div class="kgrid">${cards}</div>
    <div class="grid2">
      <div class="card"><h3>Balance nette (distribuées − bues)</h3><div class="chart">${netChart}</div></div>
      <div class="card"><h3>Taux de réussite</h3><div class="chart">${accChart}</div></div>
    </div>
    <div class="card"><h3>Classement</h3><div class="tablewrap"><table><thead><tr><th>#</th><th>Joueur</th><th class="n">Bues</th><th class="n">Distribuées</th><th class="n">Balance</th><th class="n">Bonnes réponses</th><th class="n">Série max</th><th class="n">Succès</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="actions"><button class="btn primary lg" data-act="start">Rejouer (mêmes réglages)</button><button class="btn lg" data-act="goHall">🏆 Palmarès</button><button class="btn lg" data-act="goSetup">Changer les réglages</button><button class="btn ghost lg" data-act="goHome">Menu</button></div>`;
}

  <section class="card"><h3>Joueurs, toutes parties confondues</h3>

  </section>
  <section class="card"><h3>Succès</h3><div class="tablewrap"><table><tbody>${achRows}</tbody></table></div></section>
  <section class="card"><h3>Sauvegarde</h3>
    <p class="muted small" style="margin-bottom:12px">Tout est enregistré dans ce navigateur. Pour ne rien perdre (changement d'ordinateur, données effacées), exporte ta progression de temps en temps.</p>
    <div class="row"><button class="btn" data-act="exportSave">Exporter toute la progression</button><button class="btn" data-act="importSaveClick">Importer une progression</button><input type="file" id="importSave" accept=".json,application/json" hidden><button class="btn ghost" data-act="resetProfiles">Effacer le palmarès</button></div>
    ${ED.msg?`<p class="msg ${ED.err?"err":"ok"}">${esc(ED.msg)}</p>`:""}</section>`;
}

  const calib = all.map(q=>({q,s:QSTATS[qkey(q)]})).filter(x=>x.s && x.s.n>=4).map(x=>({...x,r:x.s.ok/x.s.n}))
    .filter(x=>(x.q.d===1 && x.r<0.4) || (x.q.d===3 && x.r>0.8) || (x.q.d===2 && (x.r>0.9 || x.r<0.2)))
    .slice(0,15).map(x=>`<div class="qitem"><div><span class="chip d${x.q.d}">${DIFF[x.q.d]}</span> <span class="chip">${Math.round(x.r*100)} % sur ${x.s.n}</span><p>${esc(x.q.q)}</p></div><span class="muted small">${x.r>0.5?"Plus facile que prévu":"Plus dure que prévu"}</span></div>`).join("");
  const list = CUSTOM.length ? CUSTOM.map((q,i)=>`<div class="qitem"><div><span class="chip">${esc(q.c)}</span> <span class="chip d${q.d}">${DIFF[q.d]}</span><p>${esc(q.q)}</p><p class="muted small">✓ ${esc(q.a[0])} · ✗ ${q.a.slice(1).map(esc).join(" · ")}</p></div><button class="btn ghost sm" data-act="delQ" data-i="${i}">Supprimer</button></div>`).join("")
    : `<p class="muted">Aucune question ajoutée pour l'instant.</p>`;
  const wrongs = [1,2,3,4,5].map(k=>`<input id="fA${k}" class="inp" placeholder="Mauvaise réponse ${k}${k===1?" (obligatoire)":k>=4?" (facultative)":""}">`).join("");
  return `<div class="topbar"><button class="btn ghost sm" data-act="goHome">← Menu</button><h2>Gérer les questions</h2><span style="width:70px"></span></div>
  <section class="card"><h3>Mémoire des questions</h3>
    <p style="margin-bottom:10px"><b>${seenN}</b> questions déjà posées sur ${all.length} · <b>${all.length-seenN}</b> jamais posées.</p>
    <div class="pbar" style="height:12px;margin-bottom:12px"><i style="width:${pct(seenN,all.length)}%;background:var(--gold)"></i></div>
    <button class="btn ghost sm" data-act="resetSeen">Tout remettre à zéro (reposer toutes les questions)</button></section>
  <section class="card"><h3>Ajouter une question</h3>
    <div class="stack">
      <div class="grid2">
        <label class="f">Catégorie<input id="fC" class="inp" list="catlist" value="${esc(ED.lastCat)}" placeholder="Existante ou nouvelle"></label>
        <label class="f">Difficulté<select id="fD" class="inp">${[1,2,3].map(d=>`<option value="${d}" ${ED.lastD===d?"selected":""}>${DIFF[d]} (${d} pt${d>1?"s":""})</option>`).join("")}</select></label>
      </div>
      <datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
      <label class="f">Question<textarea id="fQ" class="inp" rows="2"></textarea></label>
      <label class="f">Bonne réponse<input id="fA0" class="inp ok"></label>
      <div class="grid2">${wrongs}</div>
      <label class="f">Explication « Le saviez-vous ? » (facultative)<textarea id="fI" class="inp" rows="2"></textarea></label>
      <div><button class="btn primary" data-act="addQ">Ajouter la question</button></div>
    </div>
    ${ED.msg?`<p class="msg ${ED.err?"err":"ok"}">${esc(ED.msg)}</p>`:""}
  </section>
  <section class="card"><h3>Sauvegarde et partage</h3>
    <p class="muted small" style="margin-bottom:12px">Les questions ajoutées sont enregistrées dans ce navigateur. Vider les données du navigateur les efface : exporte-les régulièrement. L'import accepte un fichier .json (liste d'objets {c, d, q, a, i}, bonne réponse en premier dans a).</p>
    <div class="row"><button class="btn" data-act="exportMine">Exporter mes questions</button><button class="btn" data-act="exportAll">Exporter toutes les questions</button><button class="btn" data-act="importClick">Importer un fichier .json</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden></div></section>
  <section class="card"><h3>Calibration (taux de réussite réel)</h3>${calib||`<p class="muted small">Pas encore assez de données : une question apparaît ici quand elle a été jouée au moins 4 fois et que son taux de réussite ne colle pas à son niveau.</p>`}</section>
  <section class="card"><h3>Répartition (${all.length} questions)</h3><div class="tablewrap"><table><thead><tr><th>Catégorie</th><th class="n">Facile</th><th class="n">Moyen</th><th class="n">Difficile</th><th class="n">Total</th><th class="n">Jamais posées</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="card"><h3>Mes questions (${CUSTOM.length})</h3>${list}</section>`;
}

/* ===================== Rendu ===================== */
function render(){
  const app=$("#app");
  const views={home:vHome,setup:vSetup,rules:vRules,editor:vEditor,game:vGame,end:vEnd,hall:vHall,mpHost:vMpHost,mpJoin:vMpJoin,mirror:vMirror};
  if(screen==="game" && S) S.fxView = S.fx ? S.fx.type : null;
  app.innerHTML = views[screen]();
  const fxInfo = (MP.on && MP.role==="host" && screen==="game" && S && (S.fx || S.achNew)) ? {fx:S.fx?{type:S.fx.type,streak:S.fx.streak||0}:null, ach:(S.achNew && S.achShow)?ACH_BY[S.achShow.id].tier:0} : null;
  postRender();
  if(MP.on && MP.role==="host") mpSchedule(fxInfo);
  mpBar();
}
function playFxVisual(fx,achTier){
  if(REDUCED) return;
  if(fx){
    if(fx.type==="win"){
      const el=document.querySelector(".ans.correct")||document.querySelector(".stage");
      if(el){ const [x,y]=centerOf(el); const n=Math.min(10+fx.streak*8,110); const cols=fx.streak>=8?["#a5b8ff","#dbe5ff","#8fd3ff","#fff"]:["#ffb627","#ff8c1a","#34d399","#ffe08a","#fff"]; burst(x,y,n,cols,{up:true,power:200+fx.streak*25}); }
    } else if(fx.type==="break"){
      const el=document.querySelector(".stage"); if(el){ const [x,y]=centerOf(el); burst(x,y-60,46,[],{shard:true,power:360,gravity:320}); }
    } else if(fx.type==="estwin"){
      const el=document.querySelector(".estans"); if(el){ const [x,y]=centerOf(el); burst(x,y,50,["#ffb627","#34d399","#60a5fa","#fff"],{up:true,power:260}); }
    }
  }
  if(achTier){
    const c=document.querySelector(".achcard"); if(c){ const [x,y]=centerOf(c); burst(x,y-80,30+achTier*20,["#ffb627","#ff8c1a","#fff","#a78bfa","#34d399"],{up:true,power:300+achTier*40}); }
  }
}
function postRender(){
  if(screen==="mirror"){ mpClientPost(); return; }
  if(screen==="mpHost"){ mpDrawQR(); }
  if(screen!=="game" || !S){ document.body.classList.remove("alarm"); return; }
  S.anim=null;
  document.querySelectorAll("[data-count]").forEach(animateCount);
  S.potFrom=S.pot;
  const fx=S.fx; S.fx=null; S.fxView=null;
  const achTier = (S.achNew && S.achShow) ? ACH_BY[S.achShow.id].tier : 0;
  if(S.achNew){ S.achNew=false; SFX.fanfare(); }
  playFxVisual(fx,achTier);
  if(S.cycleMsg){ S.cycleMsg=false; showToast("♻️ Toutes les questions de ce niveau ont été posées : nouveau cycle !"); }
  if(S.phase==="question" && S.timer) updateTimerUI(); else if(S.phase!=="question") document.body.classList.remove("alarm");
  const ranked=[...S.players].map((p,i)=>({i,n:net(p)})).sort((a,b)=>b.n-a.n);
  const leader = ranked.length>1 && ranked[0].n>ranked[1].n && ranked[0].n>0 ? ranked[0].i : -1;
  if(leader>=0 && S.leader!==leader){ if(S.leader!==undefined && S.leader!==null) showToast(`👑 ${esc(S.players[leader].name)} prend la tête du classement !`); S.leader=leader; }
  const ei=document.getElementById("estIn"); if(ei){ try{ ei.focus(); }catch(e){} }
}
function go(s){ screen=s; ED.msg=""; render(); window.scrollTo(0,0); }

/* ===================== Actions ===================== */
const A = {
  goHome(){ go("home"); }, goSetup(){ go("setup"); }, goRules(){ go("rules"); }, goEditor(){ go("editor"); }, goHall(){ go("hall"); },
  nMinus(){ if(SETUP.n>2){ SETUP.n--; saveSetup(); render(); } },
  nPlus(){ if(SETUP.n<12){ SETUP.n++; saveSetup(); render(); } },
  setMode(el){ SETUP.mode=el.dataset.v; if(!SETUP.capTouched) SETUP.cap=MODES[SETUP.mode].cap; saveSetup(); render(); },
  setPoints(el){ SETUP.points=el.dataset.v; saveSetup(); render(); },
  setEnd(el){ SETUP.endType=el.dataset.v; saveSetup(); render(); },
  setTimer(el){ SETUP.timer=Number(el.dataset.v); saveSetup(); render(); },
  setEst(el){ SETUP.estEvery=Number(el.dataset.v); saveSetup(); render(); },
  setSound(el){ SETUP.sound=el.dataset.v==="1"; saveSetup(); render(); if(SETUP.sound) SFX.coin(); },
  toggleSound(){ SETUP.sound=!SETUP.sound; saveSetup(); render(); if(SETUP.sound) SFX.coin(); },
  toggleCat(el){
    const c=el.dataset.v; let cur = SETUP.cats ? SETUP.cats.slice() : allCats();
    if(cur.includes(c)){ if(cur.length>1) cur=cur.filter(x=>x!==c); } else cur.push(c);
    SETUP.cats=cur; saveSetup(); render();
  },
  allCatsOn(){ SETUP.cats=null; saveSetup(); render(); },
  start(){
    if(S){ stopTimer(); clearTimeout(S.suspT); }
    const names=[];
    for(let i=0;i<SETUP.n;i++){
      let nm=(SETUP.names[i]||"").trim()||("Joueur "+(i+1)); const base=nm; let k=2;
      while(names.map(pkey).includes(pkey(nm))) nm=base+" "+(k++);
      names.push(nm);
    }
    const avail=allCats();
    let cats=(SETUP.cats||avail).filter(c=>avail.includes(c)); if(!cats.length) cats=avail;
    const isR=SETUP.endType==="rounds";
    S = {
      players:names.map(newPlayer),
      mode:SETUP.mode, points:SETUP.points, endType:SETUP.endType,
      endVal:Math.max(1,parseInt(isR?SETUP.endVal:SETUP.avgVal,10)||1),
      cap:Math.max(0,parseInt(SETUP.cap,10)||0), cats,
      timerSec:Math.max(0,Number(SETUP.timer)||0), estEvery:Math.max(0,Number(SETUP.estEvery)||0),
      cur:0, round:1, turns:0, pot:0, potFrom:0, streak:0, pending:{}, active:{}, used:new Set(), usedEst:new Set(), over:false,
      achQ:[], achShow:null, leader:null
    };
    screen="game"; window.scrollTo(0,0); SFX.coin(); startTurn();
  },
  ask(el){ if(S.phase!=="choose") return; SFX.click(); askQuestion(el.dataset.d ? Number(el.dataset.d) : null); },
  toggleQod(){ S.qod=!S.qod; SFX.click(); render(); },
  gauge(){ unlockGauge(); },
  ans(el){ answer(Number(el.dataset.i)); },
  stealAns(el){ stealAnswer(Number(el.dataset.i)); },
  duelAns(el){ duelAnswer(Number(el.dataset.i)); },
  stop(){ doStop(); },
  cont(){ S.phase="choose"; S.qod=false; SFX.click(); render(); },
  invDist(){ openDist(S.cur,S.res.amount,"endTurn"); },
  stealDist(){ openDist(S.thief,S.stealAmt,"endTurn"); },
  endTurn(){ endTurn(); },
  estDist(){ const R=S.est.res; openDist(R.win,R.amount,"afterEst"); },
  dPlus(el){ const i=+el.dataset.i; if(canAdd(i)){ S.dist.alloc[i]++; SFX.click(); render(); } },
  dMinus(el){ const i=+el.dataset.i; if(S.dist.alloc[i]>0){ S.dist.alloc[i]--; render(); } },
  dAll(el){ const i=+el.dataset.i; const room = S.cap>0 ? S.cap-S.dist.alloc[i] : Infinity; S.dist.alloc[i]+=Math.max(0,Math.min(distRem(),room)); render(); },
  dReset(){ S.dist.alloc=S.players.map(()=>0); render(); },
  dRandom(){
    S.dist.alloc=S.players.map(()=>0);
    let guard=0;
    while(distRem()>0 && guard++<10000){
      const el=S.players.map((_,i)=>i).filter(canAdd); if(!el.length) break;
      S.dist.alloc[el[rnd(el.length)]]++;
    }
    render();
  },
  dOk(){
    if(distRem()!==0) return;
    const D=S.dist;
    D.alloc.forEach((x,i)=>{ S.players[i].drunk+=x; });
    S.players[D.from].given+=D.total;
    checkAch(D.from,"given");
    SFX.coin();
    if(D.next==="endTurn") endTurn();
    else if(D.next==="afterEst") afterEstimation();
    else if(D.next==="resume"){ S.phase=S.resumePhase; S.dist=null; render(); }
  },
  achDist(){ achDist(); },
  achCul(el){ achCul(+el.dataset.i); },
  achSkip(){ achSkip(); },
  msgNext(){ if(S.msg.next==="endTurn") endTurn(); else afterEvent(); },
  afterEvent(){ afterEvent(); },
  quitGame(){ if(confirm("Terminer la partie maintenant et afficher le bilan ?")) finish(); },
  addQ(){
    const val=id=>(document.getElementById(id)||{}).value||"";
    const c=val("fC").trim(), d=Number(val("fD")), q=val("fQ").trim(), i=val("fI").trim();
    const a=[val("fA0"),val("fA1"),val("fA2"),val("fA3"),val("fA4"),val("fA5")].map(x=>x.trim());
    const answers=[a[0]].concat(a.slice(1).filter(Boolean));
    ED.lastCat=c; ED.lastD=d;
    if(!c){ ED.msg="Indique une catégorie."; ED.err=true; return render(); }
    if(!q){ ED.msg="La question est vide."; ED.err=true; return render(); }
    if(!a[0]){ ED.msg="Indique la bonne réponse."; ED.err=true; return render(); }
    if(answers.length<2){ ED.msg="Ajoute au moins une mauvaise réponse (3 conseillées)."; ED.err=true; return render(); }
    const obj=normQ({c,d,q,a:answers,i});
    if(!obj){ ED.msg="Deux réponses identiques : corrige-les."; ED.err=true; return render(); }
    if(allQuestions().some(x=>qkey(x)===qkey(obj))){ ED.msg="Cette question existe déjà."; ED.err=true; return render(); }
    CUSTOM.push(obj);
    const saved=saveCustom();
    ED.msg = saved ? "Question ajoutée et enregistrée." : "Question ajoutée pour cette session, mais le navigateur refuse l'enregistrement : exporte-la pour ne pas la perdre.";
    ED.err=!saved; render();
  },
  delQ(el){ const i=+el.dataset.i; if(confirm("Supprimer cette question ?")){ CUSTOM.splice(i,1); saveCustom(); ED.msg="Question supprimée."; ED.err=false; render(); } },
  exportMine(){ if(!CUSTOM.length){ ED.msg="Rien à exporter : tu n'as pas encore ajouté de question."; ED.err=true; return render(); } download("trivial-pourcuite-mes-questions.json",CUSTOM); },
  exportAll(){ download("trivial-pourcuite-toutes-les-questions.json",allQuestions()); },
  importClick(){ const f=document.getElementById("importFile"); if(f) f.click(); },
  resetSeen(){ if(confirm("Remettre à zéro la mémoire ? Toutes les questions pourront de nouveau être posées.")){ SEEN=new Set(); saveSeen(); ED.msg=""; render(); } },
  resetProfiles(){ if(confirm("Effacer définitivement le palmarès et les statistiques de tous les joueurs ?")){ PROFILES={}; saveProfiles(); QSTATS={}; saveQStats(); ED.msg="Palmarès effacé."; ED.err=false; render(); } },
  exportSave(){ download("trivial-pourcuite-progression.json",{app:"trivial-pourcuite",version:2,date:new Date().toISOString(),custom:CUSTOM,seen:[...SEEN],qstats:QSTATS,profiles:PROFILES}); },
  importSaveClick(){ const f=document.getElementById("importSave"); if(f) f.click(); }
};

/* =====================================================================
   MULTIJOUEUR (Firebase Realtime Database)
   L'appareil hôte fait tourner la partie et diffuse son écran.
   Chaque téléphone affiche cet écran et envoie ses actions à l'hôte,
   qui ne les accepte que si c'est bien au tour de ce joueur.
   ===================================================================== */
const FIREBASE_DB_URL = "__FIREBASE_DB_URL__"; /* adresse de la base Realtime Database */
const FB_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const QR_LIB = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
const MP = {on:false, role:null, room:null, db:null, conn:false, id:null, name:"", hostName:"", lobby:{}, hostOnline:true,
  seq:0, cueSeq:0, cues:[], snap:null, lastCue:0, myIdx:-1, pubT:null, lastDrunk:null, sent:false, sentT:null, ct:null,
  boot:"", err:"", busy:false, qr:"", estDraft:"", estQ:"", fxDone:0, tv:0, tStart:0, tLastSec:null};
const CLIENT_ACTS = new Set(["ask","toggleQod","gauge","ans","stealAns","duelAns","stop","cont","invDist","stealDist","endTurn","estDist","dPlus","dMinus","dAll","dReset","dRandom","dOk","achDist","achCul","achSkip","msgNext","afterEvent"]);
const NO_LOCK_ACTS = new Set(["dPlus","dMinus","dAll","dReset","dRandom"]);
const CUE_SOUNDS = new Set(["correct","wrong","glass","fire","coin","fanfare","pay","drum","alarm"]);
const ROOM_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
const FB_RE = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)\/?$/i;
const SAFE_VAL = /^[\w-]{1,40}$/;

/* Les sons joués par l'hôte sont retransmis aux téléphones */
const SFX_RAW = Object.assign({}, SFX);
Object.keys(SFX_RAW).forEach(k=>{ SFX[k]=(...a)=>{ if(CUE_SOUNDS.has(k)) mpCue({k,a:a.length?a:null}); return SFX_RAW[k](...a); }; });
function mpCue(c){
  if(!(MP.on && MP.role==="host")) return;
  MP.cueSeq++; c.s=MP.cueSeq; MP.cues.push(c); if(MP.cues.length>30) MP.cues.shift();
}

function mpClientId(){ let id=lsGet("tp_client_id",null); if(!id){ id=Math.random().toString(36).slice(2,10)+Date.now().toString(36); lsSet("tp_client_id",id); } return id; }
function fbUrl(){
  const u=new URLSearchParams(location.search).get("db");
  const baked = FIREBASE_DB_URL.indexOf("__")===0 ? "" : FIREBASE_DB_URL;
  return String(u||baked||lsGet("tp_fb_url","")||"").trim();
}
const fbBaked = () => FIREBASE_DB_URL.indexOf("__")!==0 && FB_RE.test(FIREBASE_DB_URL);
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); }); }
async function fbInit(url){
  if(!window.firebase || !window.firebase.database){
    await loadScript(FB_SDK+"firebase-app-compat.js");
    await loadScript(FB_SDK+"firebase-database-compat.js");
  }
  if(!(firebase.apps && firebase.apps.length)) firebase.initializeApp({databaseURL:url.replace(/\/$/,"")});
  MP.db = firebase.database();
  MP.db.ref(".info/connected").on("value",s=>{
    MP.conn=!!s.val();
    if(MP.conn && MP.on && MP.room) mpOnConnected();
    mpBar();
  });
}
const rref = p => MP.db.ref(`rooms/${MP.room}${p?"/"+p:""}`);
function mpOnConnected(){
  if(MP.role==="host"){ const r=rref("host/online"); r.onDisconnect().set(false); r.set(true); }
  if(MP.role==="client" && MP.joined){ const r=rref("players/"+MP.id); r.onDisconnect().update({online:false}); r.update({name:MP.name,online:true,t:Date.now()}); }
}
function mpLink(){
  const base=location.origin+location.pathname;
  return `${base}?room=${MP.room}`+(fbBaked()?"":`&db=${encodeURIComponent(fbUrl())}`);
}
function mpLobbyList(){
  return Object.entries(MP.lobby||{}).map(([id,p])=>({id,name:String((p&&p.name)||"").slice(0,18),online:!!(p&&p.online),t:(p&&p.t)||0})).filter(p=>p.name).sort((a,b)=>a.t-b.t);
}

/* ---------- Hôte ---------- */
async function mpCreate(){
  const inp=document.getElementById("fbUrl"); if(inp){ lsSet("tp_fb_url",inp.value.trim()); }
  const url=fbUrl();
  if(!FB_RE.test(url)){ MP.err="Adresse Firebase invalide. Elle doit ressembler à https://ton-projet-default-rtdb.europe-west1.firebasedatabase.app/"; render(); return; }
  MP.err=""; MP.busy=true; render();
  try{ await fbInit(url); }
  catch(e){ MP.busy=false; MP.err="Impossible de charger Firebase : vérifie ta connexion internet."; render(); return; }
  let code=""; for(let k=0;k<4;k++) code+=ROOM_CHARS[rnd(ROOM_CHARS.length)];
  MP.room=code; MP.role="host"; MP.id=mpClientId(); MP.lobby={}; MP.boot=Math.random().toString(36).slice(2,8); MP.cueSeq=0; MP.cues=[]; MP.qr="";
  MP.hostName = MP.hostName || lsGet("tp_my_name","") || "";
  try{ await rref().set({created:Date.now(),host:{online:true,t:Date.now()}}); }
  catch(e){ MP.busy=false; MP.err="Firebase refuse l'accès : vérifie les règles de la base (étape 1.4)."; render(); return; }
  MP.on=true; MP.busy=false;
  mpHostListen();
  document.body.classList.add("mp");
  render();
}
function mpHostListen(){
  mpOnConnected();
  rref("players").on("value",s=>{ MP.lobby=s.val()||{}; mpLobbyRefresh(); });
  rref("actions").on("child_added",s=>{ const a=s.val(); s.ref.remove(); try{ mpHandleAction(a); }catch(e){ console.error(e); } });
}
function mpLobbyRefresh(){
  const box=document.getElementById("lobbyList");
  if(box){ box.innerHTML=mpLobbyHTML(); const b=document.querySelector('[data-act="mpToSetup"]'); if(b) b.textContent=`Continuer vers les réglages (${mpLobbyNames().length} joueur${mpLobbyNames().length>1?"s":""})`; }
  else if(screen==="setup") render();
  mpBar();
  if(MP.on && MP.role==="host" && screen!=="game" && screen!=="end") mpSchedule(null);
}
function mpLobbyNames(){
  const names=[]; const add=n=>{ n=String(n||"").trim(); if(n && !names.map(pkey).includes(pkey(n))) names.push(n); };
  add(MP.hostName); mpLobbyList().filter(p=>p.online).forEach(p=>add(p.name));
  return names;
}
function mpLobbyHTML(){
  const list=mpLobbyList();
  if(!list.length) return `<p class="muted">Personne pour l'instant. Fais scanner le QR code.</p>`;
  return list.map(p=>`<div class="lobbyp"><span class="dot ${p.online?"":"off"}"></span>${esc(p.name)}${p.online?"":` <span class="muted small">(déconnecté)</span>`}</div>`).join("");
}
function mpToSetup(){
  const names=mpLobbyNames();
  SETUP.names=names.slice(0,12); SETUP.n=Math.max(2,Math.min(12,names.length));
  while(SETUP.names.length<SETUP.n) SETUP.names.push("");
  saveSetup(); go("setup");
}
function mpClose(){
  if(MP.on && MP.role==="host"){ try{ rref("players").off(); rref("actions").off(); rref().remove(); }catch(e){} }
  lsSet("tp_mp_save",null);
  MP.on=false; MP.role=null; MP.room=null; document.body.classList.remove("mp"); mpBar();
  go("home");
}
function actorsOf(){
  if(screen!=="game" || !S) return [];
  if(S.achShow) return [S.achShow.pi];
  switch(S.phase){
    case "dist": return [S.dist.from];
    case "steal": return [S.thief];
    case "estReveal": return [S.est.res.win];
    case "est": return S.est.order.filter(pi=>!(pi in S.est.vals));
    case "duel": return S.duel.step<2 ? [S.duel.a,S.duel.b].filter((pi,k)=>S.duel.ans[k]==null) : [S.cur];
    case "suspense": return [];
    default: return [S.cur];
  }
}
function mpFindBtn(a){
  let sel=`#app [data-act="${a.act}"]`;
  if(a.i!=null) sel+=`[data-i="${a.i}"]`;
  if(a.d!=null) sel+=`[data-d="${a.d}"]`;
  if(a.v!=null) sel+=`[data-v="${a.v}"]`;
  const list=[...document.querySelectorAll(sel)].filter(b=>!b.disabled);
  return list.find(b=> S.achShow ? !!b.closest(".overlay") : !b.closest(".overlay")) || null;
}
function mpHandleAction(a){
  if(!a || screen!=="game" || !S) return;
  const by=Number(a.by);
  if(!Number.isInteger(by) || by<0 || by>=S.players.length) return;
  if(a.act==="estVal"){
    if(S.phase==="est" && S.est.order.includes(by) && !(by in S.est.vals)){
      const v=Number(a.val); if(isFinite(v)){ S.est.vals[by]=v; SFX.click(); estCheckDone(); }
    }
    return;
  }
  if(!CLIENT_ACTS.has(a.act) || !A[a.act]) return;
  for(const k of ["i","d","v"]) if(a[k]!=null && !SAFE_VAL.test(String(a[k]))) return;
  if(!actorsOf().includes(by)) return;
  const btn=mpFindBtn(a); if(!btn) return;
  if(a.act==="duelAns"){ duelAnswer(Number(a.i),by); return; }
  A[a.act](btn);
}
function mpSchedule(fxInfo){
  if(!(MP.on && MP.role==="host")) return;
  if(fxInfo && (fxInfo.fx || fxInfo.ach)) MP.fxBuf=fxInfo;
  clearTimeout(MP.pubT); MP.pubT=setTimeout(mpPublish,40);
}
function mpPublish(){
  MP.pubT=null;
  if(!(MP.on && MP.role==="host" && MP.db)) return;
  const app=document.getElementById("app");
  let snap;
  if((screen==="game" || screen==="end") && S){
    snap={v:++MP.seq, boot:MP.boot, screen, phase:S.phase, actors:screen==="game"?actorsOf():[], html:app.innerHTML,
      players:S.players.map(p=>({n:p.name,d:p.drunk,g:p.given})),
      fx:MP.fxBuf&&MP.fxBuf.fx?MP.fxBuf.fx:null, ach:MP.fxBuf?MP.fxBuf.ach||0:0,
      timer:(screen==="game" && S.phase==="question" && S.timer)?{left:Math.round(S.timer.left),total:S.timer.total}:null,
      est:(screen==="game" && S.phase==="est")?{q:S.est.e.q,u:S.est.e.u||"",order:S.est.order,pending:S.est.order.filter(pi=>!(pi in S.est.vals))}:null,
      cues:MP.cues.slice(-15), t:Date.now()};
  } else {
    snap={v:++MP.seq, boot:MP.boot, screen:"wait", names:mpLobbyNames(), cues:MP.cues.slice(-15), t:Date.now()};
  }
  MP.fxBuf=null;
  try{ rref("snap").set(JSON.parse(JSON.stringify(snap))); }catch(e){}
  saveHostGame();
}
function saveHostGame(){
  if(!(MP.on && MP.role==="host")) return;
  if(screen!=="game" || !S || S.over){ lsSet("tp_mp_save",null); return; }
  const o={};
  Object.keys(S).forEach(k=>{
    if(["timerInt","suspT","timer"].includes(k)) return;
    const v=S[k];
    if(v instanceof Set) o[k]={__set:[...v]};
    else if(k==="ev") o[k]=v?{__ev:v.id}:null;
    else o[k]=v;
  });
  lsSet("tp_mp_save",{room:MP.room,url:fbUrl(),S:o,t:Date.now(),cueSeq:MP.cueSeq,hostName:MP.hostName});
}
function mpSavedGame(){
  const sv=lsGet("tp_mp_save",null);
  return (sv && sv.S && sv.room && Date.now()-sv.t < 12*3600*1000) ? sv : null;
}
async function mpResume(){
  const sv=mpSavedGame(); if(!sv) return;
  try{ await fbInit(sv.url); }catch(e){ showToast("Impossible de joindre Firebase : vérifie ta connexion."); return; }
  MP.on=true; MP.role="host"; MP.room=sv.room; MP.id=mpClientId(); MP.cueSeq=sv.cueSeq||0; MP.cues=[]; MP.hostName=sv.hostName||"";
  MP.boot=Math.random().toString(36).slice(2,8);
  const s={};
  Object.keys(sv.S).forEach(k=>{ const v=sv.S[k]; if(v && v.__set) s[k]=new Set(v.__set); else if(v && v.__ev) s[k]=EVENTS.find(e=>e.id===v.__ev)||null; else s[k]=v; });
  S=s; S.timer=null; S.timerInt=null; S.suspT=null;
  if(S.est && S.est.vals==null) S.est.vals={};
  mpHostListen(); document.body.classList.add("mp");
  screen="game"; render();
  if(S.phase==="question") startTimer();
  if(S.phase==="suspense") S.suspT=setTimeout(resolveSuspense,400);
}

/* ---------- Téléphone joueur ---------- */
function mpClientBoot(){
  const qs=new URLSearchParams(location.search);
  MP.room=String(qs.get("room")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
  MP.role="client"; MP.id=mpClientId(); MP.name=lsGet("tp_my_name","")||"";
  screen="mpJoin";
  if(MP.name && lsGet("tp_last_room","")===MP.room) mpJoin(true); else render();
}
async function mpJoin(auto){
  const inp=document.getElementById("mpName");
  if(!auto && inp) MP.name=inp.value.trim().slice(0,18);
  if(!MP.name){ MP.err="Entre ton prénom."; render(); return; }
  if(!/^[A-Z]{4}$/.test(MP.room)){ MP.err="Code de salon invalide. Scanne de nouveau le QR code."; render(); return; }
  const url=fbUrl();
  if(!FB_RE.test(url)){ MP.err="Lien incomplet : demande à l'hôte de te renvoyer le lien ou le QR code."; render(); return; }
  lsSet("tp_my_name",MP.name);
  if(!auto) SFX_RAW.coin();
  MP.err=""; MP.busy=true; render();
  try{ await fbInit(url); }catch(e){ MP.busy=false; MP.err="Connexion impossible : vérifie ton réseau (Wi-Fi ou 4G)."; render(); return; }
  let exists=null;
  try{ const s=await rref("created").once("value"); exists=s.val(); }catch(e){}
  if(!exists){ MP.busy=false; MP.err=`Salon ${MP.room} introuvable ou fermé.`; lsSet("tp_last_room",""); render(); return; }
  MP.on=true; MP.joined=true; MP.busy=false; lsSet("tp_last_room",MP.room);
  const me=rref("players/"+MP.id); me.onDisconnect().update({online:false});
  await me.set({name:MP.name,online:true,t:Date.now()});
  rref("host/online").on("value",s=>{ MP.hostOnline=s.val()!==false; mpBar(); });
  rref("snap").on("value",s=>{ const v=s.val(); if(v) mpOnSnap(v); });
  document.body.classList.add("mp");
  screen="mirror"; render();
}
function mpOnSnap(v){
  const first=!MP.snap;
  if(MP.boot!==v.boot){ const mx=Math.max(0,...(v.cues||[]).map(c=>c.s||0)); MP.lastCue = first ? mx : 0; MP.boot=v.boot; }
  MP.snap=v; MP.sent=false; clearTimeout(MP.sentT);
  if(v.players){
    const idx=v.players.findIndex(p=>pkey(p.n)===pkey(MP.name)); MP.myIdx=idx;
    if(idx>=0){ const d=v.players[idx].d; if(MP.lastDrunk!=null && d>MP.lastDrunk) showToastLocal(`🍺 +${d-MP.lastDrunk} gorgée${d-MP.lastDrunk>1?"s":""} pour toi !`); MP.lastDrunk=d; }
  } else { MP.myIdx=-1; MP.lastDrunk=null; }
  if(v.est && v.est.q!==MP.estQ){ MP.estQ=v.est.q; MP.estDraft=""; }
  if(screen==="mirror") render();
  (v.cues||[]).forEach(c=>{ if((c.s||0)>MP.lastCue){ MP.lastCue=c.s; if(c.toast) showToastLocal(c.toast); else if(SFX_RAW[c.k]) SFX_RAW[c.k](...(c.a||[])); } });
}
function mpSend(a){
  if(!(MP.on && MP.role==="client" && MP.myIdx>=0)) return;
  const o={by:MP.myIdx,act:a.act,t:Date.now()};
  ["i","d","v","val"].forEach(k=>{ if(a[k]!=null && a[k]!=="") o[k]=a[k]; });
  rref("actions").push(o);
}

function mpClientPost(){
