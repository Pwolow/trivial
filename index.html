           <form class="estform" data-form="estc"><input id="estC" class="inp" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="?" value="${esc(MP.estDraft)}"><span class="unit">${esc(v.est.u)}</span><button class="btn primary lg" type="submit">Envoyer</button></form>
           <p class="msg err center" id="estErr"></p>`
        : `<div class="event"><div class="evemoji">✅</div><div class="evtitle">Réponse envoyée</div><div class="evtext">En attente de : ${waiting.map(esc).join(", ")||"..."}</div></div>`;
    }
  }
  const canAct = (v.actors||[]).includes(MP.myIdx) && !MP.sent;
  app.querySelectorAll("[data-act]").forEach(b=>{
    const act=b.dataset.act;
    if(act==="toggleSound" || act.indexOf("mp")===0) return;
    if(!(canAct && CLIENT_ACTS.has(act))){ b.disabled=true; b.classList.add("locked"); }
  });
  app.querySelectorAll('[data-act="quitGame"],[data-act="start"],[data-act="goHall"],[data-act="goSetup"],[data-act="goHome"]').forEach(b=>b.style.display="none");
  const chips=app.querySelectorAll(".score .pchip"); if(chips[MP.myIdx]) chips[MP.myIdx].classList.add("me");
  if(MP.fxDone!==v.v){
    MP.fxDone=v.v;
    app.querySelectorAll("[data-count]").forEach(animateCount);
    playFxVisual(v.fx, v.ach);
    if(v.screen==="end" && !REDUCED) burst(window.innerWidth/2,90,70,["#ffb627","#ff8c1a","#34d399","#60a5fa","#a78bfa","#fb7185"],{up:true,power:420,gravity:260});
  }
  mpClientTimer(v);
}
function mpClientTimer(v){
  clearInterval(MP.ct); MP.ct=null; document.body.classList.remove("alarm");
  if(!v || v.phase!=="question" || !v.timer) return;
  if(MP.tv!==v.v){ MP.tv=v.v; MP.tStart=performance.now(); MP.tLastSec=null; }
  const step=()=>{
    const left=v.timer.left-(performance.now()-MP.tStart);
    paintTimer(left,v.timer.total,true);
    const sec=Math.ceil(left/1000);
    if(left>0 && left<=Math.min(5000,v.timer.total*0.35) && sec!==MP.tLastSec){ MP.tLastSec=sec; SFX_RAW.tick(); }
    if(left<=0){ clearInterval(MP.ct); MP.ct=null; }
  };
  step(); MP.ct=setInterval(step,100);
}
function showToastLocal(msg){
  const t=document.getElementById("toast"); if(!t) return;
  t.innerHTML=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600);
}
function mpBar(){
  const bar=document.getElementById("mpbar"); if(!bar) return;
  if(!MP.on){ bar.className=""; bar.innerHTML=""; return; }
  const dot=MP.conn?"🟢":"🔴";
  if(MP.role==="host"){
    const n=mpLobbyList().filter(p=>p.online).length;
    bar.className="show"; bar.innerHTML=`${dot} Salon <b class="gold">${esc(MP.room)}</b> · ${n} téléphone${n>1?"s":""}`;
    return;
  }
  const v=MP.snap; let status="";
  let turn=false;
  if(!MP.hostOnline) status="⚠️ L'hôte est déconnecté";
  else if(v && v.screen==="game" && v.actors){
    if(v.actors.includes(MP.myIdx)){ status="👉 À toi de jouer !"; turn=true; }
    else if(v.phase==="suspense") status="🥁 Suspense...";
    else if(v.actors.length){ status=`⏳ ${esc(v.actors.map(i=>v.players[i]?v.players[i].n:"?").join(", "))} joue...`; }
  } else if(v && v.screen==="end") status="🏁 Partie terminée";
  else status="⏳ En attente de l'hôte";
  bar.className="show"+(turn?" turn":""); bar.innerHTML=`${dot} <b>${esc(MP.name)}</b> · ${status}`;
}
async function mpDrawQR(){
  const box=document.getElementById("qr"); if(!box) return;
  const link=mpLink();
  if(MP.qr && MP.qrFor===link){ box.innerHTML=MP.qr; return; }
  try{
    if(typeof window.qrcode!=="function") await loadScript(QR_LIB);
    const qr=window.qrcode(0,"M"); qr.addData(link); qr.make();
    let tag; try{ tag=qr.createSvgTag(6,2); }catch(e){ tag=qr.createImgTag(6,2); }
    MP.qr=tag; MP.qrFor=link; const b=document.getElementById("qr"); if(b) b.innerHTML=tag;
  }catch(e){ const b=document.getElementById("qr"); if(b) b.innerHTML=`<p style="color:#222;max-width:220px">QR code indisponible : partage le lien ci-dessous.</p>`; }
}
function vMpHost(){
  let h=`<div class="topbar"><button class="btn ghost sm" data-act="${MP.on?"mpClose":"goHome"}">← ${MP.on?"Fermer le salon":"Menu"}</button><h2>📱 Multijoueur</h2><span style="width:70px"></span></div>`;
  if(!MP.on){
    h+=`<section class="card"><h3>Comment ça marche</h3>
      <p>Cet appareil est l'<b>hôte</b> : il fait tourner la partie (le Mac ou ton iPhone). Les autres scannent le QR code avec l'appareil photo de leur iPhone, tapent leur prénom, et chacun joue sur son téléphone. Il faut internet (Wi-Fi ou 4G).</p>
      <p class="muted small" style="margin-top:8px">Garde l'écran de l'hôte allumé pendant la partie. Si la page de l'hôte se recharge, un bouton « Reprendre » apparaît sur l'accueil.</p>
      ${location.protocol==="file:"?`<p class="msg err">⚠️ Tu as ouvert le fichier depuis ton ordinateur. Ouvre plutôt le jeu depuis son adresse en ligne (github.io), sinon les autres ne pourront pas te rejoindre.</p>`:""}</section>`;
    if(!fbBaked()) h+=`<section class="card"><h3>Adresse de ta base Firebase</h3><input id="fbUrl" class="inp" value="${esc(fbUrl())}" placeholder="https://ton-projet-default-rtdb.europe-west1.firebasedatabase.app/" autocomplete="off"><p class="muted small" style="margin-top:8px">À saisir une seule fois : elle est mémorisée, puis transmise automatiquement aux téléphones via le QR code.</p></section>`;
    h+=`<div class="actions"><button class="btn primary xl" data-act="mpCreate" ${MP.busy?"disabled":""}>${MP.busy?"Connexion...":"Créer le salon"}</button></div>`;
    if(MP.err) h+=`<p class="msg err center">${esc(MP.err)}</p>`;
    return h;
  }
  const n=mpLobbyNames().length;
  h+=`<div class="grid2">
    <section class="card center"><h3>Scanne pour rejoindre</h3><div class="roomcode">${esc(MP.room)}</div>
      <div class="qrbox" id="qr" style="margin:12px 0">${MP.qr||`<p style="color:#222;width:220px">Chargement du QR code...</p>`}</div>
      <p class="small muted" style="word-break:break-all">${esc(mpLink())}</p>
      <div class="actions" style="margin-top:10px"><button class="btn" data-act="mpShare">📤 Partager le lien</button><button class="btn ghost" data-act="mpCopy">Copier</button></div></section>
    <section class="card"><h3>Joueurs connectés</h3><div class="stack" id="lobbyList">${mpLobbyHTML()}</div>
      <label class="f" style="margin-top:16px">Ton prénom, si tu joues aussi depuis cet appareil<input id="hostName" class="inp" maxlength="18" value="${esc(MP.hostName)}" autocomplete="off"></label>
      <p class="muted small" style="margin-top:8px">Laisse vide si cet appareil sert seulement d'écran commun. Dans les réglages, tu pourras ajouter des joueurs sans téléphone : l'hôte jouera pour eux.</p></section></div>
    <div class="actions"><button class="btn primary xl" data-act="mpToSetup">Continuer vers les réglages (${n} joueur${n>1?"s":""})</button></div>`;
  return h;
}
Object.assign(A,{
  goMp(){ MP.err=""; go("mpHost"); },
  mpCreate(){ mpCreate(); },
  mpClose(){ if(confirm("Fermer le salon ? Les téléphones seront déconnectés.")) mpClose(); },
  mpToSetup(){ mpToSetup(); },
  mpResume(){ mpResume(); },
  mpShare(){ const l=mpLink(); if(navigator.share){ navigator.share({title:"Trivial Pourcuite",text:`Rejoins la partie (salon ${MP.room})`,url:l}).catch(()=>{}); } else A.mpCopy(); },
  mpCopy(){ const l=mpLink(); try{ navigator.clipboard.writeText(l).then(()=>showToastLocal("Lien copié !"),()=>prompt("Copie ce lien :",l)); }catch(e){ prompt("Copie ce lien :",l); } },
  mpPick(el){ MP.name=el.dataset.v; lsSet("tp_my_name",MP.name); try{ rref("players/"+MP.id).update({name:MP.name}); }catch(e){} MP.lastDrunk=null; if(MP.snap) mpOnSnap(MP.snap); else render(); }
});


document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  if(screen==="mirror"){
    const act=el.dataset.act;
    if(act==="toggleSound" || act.indexOf("mp")===0){ const f=A[act]; if(f) f(el,e); return; }
    if(!CLIENT_ACTS.has(act) || MP.sent) return;
    mpSend({act,i:el.dataset.i,d:el.dataset.d,v:el.dataset.v});
    SFX_RAW.click();
    if(!NO_LOCK_ACTS.has(act)){ MP.sent=true; clearTimeout(MP.sentT); MP.sentT=setTimeout(()=>{ MP.sent=false; if(screen==="mirror") render(); },3000); el.classList.add("picked"); render(); }
    return;
  }
  if(S && screen==="game" && S.achShow && !el.closest(".overlay") && !["toggleSound","quitGame"].includes(el.dataset.act)) return;
  const f=A[el.dataset.act]; if(f) f(el,e);
});
document.addEventListener("submit",e=>{
  const f=e.target;
  if(f && f.dataset && f.dataset.form==="est"){ e.preventDefault(); estSubmit(); }
  if(f && f.dataset && f.dataset.form==="join"){ e.preventDefault(); mpJoin(false); }
  if(f && f.dataset && f.dataset.form==="estc"){
    e.preventDefault();
    const inp=document.getElementById("estC"); const v=parseNum(inp?inp.value:"");
    if(v===null){ const er=document.getElementById("estErr"); if(er) er.textContent="Entre un nombre (ex. : 1250 ou 13,8)."; return; }
    mpSend({act:"estVal",val:v}); MP.estDraft=""; SFX_RAW.click();
    const st=document.querySelector(".stage"); if(st) st.innerHTML=`<div class="event"><div class="evemoji">📨</div><div class="evtitle">Envoi...</div></div>`;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset && t.dataset.name!==undefined){ SETUP.names[+t.dataset.name]=t.value; saveSetup(); }
  else if(t.dataset && t.dataset.field){ const v=parseInt(t.value,10); SETUP[t.dataset.field]=isNaN(v)?0:v; if(t.dataset.field==="cap") SETUP.capTouched=true; saveSetup(); }
  else if(t.id==="hostName"){ MP.hostName=t.value.trim().slice(0,18); lsSet("tp_my_name",MP.hostName); const b=document.querySelector('[data-act="mpToSetup"]'); if(b){ const n=mpLobbyNames().length; b.textContent=`Continuer vers les réglages (${n} joueur${n>1?"s":""})`; } }
  else if(t.id==="estC"){ MP.estDraft=t.value; }
  else if(t.id==="fbUrl"){ lsSet("tp_fb_url",t.value.trim()); }
});
function readJSONFile(file,cb){
  const r=new FileReader();
  r.onload=()=>{ let data=null; try{ data=JSON.parse(r.result); }catch(err){ ED.msg="Fichier illisible : ce n'est pas un JSON valide."; ED.err=true; render(); return; } cb(data); render(); };
  r.readAsText(file);
}
document.addEventListener("change",e=>{
  const t=e.target; const f=t.files && t.files[0];
  if(t.id==="importFile" && f){
    readJSONFile(f,data=>{
      const arr=Array.isArray(data)?data:(data && Array.isArray(data.questions)?data.questions:[]);
      const seen=new Set(allQuestions().map(qkey)); let added=0, skipped=0;
      arr.forEach(o=>{ const q=normQ(o); if(!q || seen.has(qkey(q))){ skipped++; return; } CUSTOM.push(q); seen.add(qkey(q)); added++; });
      const saved=saveCustom();
      ED.msg=`${added} question(s) importée(s), ${skipped} ignorée(s) (doublons ou format invalide).${saved?"":" Attention : enregistrement refusé par le navigateur."}`;
      ED.err=!saved && added>0;
    });
  }
  if(t.id==="importSave" && f){
    readJSONFile(f,data=>{
      if(!data || data.app!=="trivial-pourcuite"){ ED.msg="Ce fichier n'est pas une sauvegarde de progression Trivial Pourcuite."; ED.err=true; return; }
      if(!confirm("Remplacer la progression actuelle (palmarès, mémoire des questions, statistiques) par celle du fichier ?")) return;
      if(Array.isArray(data.custom)){ const seen=new Set(allQuestions().map(qkey)); data.custom.map(normQ).filter(Boolean).forEach(q=>{ if(!seen.has(qkey(q))){ CUSTOM.push(q); seen.add(qkey(q)); } }); saveCustom(); }
      SEEN=new Set(Array.isArray(data.seen)?data.seen:[]); saveSeen();
      QSTATS=(data.qstats && typeof data.qstats==="object")?data.qstats:{}; saveQStats();
      PROFILES=(data.profiles && typeof data.profiles==="object")?data.profiles:{}; saveProfiles();
      ED.msg="Progression importée."; ED.err=false;
    });
  }
});
document.addEventListener("keydown",e=>{
  if(screen!=="game" || !S) return;
  if(e.target.matches && e.target.matches("input,textarea,select")) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(S.achShow){
    if(e.key==="Enter"){ const b=document.querySelector(".overlay [data-primary]"); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  const k=e.key.toLowerCase();
  let i="abcdef".indexOf(k); if(i<0) i="123456".indexOf(k);
  if(i>=0 && k.length===1){ const b=document.querySelector(`[data-key-ans="${i}"]:not([disabled])`); if(b){ e.preventDefault(); b.click(); } return; }
  if(e.key==="Enter"){ const b=document.querySelector(".stage [data-primary]:not([disabled])"); if(b){ e.preventDefault(); b.click(); } }
});

if(new URLSearchParams(location.search).get("room")) mpClientBoot(); else render();
</script>
