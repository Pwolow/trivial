{c:"Histoire",d:1,q:"Qui fut le premier empereur romain ?",a:["Auguste","Jules César","Néron","Tibère"],i:"Octave reçoit le titre d'Auguste en 27 av. J.-C. Jules César, assassiné en 44 av. J.-C., était dictateur, jamais empereur."},
{c:"Histoire",d:1,q:"Quel traité a mis fin à la Première Guerre mondiale entre les Alliés et l'Allemagne ?",a:["Le traité de Versailles","Le traité de Trianon","Le traité de Sèvres","Le traité de Saint-Germain-en-Laye"],i:"Signé le 28 juin 1919 dans la galerie des Glaces. Les trois autres concernent la Hongrie (Trianon), l'Empire ottoman (Sèvres) et l'Autriche (Saint-Germain-en-Laye)."},
{c:"Histoire",d:1,q:"Dans quelle ville est né Napoléon Bonaparte ?",a:["Ajaccio","Bastia","Toulon","Paris"],i:"Le 15 août 1769, un an seulement après que Gênes a cédé la Corse à la France."},
{c:"Histoire",d:2,q:"Quel empire était surnommé « l'homme malade de l'Europe » au XIXe siècle ?",a:["L'Empire ottoman","L'Empire austro-hongrois","L'Empire russe","L'Empire espagnol"],i:"Expression attribuée au tsar Nicolas Ier, pour désigner un empire en déclin dont les grandes puissances convoitaient les territoires."},
{c:"Histoire",d:2,q:"Quel a été le plus vaste empire de l'histoire en superficie ?",a:["L'Empire britannique","L'Empire mongol","L'Empire romain","L'Empire espagnol"],i:"Vers 1920, il couvrait environ un quart des terres émergées. L'Empire mongol reste le plus vaste empire d'un seul tenant."},
{c:"Histoire",d:1,q:"Qui fut le premier être humain à voyager dans l'espace ?",a:["Youri Gagarine","Neil Armstrong","Alexeï Leonov","John Glenn"],i:"Le 12 avril 1961, à bord de Vostok 1 : une seule orbite, en 108 minutes environ. Leonov réalisera la première sortie dans l'espace en 1965."},
{c:"Histoire",d:1,q:"Quelle civilisation a inventé le papier ?",a:["La Chine","L'Égypte ancienne","La Mésopotamie","La Grèce antique"],i:"Invention traditionnellement attribuée à Cai Lun vers l'an 105, même si des fragments plus anciens existent. Le papyrus égyptien n'est pas du papier : ce sont des tiges de plante pressées."},
{c:"Histoire",d:1,q:"En quelle année le mur de Berlin est-il tombé ?",a:["1989","1987","1990","1991"],i:"Le 9 novembre 1989. La réunification allemande suit le 3 octobre 1990, et l'URSS disparaît fin 1991."},

// ---------- Géopolitique ----------
{c:"Géopolitique",d:1,q:"Combien de membres permanents, avec droit de veto, siègent au Conseil de sécurité de l'ONU ?",a:["5","7","10","15"],i:"États-Unis, Russie, Chine, France et Royaume-Uni. Le Conseil compte 15 membres au total, dont 10 élus pour deux ans."},
{c:"Géopolitique",d:2,q:"Par quel détroit transite environ un cinquième du pétrole consommé dans le monde ?",a:["Le détroit d'Ormuz","Le détroit de Malacca","Le détroit de Bab-el-Mandeb","Le Bosphore"],i:"Ordre de grandeur donné par l'agence américaine de l'énergie (EIA). Il sépare l'Iran de la péninsule arabique : c'est le passage obligé du pétrole du Golfe."},
{c:"Géopolitique",d:3,q:"Quels pays partagent le record du plus grand nombre de voisins terrestres (14) ?",a:["La Chine et la Russie","Le Brésil et l'Allemagne","La Chine et l'Inde","La Russie et le Kazakhstan"],i:"14 pays frontaliers chacun. Le Brésil en a 10 et l'Allemagne 9."},
{c:"Géopolitique",d:2,q:"Quel pays européen a rejeté par référendum son adhésion à l'Union européenne, en 1972 puis en 1994 ?",a:["La Norvège","La Suisse","L'Islande","Le Danemark"],i:"La Norvège participe pourtant au marché intérieur via l'Espace économique européen."},
{c:"Géopolitique",d:1,q:"Quel pays est devenu le plus peuplé du monde en 2023, selon l'ONU ?",a:["L'Inde","La Chine","Les États-Unis","L'Indonésie"],i:"D'après les projections des Nations unies, l'Inde a dépassé la Chine au cours de l'année 2023, avec environ 1,43 milliard d'habitants."},
{c:"Géopolitique",d:2,q:"Combien de pays membres compte l'OTAN après l'adhésion de la Suède en mars 2024 ?",a:["32","30","29","35"],i:"La Finlande a rejoint l'Alliance en avril 2023 et la Suède en mars 2024, dans la foulée de l'invasion de l'Ukraine par la Russie."},
{c:"Géopolitique",d:2,q:"Où siège la Cour internationale de justice, principal organe judiciaire de l'ONU ?",a:["La Haye","Genève","New York","Strasbourg"],i:"Au Palais de la Paix. La Cour pénale internationale siège aussi à La Haye, tandis que Strasbourg accueille la Cour européenne des droits de l'homme."},
{c:"Géopolitique",d:3,q:"Que proclame la doctrine Monroe (1823) ?",a:["Les Amériques ne doivent plus subir de colonisation ni d'ingérence européenne","Les États-Unis renoncent à toute expansion territoriale","Les États-Unis s'allient pour toujours à la France","Les océans sont libres pour toutes les nations"],i:"Énoncée par le président James Monroe, elle a ensuite servi à justifier l'influence des États-Unis sur l'Amérique latine."},
{c:"Géopolitique",d:2,q:"Quel pays a aboli son armée en 1948, puis l'a inscrit dans sa Constitution ?",a:["Le Costa Rica","La Suisse","L'Uruguay","La Belgique"],i:"Décision de José Figueres Ferrer après la guerre civile de 1948. La Constitution de 1949 interdit l'existence d'une armée permanente."},
{c:"Géopolitique",d:3,q:"À quoi renvoie le « piège de Thucydide » ?",a:["Le risque de guerre entre une puissance dominante et une puissance montante","Le piège de la dette pour les pays en développement","L'impossibilité de gagner une guerre sur deux fronts","L'escalade automatique entre puissances nucléaires"],i:"Formule popularisée par le politologue Graham Allison (Harvard), d'après la guerre du Péloponnèse entre Athènes et Sparte. Elle est souvent appliquée à la rivalité entre les États-Unis et la Chine."},
{c:"Géopolitique",d:3,q:"Quel pays s'étend sur le plus grand nombre de fuseaux horaires ?",a:["La France","La Russie","Les États-Unis","Le Royaume-Uni"],i:"Grâce à ses territoires d'outre-mer, la France couvre 12 fuseaux horaires (13 en comptant la Terre Adélie, en Antarctique). La Russie en compte 11."},
{c:"Géopolitique",d:3,q:"Quelle est la plus longue frontière terrestre entre deux pays ?",a:["Canada / États-Unis","Russie / Kazakhstan","Chili / Argentine","Chine / Mongolie"],i:"Environ 8 900 km, Alaska compris. La frontière Russie / Kazakhstan (environ 7 600 km) est souvent citée comme la plus longue d'un seul tenant."},
{c:"Géopolitique",d:2,q:"Qu'a-t-on appelé la « diplomatie du ping-pong » ?",a:["Le rapprochement entre les États-Unis et la Chine au début des années 1970","Les négociations de l'armistice de Corée en 1953","Les rencontres sportives entre les deux Allemagnes","La médiation suisse pendant la guerre froide"],i:"En 1971, l'équipe américaine de tennis de table est invitée en Chine. Le président Nixon se rend à Pékin l'année suivante."},
{c:"Géopolitique",d:2,q:"Combien de langues officielles compte l'ONU ?",a:["6","2","4","10"],i:"Anglais, arabe, chinois, espagnol, français et russe. L'anglais et le français sont les langues de travail du Secrétariat."},
{c:"Géopolitique",d:1,q:"Quel canal, bloqué six jours par le porte-conteneurs Ever Given en 2021, relie la Méditerranée à la mer Rouge ?",a:["Le canal de Suez","Le canal de Panama","Le canal de Kiel","Le canal de Corinthe"],i:"Inauguré en 1869, il évite aux navires de contourner l'Afrique. Le blocage de mars 2021 a immobilisé des centaines de bateaux et perturbé les chaînes d'approvisionnement mondiales."},

// ---------- Finance & Économie ----------
{c:"Finance & Économie",d:2,q:"Que mesure le PER (Price Earnings Ratio) d'une action ?",a:["Le cours divisé par le bénéfice par action","Le bénéfice divisé par le chiffre d'affaires","La dette divisée par les fonds propres","Le dividende divisé par le cours"],i:"Un PER de 20 signifie qu'on paie l'action 20 fois son bénéfice annuel. Le dividende divisé par le cours, c'est le rendement."},
{c:"Finance & Économie",d:1,q:"Quelle est souvent présentée comme la première bulle spéculative de l'histoire ?",a:["La tulipomanie hollandaise","La bulle des mers du Sud","Le système de Law","Le krach de 1929"],i:"Aux Provinces-Unies, en 1636-1637, certains bulbes se négociaient à des prix extravagants. L'historienne Anne Goldgar (2007) estime toutefois que l'ampleur de la crise a été exagérée."},
{c:"Finance & Économie",d:1,q:"Que dit la loi de Pareto, appliquée en gestion ?",a:["Environ 80 % des effets viennent d'environ 20 % des causes","Chacun finit par atteindre son niveau d'incompétence","Le travail s'étale pour occuper tout le temps disponible","Ce qui peut mal tourner finira par mal tourner"],i:"Pareto avait constaté qu'environ 80 % des terres italiennes appartenaient à 20 % de la population. La classification ABC des stocks en découle. Les autres réponses sont le principe de Peter, la loi de Parkinson et la loi de Murphy."},
{c:"Finance & Économie",d:2,q:"Quelle entreprise américaine a été la première à dépasser 1 000 milliards de dollars de capitalisation boursière ?",a:["Apple","Microsoft","Amazon","Alphabet (Google)"],i:"En août 2018. Selon certains calculs, PetroChina aurait brièvement franchi ce seuil dès 2007, lors de son introduction à la bourse de Shanghai."},
{c:"Finance & Économie",d:3,q:"Que mesure l'indice VIX, surnommé « l'indice de la peur » ?",a:["La volatilité attendue du S&P 500 sur 30 jours","Le nombre de faillites d'entreprises américaines","L'écart entre taux courts et taux longs","Le volume d'actions vendues à découvert"],i:"Il est calculé par le Cboe à partir des prix des options sur le S&P 500. Il s'envole lors des krachs."},
{c:"Finance & Économie",d:2,q:"Quel économiste a théorisé la « destruction créatrice » ?",a:["Joseph Schumpeter","John Maynard Keynes","Adam Smith","Milton Friedman"],i:"Dans « Capitalisme, socialisme et démocratie » (1942) : l'innovation détruit les anciennes structures économiques pour en créer de nouvelles."},
{c:"Finance & Économie",d:1,q:"Depuis quand les pièces et billets en euros circulent-ils ?",a:["Le 1er janvier 2002","Le 1er janvier 1999","Le 1er janvier 2000","Le 1er janvier 1992"],i:"L'euro existe depuis le 1er janvier 1999, mais pendant trois ans uniquement sous forme scripturale (virements, marchés financiers)."},
{c:"Finance & Économie",d:2,q:"En finance, qu'est-ce qu'un « cygne noir » ?",a:["Un événement rare, imprévisible et à fort impact","Une action qui baisse malgré de bons résultats","Un investisseur qui parie contre le marché","Une entreprise cotée sans aucune dette"],i:"Concept popularisé par Nassim Nicholas Taleb (2007). Après coup, on a tendance à croire que l'événement était prévisible."},
{c:"Finance & Économie",d:3,q:"« La mauvaise monnaie chasse la bonne » : de quelle loi s'agit-il ?",a:["La loi de Gresham","La loi de Say","La loi d'Okun","La loi d'Engel"],i:"Quand deux monnaies ont la même valeur légale mais pas la même valeur intrinsèque, on garde la bonne et on dépense la mauvaise, qui finit seule en circulation."},
{c:"Finance & Économie",d:2,q:"Quel pays a émis en 2009 un billet de 100 000 milliards de dollars ?",a:["Le Zimbabwe","Le Venezuela","L'Allemagne","L'Argentine"],i:"Pendant l'hyperinflation de 2007-2009. Le record historique d'inflation mensuelle revient toutefois à la Hongrie, en 1946."},
{c:"Finance & Économie",d:2,q:"En mai 2010, un programmeur a acheté deux pizzas en bitcoins. Combien en a-t-il payé ?",a:["10 000","100","1 000","1"],i:"Laszlo Hanyecz, le 22 mai 2010, devenu le « Bitcoin Pizza Day ». Aux cours de ces dernières années, ces bitcoins valaient plusieurs centaines de millions de dollars."},
{c:"Finance & Économie",d:2,q:"Quelle entreprise a été fondée en 1889 pour fabriquer des cartes à jouer ?",a:["Nintendo","Sony","Sega","Bandai"],i:"Fondée à Kyoto par Fusajiro Yamauchi pour produire des cartes hanafuda. Les jeux vidéo n'arriveront que bien plus tard."},
{c:"Finance & Économie",d:2,q:"Quel a été le premier produit vendu grâce au scan d'un code-barres, en 1974 ?",a:["Un paquet de chewing-gums Wrigley's","Une bouteille de Coca-Cola","Une boîte de soupe Campbell's","Un paquet de cigarettes"],i:"Le 26 juin 1974, dans un supermarché de Troy, dans l'Ohio. Le code utilisé, l'UPC, est l'ancêtre du code EAN de nos produits."},
{c:"Finance & Économie",d:2,q:"Un entrepôt reçoit 100 commandes par jour, et chacune y reste 3 jours en moyenne. Combien de commandes s'y trouvent en moyenne ?",a:["300","33","103","3 000"],i:"Loi de Little : L = λ × W (en-cours moyen = débit × temps de séjour). Elle vaut pour tout système stable, quelle que soit la façon dont arrivent les commandes."},
{c:"Finance & Économie",d:2,q:"Dans le transport maritime, que signifie l'unité EVP (TEU en anglais) ?",a:["Équivalent vingt pieds","Échelle de volume portuaire","Entrepôt à valeur pondérée","Estimation de voyage prévisionnel"],i:"Un conteneur standard de 20 pieds, soit environ 6 m de long. Un conteneur de 40 pieds compte pour 2 EVP."},
{c:"Finance & Économie",d:2,q:"D'après son étymologie latine, le mot « salaire » est lié à quoi ?",a:["Le sel","Le soldat","Le salut","La salle"],i:"Du latin salarium, dérivé de sal (sel). En revanche, l'idée que les légionnaires étaient payés en sel est débattue par les historiens."},
{c:"Finance & Économie",d:3,q:"Dans le nom IKEA, que désignent les lettres E et A ?",a:["La ferme et le village d'enfance du fondateur","Europe et Amérique","Économie et Ameublement","Les prénoms de ses parents"],i:"Ingvar Kamprad, Elmtaryd (la ferme familiale), Agunnaryd (le village, dans le sud de la Suède)."},
{c:"Finance & Économie",d:2,q:"Quel pays a été le premier à utiliser du papier-monnaie à grande échelle ?",a:["La Chine","Les Pays-Bas","L'Italie","L'Angleterre"],i:"Sous la dynastie Song, au XIe siècle, avec les billets jiaozi. L'Europe ne s'y met que des siècles plus tard."},
{c:"Finance & Économie",d:2,q:"Que signifie « kanban », l'outil du système de production Toyota ?",a:["Étiquette ou panneau","Amélioration continue","Zéro défaut","Juste-à-temps"],i:"Le kanban est une carte qui déclenche la production ou le réapprovisionnement en flux tiré. « Amélioration continue » se dit kaizen."},

// ---------- Sciences ----------
{c:"Sciences",d:1,q:"Combien d'os compte le squelette d'un adulte ?",a:["206","186","256","312"],i:"Un nouveau-né en a environ 300 : beaucoup fusionnent pendant la croissance."},
{c:"Sciences",d:1,q:"Quelle est la vitesse de la lumière dans le vide ?",a:["Environ 300 000 km/s","Environ 30 000 km/s","Environ 3 millions de km/s","Environ 340 m/s"],i:"Exactement 299 792 458 m/s, valeur fixée par définition depuis 1983 pour définir le mètre. 340 m/s, c'est la vitesse du son dans l'air."},
{c:"Sciences",d:1,q:"Quel métal est liquide à température ambiante (20 °C) ?",a:["Le mercure","Le gallium","Le plomb","Le sodium"],i:"Le gallium fond vers 30 °C : il peut fondre dans la main, mais reste solide dans une pièce tempérée."},
{c:"Sciences",d:2,q:"Sur quelle planète une journée dure-t-elle plus longtemps qu'une année ?",a:["Vénus","Mercure","Mars","Jupiter"],i:"Vénus met environ 243 jours terrestres à tourner sur elle-même, mais environ 225 à faire le tour du Soleil. Et elle tourne dans le sens inverse de la plupart des planètes."},
{c:"Sciences",d:2,q:"Pourquoi le ciel est-il bleu en journée ?",a:["L'air diffuse bien plus la lumière bleue que la rouge","Il reflète la couleur des océans","La couche d'ozone est bleue","Le Soleil émet surtout de la lumière bleue"],i:"C'est la diffusion de Rayleigh, qui varie comme 1/λ⁴ : les courtes longueurs d'onde sont bien plus diffusées. Au coucher du soleil, la lumière traverse plus d'atmosphère et le bleu est dispersé avant de nous atteindre."},
{c:"Sciences",d:1,q:"Quel animal possède trois cœurs ?",a:["La pieuvre","Le requin","La grenouille","L'hippocampe"],i:"Deux cœurs branchiaux et un cœur systémique. Son sang est bleu, car l'oxygène y est transporté par l'hémocyanine, à base de cuivre."},
{c:"Sciences",d:1,q:"Combien de temps met la lumière du Soleil pour atteindre la Terre ?",a:["Environ 8 minutes","Environ 8 secondes","Environ 1 heure","Environ 1 jour"],i:"Environ 8 min 20 s pour parcourir 150 millions de km. Le Soleil qu'on voit est donc toujours celui d'il y a 8 minutes."},
{c:"Sciences",d:1,q:"Quel est l'élément chimique le plus abondant dans l'univers ?",a:["L'hydrogène","L'hélium","L'oxygène","Le carbone"],i:"Environ les trois quarts de la masse de matière ordinaire, l'hélium formant l'essentiel du reste. Dans la croûte terrestre, c'est l'oxygène qui domine."},
{c:"Sciences",d:1,q:"Quel est le plus grand organe du corps humain ?",a:["La peau","Le foie","L'intestin grêle","Les poumons"],i:"Entre 1,5 et 2 m² chez un adulte. Le foie est l'organe interne le plus lourd, autour de 1,5 kg."},
{c:"Sciences",d:2,q:"À combien de degrés Celsius correspond le zéro absolu ?",a:["−273,15 °C","−459,67 °C","−100 °C","−373,15 °C"],i:"C'est 0 kelvin, la température la plus basse théoriquement possible. −459,67 est la même température exprimée en degrés Fahrenheit."},
{c:"Sciences",d:2,q:"Qui est la seule personne à avoir reçu deux prix Nobel dans deux sciences différentes ?",a:["Marie Curie","Linus Pauling","Albert Einstein","Niels Bohr"],i:"Physique en 1903, chimie en 1911. Linus Pauling a aussi deux Nobel, mais en chimie et pour la paix."},
{c:"Sciences",d:2,q:"Que pose le paradoxe de Fermi ?",a:["Si la vie intelligente est probable dans l'univers, pourquoi n'en voit-on aucune trace ?","Pourquoi le temps ralentit-il près d'un trou noir ?","Comment un chat peut-il être à la fois mort et vivant ?","Pourquoi fait-il nuit alors que l'univers compte des milliards d'étoiles ?"],i:"Attribué au physicien Enrico Fermi, vers 1950. Le chat mort-vivant est l'expérience de pensée de Schrödinger, et la nuit noire malgré les étoiles est le paradoxe d'Olbers."},
{c:"Sciences",d:1,q:"Quel gaz compose environ 78 % de l'air que l'on respire ?",a:["L'azote","L'oxygène","Le dioxyde de carbone","L'argon"],i:"L'oxygène ne représente qu'environ 21 %, l'argon près de 1 %, le CO₂ environ 0,04 %."},
{c:"Sciences",d:1,q:"Combien de chromosomes contient une cellule humaine ordinaire ?",a:["46","23","48","64"],i:"23 paires. Les ovules et les spermatozoïdes n'en ont que 23. Les chimpanzés, eux, en ont 48."},
{c:"Sciences",d:3,q:"Quelle unité mesure l'activité d'une source radioactive ?",a:["Le becquerel","Le sievert","Le gray","Le tesla"],i:"1 becquerel = 1 désintégration par seconde. Le gray mesure la dose absorbée, le sievert son effet biologique, le tesla un champ magnétique."},

// ---------- Architecture ----------
{c:"Architecture",d:1,q:"Combien de temps a duré la construction de la tour Eiffel ?",a:["Environ 2 ans","Environ 6 mois","Environ 5 ans","Environ 10 ans"],i:"Du 28 janvier 1887 au 31 mars 1889, pour l'Exposition universelle. Elle ne devait rester debout que 20 ans."},
{c:"Architecture",d:1,q:"Pourquoi la hauteur de la tour Eiffel varie-t-elle de quelques centimètres selon la saison ?",a:["Le métal se dilate avec la chaleur","Les fondations s'enfoncent en hiver","Le vent la comprime","Les couches de peinture s'accumulent"],i:"La dilatation thermique du fer : plus il fait chaud, plus elle grandit. Au soleil, son sommet s'incline aussi légèrement du côté opposé à l'astre."},
{c:"Architecture",d:2,q:"Quelle hauteur mesure le Burj Khalifa, inauguré à Dubaï en 2010 ?",a:["Environ 830 m","Environ 630 m","Environ 1 000 m","Environ 540 m"],i:"828 m exactement. 632 m, c'est la Shanghai Tower, et 541 m le One World Trade Center de New York."},
{c:"Architecture",d:1,q:"Quel architecte a consacré plus de 40 ans de sa vie à la Sagrada Família de Barcelone ?",a:["Antoni Gaudí","Le Corbusier","Oscar Niemeyer","Frank Lloyd Wright"],i:"Il reprend le projet en 1883 et y travaille jusqu'à sa mort en 1926, renversé par un tramway."},
{c:"Architecture",d:2,q:"À quoi sert un arc-boutant dans une cathédrale gothique ?",a:["Reporter la poussée des voûtes vers l'extérieur","Évacuer l'eau de pluie du toit","Porter les cloches","Décorer la façade principale"],i:"Il permet d'élever des murs plus fins et d'ouvrir de grandes verrières. L'eau de pluie, elle, est évacuée par les gargouilles."},
{c:"Architecture",d:2,q:"Quelle capitale, construite de toutes pièces, a été inaugurée en 1960 ?",a:["Brasília","Canberra","Islamabad","Abuja"],i:"Urbanisme de Lúcio Costa, architecture d'Oscar Niemeyer. Vu du ciel, son plan évoque un avion ou un oiseau."},
{c:"Architecture",d:3,q:"Lequel de ces éléments ne fait PAS partie des « cinq points de l'architecture moderne » de Le Corbusier ?",a:["Les colonnes à chapiteau","Les pilotis","Le toit-terrasse","La fenêtre en longueur"],i:"Les cinq points : pilotis, toit-terrasse, plan libre, fenêtre en longueur et façade libre. La villa Savoye, à Poissy, en est l'illustration la plus connue."},
{c:"Architecture",d:2,q:"Quel architecte a conçu la pyramide du Louvre ?",a:["Ieoh Ming Pei","Jean Nouvel","Renzo Piano","Frank Gehry"],i:"Commandée dans le cadre des Grands Travaux de François Mitterrand et inaugurée en 1989, elle a été très critiquée avant de devenir un symbole de Paris."},
{c:"Architecture",d:1,q:"Combien de spectateurs le Colisée de Rome pouvait-il accueillir ?",a:["Entre 50 000 et 80 000","Environ 5 000","Environ 150 000","Environ 250 000"],i:"Inauguré en 80 apr. J.-C. sous Titus. Une immense toile tendue, le velarium, protégeait le public du soleil."},
{c:"Architecture",d:1,q:"À quelle divinité le Parthénon d'Athènes est-il dédié ?",a:["Athéna","Zeus","Apollon","Poséidon"],i:"Construit au Ve siècle av. J.-C. sur l'Acropole, en l'honneur d'Athéna Parthénos, protectrice de la cité."},
{c:"Architecture",d:1,q:"La Grande Muraille de Chine est-elle visible à l'œil nu depuis la Lune ?",a:["Non, c'est un mythe","Oui, par temps clair","Oui, mais seulement de nuit","Oui, grâce à sa couleur claire"],i:"Elle est bien trop étroite pour être vue à 384 000 km. Même depuis l'orbite basse, c'est très difficile : le premier astronaute chinois, Yang Liwei, a dit ne pas l'avoir vue."},
{c:"Architecture",d:2,q:"Qu'appelle-t-on l'« effet Bilbao » ?",a:["La relance d'une ville grâce à un bâtiment emblématique","L'effondrement d'un pont sous l'effet du vent","La hausse des loyers due au tourisme","Un défaut acoustique des salles de concert"],i:"D'après le musée Guggenheim de Frank Gehry (1997), qui a transformé l'image et l'économie d'une ville industrielle en déclin."},
{c:"Architecture",d:2,q:"Qui a conçu le Centre Pompidou, à Paris ?",a:["Renzo Piano et Richard Rogers","Jean Nouvel","Ieoh Ming Pei","Oscar Niemeyer"],i:"Inauguré en 1977. Les tuyaux extérieurs sont colorés selon leur fonction : bleu pour l'air, vert pour l'eau, jaune pour l'électricité, rouge pour les circulations."},
{c:"Architecture",d:3,q:"Combien de temps a duré la construction de la tour de Pise ?",a:["Environ 200 ans","Environ 20 ans","Environ 50 ans","Environ 5 ans"],i:"De 1173 à 1372. Les longues interruptions, dues notamment aux guerres, ont laissé le sol se tasser, ce qui lui aurait évité de s'effondrer."},
{c:"Architecture",d:1,q:"Qu'est-ce que le Taj Mahal, à l'origine ?",a:["Un mausolée","Un palais royal","Une mosquée","Une forteresse"],i:"Construit par l'empereur moghol Shah Jahan en mémoire de son épouse Mumtaz Mahal, morte en 1631."},

// ---------- Géographie ----------
{c:"Géographie",d:1,q:"Quel est le plus long fleuve entièrement français ?",a:["La Loire","La Seine","La Garonne","La Dordogne"],i:"Environ 1 000 km. Le Rhône et le Rhin sont plus longs, mais prennent leur source en Suisse."},
{c:"Géographie",d:2,q:"Quel pays compte le plus de lacs ?",a:["Le Canada","La Finlande","La Russie","Les États-Unis"],i:"Le Canada abrite une très grande part des lacs de la planète, bien plus que la Finlande, pourtant surnommée « le pays aux mille lacs »."},
{c:"Géographie",d:1,q:"Quelle est la capitale de l'Australie ?",a:["Canberra","Sydney","Melbourne","Perth"],i:"Choisie comme compromis entre Sydney et Melbourne, rivales. Sa construction débute en 1913."},
{c:"Géographie",d:2,q:"Quel est le plus grand désert du monde ?",a:["L'Antarctique","Le Sahara","Le désert de Gobi","Le désert d'Arabie"],i:"Un désert se définit par la rareté des précipitations, pas par la chaleur. L'Antarctique (environ 14 millions de km²) devance l'Arctique. Le Sahara est le plus grand désert chaud."},
{c:"Géographie",d:2,q:"Lequel de ces pays est entièrement entouré par un seul autre pays ?",a:["Le Lesotho","Andorre","Le Liechtenstein","Le Luxembourg"],i:"Il est enclavé dans l'Afrique du Sud. Le Vatican et Saint-Marin, entourés par l'Italie, sont les deux autres pays dans ce cas."},
{c:"Géographie",d:1,q:"Où se trouve le point le plus profond des océans ?",a:["Dans la fosse des Mariannes","Dans la fosse de Porto Rico","Dans la fosse des Tonga","Dans la fosse de Java"],i:"Le Challenger Deep dépasse 10 900 m. L'Everest (8 849 m) y serait englouti sous environ 2 km d'eau."},
{c:"Géographie",d:2,q:"Laquelle de ces villes est située le plus au nord ?",a:["Paris","Montréal","New York","Rome"],i:"Paris est vers 48,9° de latitude nord, Montréal vers 45,5°. Les courants de l'Atlantique Nord adoucissent beaucoup le climat de l'Europe de l'Ouest."},
{c:"Géographie",d:3,q:"Quel pays compterait le plus d'îles au monde ?",a:["La Suède","L'Indonésie","Les Philippines","Le Japon"],i:"Environ 267 000 selon l'office statistique suédois (2013). Le classement dépend fortement de la définition retenue pour une île."},
{c:"Géographie",d:1,q:"Quelle est la plus grande île du monde (hors continents) ?",a:["Le Groenland","La Nouvelle-Guinée","Bornéo","Madagascar"],i:"Environ 2,1 millions de km². L'Australie, plus grande, est considérée comme un continent."},
{c:"Géographie",d:3,q:"Quel fleuve traverse ou longe le plus grand nombre de pays ?",a:["Le Danube","Le Rhin","L'Amazone","Le Mékong"],i:"10 pays, de l'Allemagne à l'Ukraine, et 4 capitales : Vienne, Bratislava, Budapest et Belgrade."},
{c:"Géographie",d:2,q:"Quel est le seul drapeau national qui n'est pas un quadrilatère ?",a:["Celui du Népal","Celui du Bhoutan","Celui de la Suisse","Celui du Qatar"],i:"Il est formé de deux fanions triangulaires superposés. La Suisse et le Vatican ont, eux, des drapeaux carrés."},
{c:"Géographie",d:3,q:"Mesurée depuis sa base, quelle est la plus haute montagne du monde ?",a:["Le Mauna Kea","L'Everest","Le K2","Le Kilimandjaro"],i:"Ce volcan d'Hawaï mesure environ 10 200 m depuis le fond de l'océan Pacifique, dont 4 207 m seulement au-dessus du niveau de la mer."},

// ---------- Arts & Culture ----------
{c:"Arts & Culture",d:2,q:"Selon la tradition, combien de tableaux Van Gogh a-t-il vendus de son vivant ?",a:["Un seul","Aucun","Une trentaine","Plus d'une centaine"],i:"La légende retient « La Vigne rouge », vendue en 1890. Des historiens évoquent quelques autres ventes ou échanges, mais son succès de son vivant est resté quasi nul."},
{c:"Arts & Culture",d:1,q:"Qui a peint « La Liberté guidant le peuple » ?",a:["Eugène Delacroix","Théodore Géricault","Jacques-Louis David","Gustave Courbet"],i:"Peinte en 1830, elle célèbre les Trois Glorieuses de juillet 1830, et non la Révolution de 1789 comme on le croit souvent."},
{c:"Arts & Culture",d:2,q:"Qui a volé La Joconde au Louvre en 1911 ?",a:["Un vitrier italien qui avait travaillé au musée","Guillaume Apollinaire","Un collectionneur américain","Un gardien du Louvre"],i:"Vincenzo Peruggia l'a cachée plus de deux ans avant d'être arrêté à Florence en 1913. Pendant l'enquête, Apollinaire a été brièvement incarcéré et Picasso interrogé."},
{c:"Arts & Culture",d:1,q:"Quel compositeur était presque totalement sourd lorsqu'il a composé sa 9e symphonie ?",a:["Beethoven","Mozart","Bach","Chopin"],i:"Créée à Vienne en 1824. Selon les témoignages, il a fallu le retourner vers la salle pour qu'il voie le public applaudir."},
{c:"Arts & Culture",d:2,q:"Pendant quelle pièce Molière a-t-il été pris d'un malaise sur scène, quelques heures avant sa mort ?",a:["Le Malade imaginaire","Le Misanthrope","Tartuffe","L'Avare"],i:"Le 17 février 1673, à la 4e représentation. Contrairement à la légende, il n'est pas mort sur scène mais chez lui, peu après."},
{c:"Arts & Culture",d:1,q:"Quel roman s'ouvre sur « Aujourd'hui, maman est morte. » ?",a:["L'Étranger, d'Albert Camus","La Nausée, de Jean-Paul Sartre","La Peste, d'Albert Camus","Bonjour tristesse, de Françoise Sagan"],i:"Publié en 1942. Camus reçoit le prix Nobel de littérature en 1957."},
{c:"Arts & Culture",d:2,q:"Quel artiste a présenté un urinoir comme œuvre d'art en 1917 ?",a:["Marcel Duchamp","René Magritte","Salvador Dalí","Andy Warhol"],i:"« Fontaine », signée « R. Mutt ». C'est le plus célèbre des ready-made : un objet manufacturé devenu œuvre par le seul choix de l'artiste."},
{c:"Arts & Culture",d:2,q:"Quel pays produit généralement le plus de longs métrages chaque année ?",a:["L'Inde","Les États-Unis","La France","La Chine"],i:"Toutes langues confondues (hindi, tamoul, télougou...), l'Inde produit bien plus de films que Hollywood, qui domine en revanche les recettes mondiales."},
{c:"Arts & Culture",d:2,q:"Dans quel musée peut-on voir « La Nuit étoilée » de Van Gogh ?",a:["Le MoMA, à New York","Le musée d'Orsay, à Paris","Le musée Van Gogh, à Amsterdam","La National Gallery, à Londres"],i:"Peinte en juin 1889 depuis l'asile de Saint-Rémy-de-Provence, où il était soigné. Le MoMA l'a acquise en 1941."},
{c:"Arts & Culture",d:3,q:"Combien d'années Victor Hugo a-t-il passées en exil ?",a:["Environ 19 ans","Environ 5 ans","Environ 10 ans","Environ 30 ans"],i:"De 1851, après le coup d'État de Louis-Napoléon Bonaparte, à 1870. Il vit à Jersey puis à Guernesey, où il achève « Les Misérables »."},
{c:"Arts & Culture",d:1,q:"Quelle langue compte le plus de locuteurs natifs au monde ?",a:["Le chinois mandarin","L'anglais","L'espagnol","L'hindi"],i:"Si l'on ajoute les locuteurs non natifs, c'est en revanche l'anglais qui est la langue la plus parlée."},

// ---------- Sport ----------
{c:"Sport",d:1,q:"Quelle est la distance officielle d'un marathon ?",a:["42,195 km","40 km","42 km","45 km"],i:"C'est la distance des JO de Londres 1908, du château de Windsor au stade, officialisée en 1921."},
{c:"Sport",d:2,q:"Pourquoi une balle de golf est-elle couverte d'alvéoles ?",a:["Pour réduire la traînée et voler plus loin","Pour être plus légère","Pour mieux rouler sur le green","Par tradition écossaise"],i:"Les alvéoles rendent turbulente la fine couche d'air autour de la balle, ce qui réduit le sillage derrière elle. Une balle lisse irait nettement moins loin."},
{c:"Sport",d:1,q:"Où et quand ont eu lieu les premiers Jeux olympiques modernes ?",a:["Athènes, 1896","Paris, 1900","Londres, 1908","Olympie, 1892"],i:"À l'initiative de Pierre de Coubertin. Paris accueille la deuxième édition en 1900."},
{c:"Sport",d:1,q:"Combien de temps dure un round de boxe professionnelle masculine ?",a:["3 minutes","2 minutes","5 minutes","1 minute"],i:"Avec une minute de repos entre les rounds. Les combats de championnat du monde se disputent en 12 rounds au maximum."},
{c:"Sport",d:2,q:"Quel temps Usain Bolt a-t-il réalisé sur 100 m aux championnats du monde de Berlin en 2009 ?",a:["9,58 s","9,63 s","9,69 s","9,72 s"],i:"Un record du monde. 9,69 s était son chrono des JO de Pékin 2008, et 9,63 s celui des JO de Londres 2012."},
{c:"Sport",d:1,q:"Sur le Tour de France, que récompense le maillot à pois ?",a:["Le meilleur grimpeur","Le meilleur sprinteur","Le meilleur jeune","Le coureur le plus combatif"],i:"Le maillot vert récompense le classement par points, le blanc le meilleur jeune, et le jaune le leader du classement général."},
{c:"Sport",d:2,q:"Combien de médailles olympiques Michael Phelps a-t-il remportées au total ?",a:["28","18","22","35"],i:"Dont 23 en or, entre 2004 et 2016. Le record précédent (18) appartenait à la gymnaste soviétique Larissa Latynina."},
{c:"Sport",d:2,q:"Au golf, que signifie réussir un « albatros » ?",a:["Finir un trou 3 coups sous le par","Finir un trou 1 coup sous le par","Envoyer la balle dans l'eau","Rater la balle au départ"],i:"1 coup sous le par : birdie. 2 coups : eagle. 3 coups : albatros, un exploit plus rare qu'un trou en un."},
{c:"Sport",d:3,q:"Selon l'estimation de Claude Shannon, combien de parties d'échecs différentes seraient possibles ?",a:["Environ 10¹²⁰","Environ 10²⁰","Environ 10⁵⁰","Environ 10¹⁰⁰⁰"],i:"Le « nombre de Shannon » (1950), bien supérieur au nombre estimé d'atomes dans l'univers observable, de l'ordre de 10⁸⁰."},
{c:"Sport",d:1,q:"Combien de temps dure un match de rugby à XV, hors arrêts de jeu ?",a:["80 minutes","90 minutes","70 minutes","60 minutes"],i:"Deux mi-temps de 40 minutes. L'arbitre peut arrêter le chronomètre lors de certaines interruptions."},
{c:"Sport",d:2,q:"Combien de jours peut durer un match de cricket de type « Test » ?",a:["Jusqu'à 5 jours","1 journée","Jusqu'à 2 jours","Jusqu'à 10 jours"],i:"Et il peut malgré tout se terminer sur un match nul, faute de résultat dans le temps imparti."},

// ---------- Insolite & Records ----------
{c:"Insolite & Records",d:2,q:"Quel animal a survécu à une exposition directe au vide spatial en 2007 ?",a:["Le tardigrade","Le cafard","La fourmi","Le scorpion"],i:"Lors de la mission FOTON-M3, certains tardigrades exposés au vide et aux rayonnements ont survécu, et ont même pondu des œufs viables."},
{c:"Insolite & Records",d:1,q:"Quel mot est traditionnellement cité comme le plus long de la langue française ?",a:["Anticonstitutionnellement","Désinstitutionnalisation","Oto-rhino-laryngologiste","Incompréhensibilité"],i:"25 lettres. Il est en réalité battu par des mots plus rares, comme « intergouvernementalisations » (27 lettres)."},
{c:"Insolite & Records",d:1,q:"Pourquoi les flamants roses sont-ils roses ?",a:["À cause des pigments de leur alimentation","C'est une couleur génétique fixe","Pour se protéger du soleil","À cause d'une bactérie dans leurs plumes"],i:"Des caroténoïdes contenus dans les algues et les petits crustacés qu'ils mangent. Sans ces pigments, ils pâlissent."},
{c:"Insolite & Records",d:2,q:"En 1932, l'armée australienne a lancé une opération militaire contre quel animal ?",a:["L'émeu","Le kangourou","Le lapin","Le dromadaire"],i:"La « guerre des émeus » : des soldats équipés de mitrailleuses devaient protéger les cultures d'Australie-Occidentale. Le résultat fut si maigre que l'épisode est resté célèbre comme une défaite face aux oiseaux."},
{c:"Insolite & Records",d:1,q:"Quelle forme ont les crottes du wombat ?",a:["Des cubes","Des sphères","Des spirales","Des étoiles"],i:"Grâce à l'élasticité variable de la paroi de son intestin. Les chercheurs qui l'ont expliqué ont reçu un prix Ig Nobel en 2019."},
{c:"Insolite & Records",d:3,q:"Combien de temps a duré le plus long hoquet documenté ?",a:["68 ans","6 mois","3 ans","13 ans"],i:"L'Américain Charles Osborne a eu le hoquet de 1922 à 1990, selon le Guinness World Records."},
{c:"Insolite & Records",d:2,q:"Lequel de ces fruits est, au sens botanique, une baie ?",a:["La banane","La fraise","La framboise","La mûre"],i:"La fraise est un « faux-fruit » : ses vrais fruits sont les petits grains à sa surface (les akènes). Framboise et mûre sont des assemblages de petites drupes."},
{c:"Insolite & Records",d:3,q:"Il y a environ 70 millions d'années, combien de temps durait une journée sur Terre ?",a:["Environ 23 h 30","Environ 24 h 30","Environ 20 h","Environ 26 h"],i:"La Lune freine peu à peu la rotation terrestre par les marées. Une étude de 2020 sur la coquille d'un mollusque fossile (de Winter et al.) aboutit à environ 372 jours par an."},
{c:"Insolite & Records",d:1,q:"Que récompensent les prix Ig Nobel ?",a:["Des recherches qui font d'abord rire, puis réfléchir","Les pires inventions de l'année","Les scientifiques qui ont échoué","Les découvertes faites par hasard"],i:"Créés en 1991 par Marc Abrahams. Andre Geim a reçu un Ig Nobel en 2000 pour une grenouille en lévitation, puis le vrai Nobel de physique en 2010 pour le graphène."},
{c:"Insolite & Records",d:2,q:"Qu'est-ce que la triskaïdékaphobie ?",a:["La peur du nombre 13","La peur des araignées","La peur des mots longs","La peur des nombres impairs"],i:"Ironie du sort : la peur des mots longs porte l'un des noms les plus longs qui soient, l'hippopotomonstrosesquippédaliophobie."},
{c:"Insolite & Records",d:2,q:"Quel animal a des empreintes digitales si proches des nôtres qu'on pourrait les confondre ?",a:["Le koala","Le panda géant","La loutre de mer","Le paresseux"],i:"Un cas de convergence évolutive : le koala les a développées indépendamment des primates, probablement pour agripper les branches."},
{c:"Insolite & Records",d:1,q:"Quel mammifère pond des œufs ?",a:["L'ornithorynque","Le tatou","Le pangolin","Le paresseux"],i:"Avec les échidnés, ce sont les monotrèmes. Le mâle ornithorynque possède en plus un ergot venimeux sur les pattes arrière."},
{c:"Insolite & Records",d:3,q:"Quel animal possède les plus grands yeux du règne animal ?",a:["Le calmar colossal","La baleine bleue","L'autruche","Le hibou grand-duc"],i:"Jusqu'à environ 27 cm de diamètre, la taille d'un ballon de football. Chez les animaux terrestres, le record revient à l'autruche."},
{c:"Insolite & Records",d:2,q:"Quel animal est l'emblème national de l'Écosse ?",a:["La licorne","Le lion","Le cerf","L'aigle royal"],i:"Elle figure, enchaînée, sur les armoiries royales du Royaume-Uni, face au lion qui représente l'Angleterre."},
{c:"Insolite & Records",d:3,q:"Combien pèse environ un petit nuage de beau temps (cumulus) ?",a:["Environ 500 tonnes","Environ 5 kg","Environ 500 kg","Environ 5 millions de tonnes"],i:"Estimation popularisée par la météorologue Peggy LeMone : environ 1 km³ d'air contenant à peu près 0,5 g d'eau par m³. Il flotte car ces gouttelettes minuscules sont réparties dans un énorme volume d'air."},

// ---------- Renforts « Difficile » ----------
{c:"Histoire",d:3,q:"En quelle année Henri IV a-t-il signé l'édit de Nantes ?",a:["1598","1572","1685","1610"],i:"Il accorde la liberté de culte aux protestants. 1572 est l'année de la Saint-Barthélemy, 1610 celle de l'assassinat d'Henri IV, et 1685 celle de la révocation de l'édit par Louis XIV."},
{c:"Histoire",d:3,q:"Qui commandait l'expédition lorsqu'elle a achevé le premier tour du monde, en 1522 ?",a:["Juan Sebastián Elcano","Fernand de Magellan","Vasco de Gama","Francis Drake"],i:"Magellan a lancé l'expédition, mais il est tué aux Philippines en 1521. Elcano ramène en Espagne le seul navire survivant, la Victoria, avec 18 hommes sur les quelque 240 du départ."},
{c:"Histoire",d:3,q:"Combien de temps a duré la Commune de Paris, en 1871 ?",a:["72 jours","12 jours","8 mois","2 ans"],i:"Du 18 mars au 28 mai 1871. Elle s'achève par la « Semaine sanglante », pendant laquelle l'armée versaillaise reprend Paris."},
{c:"Sciences",d:3,q:"Quelle est la demi-vie du carbone 14, utilisé pour dater les restes organiques ?",a:["Environ 5 700 ans","Environ 570 ans","Environ 57 000 ans","Environ 5,7 millions d'années"],i:"Environ 5 730 ans. Au-delà d'environ 50 000 ans, il en reste trop peu pour dater de façon fiable."},
{c:"Sciences",d:3,q:"Quelle est la valeur approximative du nombre d'Avogadro ?",a:["6,022 × 10²³","6,67 × 10⁻¹¹","3 × 10⁸","1,6 × 10⁻¹⁹"],i:"C'est le nombre d'entités dans une mole. Les autres sont la constante gravitationnelle (en unités SI), la vitesse de la lumière (m/s) et la charge de l'électron (C)."},
{c:"Arts & Culture",d:3,q:"Quel écrivain a refusé le prix Nobel de littérature en 1964 ?",a:["Jean-Paul Sartre","Albert Camus","André Malraux","André Gide"],i:"Il refusait par principe toute distinction officielle : selon lui, l'écrivain doit refuser de « se laisser transformer en institution »."},
{c:"Arts & Culture",d:3,q:"Quel roman de Georges Perec est écrit entièrement sans la lettre « e » ?",a:["La Disparition","La Vie mode d'emploi","Les Choses","W ou le Souvenir d'enfance"],i:"Publié en 1969, c'est un lipogramme de près de 300 pages. Perec a ensuite écrit « Les Revenentes », où « e » est la seule voyelle."},
{c:"Sport",d:3,q:"En quelle année a eu lieu le premier Tour de France ?",a:["1903","1896","1910","1921"],i:"Organisé par le journal L'Auto pour doper ses ventes. Il comptait 6 étapes, et Maurice Garin l'a remporté."},
{c:"Sport",d:3,q:"Quel pays a remporté la première Coupe du monde de football, en 1930 ?",a:["L'Uruguay","L'Argentine","Le Brésil","L'Italie"],i:"Pays organisateur, l'Uruguay bat l'Argentine 4 à 2 en finale, à Montevideo. Seules 13 équipes y participaient."},
{c:"Finance & Économie",d:3,q:"En supply chain, qu'appelle-t-on l'« effet coup de fouet » (bullwhip effect) ?",a:["L'amplification des variations de commandes en remontant la chaîne","La hausse brutale des prix du transport en période de pic","Le rebond des ventes après une rupture de stock","L'accélération des livraisons en fin de trimestre"],i:"Décrit par Jay Forrester (1961), puis analysé par Lee, Padmanabhan et Whang (1997). Le « Beer Game » du MIT le fait vivre en quelques tours."},
{c:"Finance & Économie",d:3,q:"Que calcule la formule de Wilson, Q* = √(2DS/H) ?",a:["La quantité économique de commande","Le stock de sécurité","Le point de commande","Le taux de service"],i:"Elle équilibre coût de passation et coût de possession. Proposée par Ford W. Harris en 1913, elle a été popularisée par R. H. Wilson en 1934."},
{c:"Géopolitique",d:3,q:"Quel traité de 1648 est souvent présenté comme l'acte fondateur du système moderne d'États souverains ?",a:["Les traités de Westphalie","Le traité d'Utrecht","Le congrès de Vienne","Le traité de Tordesillas"],i:"Ils mettent fin à la guerre de Trente Ans. Des historiens contestent aujourd'hui cette lecture « westphalienne », jugée en partie mythifiée."},

// =================== PACK 2 ===================
// ---------- Histoire ----------
{c:"Histoire",d:1,q:"Quelle reine de France a été guillotinée en octobre 1793 ?",a:["Marie-Antoinette","Catherine de Médicis","Anne d'Autriche","Joséphine de Beauharnais"],i:"Le 16 octobre 1793, près de neuf mois après Louis XVI, exécuté le 21 janvier 1793."},
{c:"Histoire",d:1,q:"Quel pharaon a vu son tombeau découvert presque intact par Howard Carter en 1922 ?",a:["Toutânkhamon","Ramsès II","Khéops","Akhenaton"],i:"Dans la Vallée des Rois. Pharaon plutôt secondaire, mort jeune, il doit sa célébrité au fait que sa tombe avait échappé aux pilleurs."},
{c:"Histoire",d:1,q:"En quelle année le Titanic a-t-il coulé ?",a:["1912","1905","1915","1921"],i:"Dans la nuit du 14 au 15 avril 1912, lors de sa traversée inaugurale. Plus de 1 500 personnes sont mortes."},
{c:"Histoire",d:1,q:"En quelle année Christophe Colomb a-t-il atteint les Amériques pour la première fois ?",a:["1492","1498","1453","1515"],i:"Le 12 octobre 1492, dans l'archipel des Bahamas. Il pensait avoir atteint l'Asie par l'ouest."},
{c:"Histoire",d:2,q:"Quelle bataille de 1805 est surnommée « la bataille des Trois Empereurs » ?",a:["Austerlitz","Iéna","Wagram","Waterloo"],i:"Le 2 décembre 1805, un an jour pour jour après son sacre, Napoléon y bat l'empereur d'Autriche et le tsar Alexandre Ier."},
{c:"Histoire",d:2,q:"Quel roi de France a été surnommé « le Bien-Aimé » ?",a:["Louis XV","Louis XIV","Louis XVI","Henri IV"],i:"Surnom reçu en 1744, quand la France s'inquiète de sa grave maladie à Metz. Il finira pourtant son règne très impopulaire."},
{c:"Histoire",d:2,q:"Pendant combien de temps l'Empire romain d'Orient a-t-il survécu à la chute de Rome (476) ?",a:["Près de 1 000 ans","Environ 100 ans","Environ 300 ans","Environ 500 ans"],i:"Jusqu'à la prise de Constantinople par les Ottomans de Mehmed II, le 29 mai 1453."},
{c:"Histoire",d:2,q:"Quel empereur a unifié la Chine en 221 av. J.-C. et s'est fait enterrer avec une armée de terre cuite ?",a:["Qin Shi Huang","Kubilai Khan","Wu Zetian","Hongwu"],i:"L'armée, estimée à environ 8 000 soldats, a été découverte par hasard en 1974 par des paysans près de Xi'an."},
{c:"Histoire",d:2,q:"Où a été signé l'armistice du 11 novembre 1918 ?",a:["Dans un wagon, en forêt de Compiègne","Dans la galerie des Glaces, à Versailles","À l'Élysée, à Paris","Dans une ferme près de Verdun"],i:"Près de Rethondes. En juin 1940, Hitler fera signer l'armistice à la France dans le même wagon, au même endroit."},
{c:"Histoire",d:2,q:"Quel peuple a fondé Carthage ?",a:["Les Phéniciens","Les Grecs","Les Romains","Les Égyptiens"],i:"Des colons venus de Tyr, au Liban actuel. La date traditionnelle de fondation est 814 av. J.-C."},
{c:"Histoire",d:3,q:"Qui a assuré deux fois l'intérim de la présidence de la République sous la Ve République ?",a:["Alain Poher","Gaston Monnerville","Jacques Chaban-Delmas","Georges Pompidou"],i:"En tant que président du Sénat : en 1969 après la démission du général de Gaulle, puis en 1974 après la mort de Georges Pompidou."},
{c:"Histoire",d:3,q:"Quel traité de 1494 a partagé les terres nouvellement découvertes entre l'Espagne et le Portugal ?",a:["Le traité de Tordesillas","Le traité de Saragosse","Le traité d'Utrecht","Le traité de Paris"],i:"La ligne de partage passait à 370 lieues à l'ouest du Cap-Vert. C'est pourquoi on parle portugais au Brésil. Le traité de Saragosse (1529) a fait de même en Asie."},
{c:"Histoire",d:3,q:"Quelle guerre (1756 à 1763) a fait perdre à la France la Nouvelle-France (le Canada) ?",a:["La guerre de Sept Ans","La guerre de Succession d'Espagne","La guerre de Succession d'Autriche","La guerre de Trente Ans"],i:"Le traité de Paris de 1763 cède le Canada aux Britanniques. Menée sur plusieurs continents, elle est parfois décrite comme une première guerre « mondiale »."},

// ---------- Géopolitique ----------
{c:"Géopolitique",d:1,q:"Dans quelle ville se trouve le siège de l'ONU ?",a:["New York","Genève","Paris","Bruxelles"],i:"Le terrain a été financé par John D. Rockefeller Jr. Genève accueille l'Office des Nations unies, le deuxième grand centre de l'organisation."},
{c:"Géopolitique",d:1,q:"Combien de pays compte l'Union européenne depuis le Brexit ?",a:["27","28","25","30"],i:"Le Royaume-Uni est sorti le 31 janvier 2020. Le dernier pays entré est la Croatie, en 2013."},
{c:"Géopolitique",d:1,q:"Quelle est la capitale de la Turquie ?",a:["Ankara","Istanbul","Izmir","Bursa"],i:"Choisie par Mustafa Kemal Atatürk en 1923, notamment pour rompre avec Istanbul, capitale de l'Empire ottoman."},
{c:"Géopolitique",d:2,q:"Combien d'États sont membres de l'ONU ?",a:["193","195","180","206"],i:"Le dernier admis est le Soudan du Sud, en 2011. Le Saint-Siège et la Palestine ont le statut d'États observateurs non membres."},
{c:"Géopolitique",d:2,q:"Lequel de ces pays ne fait PAS partie du G7 ?",a:["La Chine","Le Canada","L'Italie","Le Japon"],i:"G7 : États-Unis, Japon, Allemagne, Royaume-Uni, France, Italie, Canada. La Russie y a siégé (G8) de 1997 à 2014, avant d'être exclue après l'annexion de la Crimée."},
{c:"Géopolitique",d:2,q:"Quel pays possède le plus grand nombre d'ogives nucléaires, selon le SIPRI ?",a:["La Russie","Les États-Unis","La Chine","La France"],i:"L'institut de recherche suédois SIPRI estime que la Russie et les États-Unis détiennent à eux deux près de 90 % des armes nucléaires du monde."},
{c:"Géopolitique",d:2,q:"La zone démilitarisée entre les deux Corées suit approximativement quel parallèle ?",a:["Le 38e","Le 17e","Le 49e","Le 45e"],i:"Le 17e parallèle séparait les deux Vietnam, et le 49e sert en partie de frontière entre le Canada et les États-Unis."},
{c:"Géopolitique",d:2,q:"Le Mercosur est une union douanière de quelle région du monde ?",a:["Amérique du Sud","Asie du Sud-Est","Afrique de l'Ouest","Europe de l'Est"],i:"Créé en 1991 par le traité d'Asunción entre l'Argentine, le Brésil, le Paraguay et l'Uruguay."},
{c:"Géopolitique",d:2,q:"Quel pays membre de l'OTAN est situé à cheval entre l'Europe et l'Asie ?",a:["La Turquie","La Géorgie","Le Kazakhstan","L'Azerbaïdjan"],i:"Membre depuis 1952, elle contrôle le Bosphore et les Dardanelles, seul accès de la mer Noire à la Méditerranée."},
{c:"Géopolitique",d:3,q:"Quelle convention de 1936 encadre le passage des navires de guerre par les détroits turcs ?",a:["La convention de Montreux","Le traité de Lausanne","La convention de Montego Bay","La convention de Genève"],i:"En temps de guerre, la Turquie peut fermer les détroits aux belligérants, ce qu'elle a fait en 2022. Montego Bay (1982) est la convention de l'ONU sur le droit de la mer."},
{c:"Géopolitique",d:3,q:"Quel pays a quitté l'OPEP en 2019 pour se concentrer sur le gaz naturel ?",a:["Le Qatar","L'Algérie","Le Koweït","La Libye"],i:"Premier pays du Golfe à quitter l'organisation, le Qatar est l'un des tout premiers exportateurs mondiaux de gaz naturel liquéfié."},
{c:"Géopolitique",d:3,q:"Qu'appelle-t-on le « format Normandie » ?",a:["Un groupe de négociation sur la guerre dans le Donbass","Un accord de pêche franco-britannique dans la Manche","Une alliance militaire née du Débarquement","Le format des réunions du G20"],i:"France, Allemagne, Russie et Ukraine. Il est né en juin 2014, lors d'une rencontre en marge des commémorations du Débarquement."},
{c:"Géopolitique",d:3,q:"Dans quel pays se trouve Camp Humphreys, présentée comme la plus grande base militaire américaine à l'étranger ?",a:["La Corée du Sud","Le Japon","L'Allemagne","Le Qatar"],i:"Au sud de Séoul. Environ 28 000 militaires américains sont stationnés en Corée du Sud."},

// ---------- Finance & Économie ----------
{c:"Finance & Économie",d:1,q:"Que mesure l'inflation ?",a:["La hausse générale et durable des prix","La hausse des salaires","La croissance du PIB","La hausse du chômage"],i:"En France, l'Insee la mesure avec l'indice des prix à la consommation (IPC), à partir d'un panier représentatif de biens et services."},
{c:"Finance & Économie",d:1,q:"Quelle entreprise a créé le système de production dont est issu le « lean » ?",a:["Toyota","Ford","General Electric","Honda"],i:"Le Toyota Production System, développé notamment par Taiichi Ohno. Le mot « lean » a été popularisé par le livre « The Machine That Changed the World » (1990)."},
{c:"Finance & Économie",d:1,q:"Quelle monnaie domine les réserves de change des banques centrales ?",a:["Le dollar américain","L'euro","Le yuan","Le yen"],i:"Près de 60 % des réserves déclarées au FMI. L'euro arrive loin derrière, autour de 20 %."},
{c:"Finance & Économie",d:2,q:"Que signifie OPA ?",a:["Offre publique d'achat","Opération de placement d'actions","Obligation à paiement anticipé","Option de prix d'achat"],i:"Proposer à tous les actionnaires d'une société cotée de racheter leurs titres à un prix fixé, en général avec une prime sur le cours."},
{c:"Finance & Économie",d:2,q:"Quelle bourse est généralement considérée comme la plus ancienne du monde ?",a:["Amsterdam","Londres","New York","Paris"],i:"Née en 1602 pour échanger les actions de la VOC, la Compagnie néerlandaise des Indes orientales, souvent présentée comme la première société cotée."},
{c:"Finance & Économie",d:2,q:"Qu'est-ce que la stagflation ?",a:["Une croissance faible combinée à une forte inflation","Une baisse des prix combinée à une forte croissance","Une hausse des taux sans inflation","Un marché boursier qui stagne"],i:"Le cas d'école est celui des années 1970, après les chocs pétroliers de 1973 et 1979."},
{c:"Finance & Économie",d:2,q:"Dans le lean, que désigne le mot japonais « muda » ?",a:["Le gaspillage","L'amélioration continue","Le zéro défaut","L'arrêt de la ligne"],i:"Taiichi Ohno en liste 7 : surproduction, attentes, transports, traitements inutiles, stocks, mouvements inutiles et défauts. L'amélioration continue, c'est le kaizen."},
{c:"Finance & Économie",d:2,q:"Dans une classification ABC classique, que représentent les articles de classe A ?",a:["Peu de références, mais l'essentiel de la valeur","La majorité des références, pour peu de valeur","Les articles en rupture de stock","Les articles à rotation lente"],i:"Typiquement 10 à 20 % des références pour 70 à 80 % de la valeur consommée. Ce sont eux qu'on pilote de près."},
{c:"Finance & Économie",d:2,q:"En gestion des stocks, que mesure le taux de service (fill rate) ?",a:["La part de la demande servie immédiatement depuis le stock","Le nombre de rotations du stock par an","La part du stock endommagée","Le délai moyen de livraison fournisseur"],i:"Un taux de 98 % signifie que 2 % de la demande n'est pas servie à temps. Viser 100 % fait exploser le stock de sécurité."},
{c:"Finance & Économie",d:3,q:"Que dit la loi de Goodhart ?",a:["Quand une mesure devient un objectif, elle cesse d'être une bonne mesure","Les dépenses publiques augmentent plus vite que le PIB","Le chômage baisse quand la croissance dépasse 3 %","Les prix finissent toujours par revenir à leur moyenne"],i:"Énoncée par l'économiste Charles Goodhart en 1975, sous cette forme par l'anthropologue Marilyn Strathern en 1997. Un classique des KPI détournés."},
{c:"Finance & Économie",d:3,q:"Dans la méthode des 5S, que signifie le premier S, « Seiri » ?",a:["Trier","Ranger","Nettoyer","Standardiser"],i:"Seiri (trier), Seiton (ranger), Seiso (nettoyer), Seiketsu (standardiser), Shitsuke (faire respecter, maintenir)."},
{c:"Finance & Économie",d:3,q:"Que vise la méthode SMED, formalisée par Shigeo Shingo ?",a:["Changer de série en moins de 10 minutes","Réduire les stocks à zéro","Supprimer les contrôles qualité","Automatiser la maintenance"],i:"Single-Minute Exchange of Die : « single minute » veut dire un nombre de minutes à un seul chiffre. Des changements plus courts permettent des lots plus petits."},
{c:"Finance & Économie",d:3,q:"Quel taux de défauts vise la démarche Six Sigma ?",a:["3,4 défauts par million d'opportunités","1 défaut pour 1 000","6 défauts par million","1 défaut pour 100"],i:"Chiffre obtenu avec la convention d'une dérive de 1,5 sigma de la moyenne. La démarche a été lancée par Motorola dans les années 1980."},
{c:"Finance & Économie",d:3,q:"Aux États-Unis, dans les années 1950, quel était le taux de la tranche la plus haute de l'impôt fédéral sur le revenu ?",a:["Environ 91 %","Environ 39 %","Environ 50 %","Environ 70 %"],i:"91 à 92 % selon les années. Il ne touchait que des revenus très élevés, et les niches fiscales réduisaient fortement le taux réellement payé."},
{c:"Finance & Économie",d:3,q:"Que mesure le ratio de Sharpe ?",a:["Le rendement excédentaire par unité de risque","La part des bénéfices distribuée en dividendes","Le niveau d'endettement d'une entreprise","La liquidité d'un marché"],i:"(rendement du portefeuille − taux sans risque) ÷ volatilité. William Sharpe a reçu le prix Nobel d'économie en 1990."},

// ---------- Sciences ----------
{c:"Sciences",d:1,q:"Quelle est la plus grande planète du système solaire ?",a:["Jupiter","Saturne","Neptune","Uranus"],i:"Environ 1 300 Terres pourraient tenir dans son volume."},
{c:"Sciences",d:1,q:"Quel est le symbole chimique de l'or ?",a:["Au","Or","Ag","Go"],i:"Du latin aurum. Ag est l'argent, du latin argentum."},
{c:"Sciences",d:1,q:"Quel est l'os le plus long du corps humain ?",a:["Le fémur","Le tibia","L'humérus","Le péroné"],i:"Environ un quart de la taille d'un adulte. C'est aussi l'un des os les plus solides du corps."},
{c:"Sciences",d:1,q:"Quel scientifique a publié « L'Origine des espèces » en 1859 ?",a:["Charles Darwin","Jean-Baptiste de Lamarck","Gregor Mendel","Louis Pasteur"],i:"Alfred Russel Wallace était arrivé de son côté à la même idée de sélection naturelle. Leurs travaux ont été présentés ensemble en 1858."},
{c:"Sciences",d:2,q:"Sur quelle planète se trouve Olympus Mons, le plus grand volcan connu du système solaire ?",a:["Mars","Vénus","Mercure","Io, une lune de Jupiter"],i:"Environ 22 km de haut, soit près de 2,5 fois l'Everest, pour un diamètre d'environ 600 km."},
{c:"Sciences",d:2,q:"Combien de temps met la lumière de la Lune pour atteindre la Terre ?",a:["Environ 1,3 seconde","Environ 8 minutes","Environ 13 secondes","Environ 1 minute"],i:"La Lune est à environ 384 000 km. Les astronautes d'Apollo parlaient donc avec un léger décalage."},
{c:"Sciences",d:2,q:"Quel physicien a formulé le principe d'incertitude en 1927 ?",a:["Werner Heisenberg","Erwin Schrödinger","Niels Bohr","Max Planck"],i:"On ne peut pas connaître à la fois, avec une précision arbitraire, la position et la vitesse d'une particule."},
{c:"Sciences",d:2,q:"Quel groupe sanguin est le donneur universel de globules rouges ?",a:["O négatif","AB positif","A négatif","B positif"],i:"Il est compatible avec tous les receveurs. À l'inverse, AB positif est le receveur universel."},
{c:"Sciences",d:2,q:"Quelle particule a été découverte au CERN en 2012 ?",a:["Le boson de Higgs","Le quark top","Le neutrino","Le graviton"],i:"Prédite en 1964. Peter Higgs et François Englert ont reçu le Nobel de physique en 2013. Le graviton n'a jamais été observé."},
{c:"Sciences",d:2,q:"Quelle est la vitesse du son dans l'air à 20 °C ?",a:["Environ 343 m/s","Environ 34 m/s","Environ 1 500 m/s","Environ 3 000 m/s"],i:"Environ 1 235 km/h. Dans l'eau, le son va plus de 4 fois plus vite, autour de 1 500 m/s."},
{c:"Sciences",d:3,q:"Que représente le nombre de Reynolds en mécanique des fluides ?",a:["Le rapport entre forces d'inertie et forces visqueuses","Le rapport entre pression et température","La vitesse d'un fluide divisée par celle du son","La densité d'un fluide par rapport à l'eau"],i:"Il sert à prévoir si un écoulement sera laminaire ou turbulent. Osborne Reynolds l'a étudié en 1883. La vitesse divisée par celle du son, c'est le nombre de Mach."},
{c:"Sciences",d:3,q:"Quel métal a le point de fusion le plus élevé ?",a:["Le tungstène","Le titane","Le platine","Le fer"],i:"Environ 3 422 °C, d'où son usage dans les filaments d'ampoules à incandescence."},
{c:"Sciences",d:3,q:"Qu'appelle-t-on l'effet Mpemba ?",a:["Le fait que de l'eau chaude puisse geler plus vite que de l'eau froide","L'accélération des réactions chimiques par la lumière","La dilatation de l'eau quand elle gèle","L'ébullition de l'eau à basse pression"],i:"Du nom d'Erasto Mpemba, lycéen tanzanien qui l'a décrit (article de 1969). Le phénomène reste débattu : les expériences se contredisent."},
{c:"Sciences",d:3,q:"Combien de neurones contient à peu près le cerveau humain ?",a:["Environ 86 milliards","Environ 8 milliards","Environ 860 millions","Environ 1 000 milliards"],i:"Estimation de Suzana Herculano-Houzel et ses collègues (2009), qui a remplacé le chiffre rond de 100 milliards répété sans vraie mesure."},

// ---------- Géographie ----------
{c:"Géographie",d:1,q:"Quelle est la capitale du Canada ?",a:["Ottawa","Toronto","Montréal","Vancouver"],i:"Choisie en 1857 par la reine Victoria, notamment comme compromis entre anglophones et francophones."},
{c:"Géographie",d:1,q:"Quel est le plus grand océan ?",a:["Le Pacifique","L'Atlantique","L'océan Indien","L'océan Arctique"],i:"Il est plus vaste que toutes les terres émergées réunies."},
{c:"Géographie",d:1,q:"Dans quel pays se trouve le Machu Picchu ?",a:["Le Pérou","La Bolivie","Le Mexique","Le Chili"],i:"Une cité inca du XVe siècle, rendue célèbre par l'explorateur américain Hiram Bingham en 1911."},
{c:"Géographie",d:1,q:"Sur quel continent se trouve le désert d'Atacama, l'un des plus arides du monde ?",a:["L'Amérique du Sud","L'Afrique","L'Asie","L'Océanie"],i:"Au Chili. Certaines stations météo n'y ont jamais enregistré de pluie significative."},
{c:"Géographie",d:2,q:"Quel est le plus long fleuve d'Europe ?",a:["La Volga","Le Danube","Le Rhin","Le Dniepr"],i:"Environ 3 500 km, entièrement en Russie, jusqu'à la mer Caspienne. Le Danube arrive deuxième."},
{c:"Géographie",d:2,q:"Quel est le plus haut sommet des Alpes ?",a:["Le mont Blanc","Le Cervin","Le mont Rose","Les Grandes Jorasses"],i:"Environ 4 805 m, une altitude qui varie avec l'épaisseur de glace au sommet. Si l'on place le Caucase en Europe, le plus haut sommet européen est l'Elbrouz (5 642 m)."},
{c:"Géographie",d:2,q:"Quel est le plus grand pays d'Afrique ?",a:["L'Algérie","La République démocratique du Congo","Le Soudan","La Libye"],i:"Depuis l'indépendance du Soudan du Sud en 2011, qui a fait perdre la première place au Soudan."},
{c:"Géographie",d:2,q:"Combien de pays ont une frontière terrestre avec la France métropolitaine ?",a:["8","6","7","10"],i:"Belgique, Luxembourg, Allemagne, Suisse, Italie, Monaco, Andorre, Espagne. Mais la plus longue frontière terrestre de la France est celle avec le Brésil, via la Guyane (environ 730 km)."},
{c:"Géographie",d:2,q:"Quel pays a le plus long littoral du monde ?",a:["Le Canada","La Russie","L'Indonésie","La Norvège"],i:"Environ 200 000 km. Mais la longueur d'une côte dépend de l'échelle de mesure : c'est le « paradoxe du littoral » décrit par Benoît Mandelbrot en 1967."},
{c:"Géographie",d:2,q:"Quel est le point le plus bas des terres émergées ?",a:["Les rives de la mer Morte","La vallée de la Mort","La dépression de Qattara","Le lac Assal"],i:"Environ 430 m sous le niveau de la mer, et il continue de baisser. La vallée de la Mort (−86 m) est le point le plus bas d'Amérique du Nord."},
{c:"Géographie",d:3,q:"Quel pays n'a officiellement aucune capitale ?",a:["Nauru","Monaco","Tuvalu","Palaos"],i:"Le gouvernement siège dans le district de Yaren, capitale de fait. Avec environ 21 km², c'est le troisième plus petit État du monde."},
{c:"Géographie",d:3,q:"Quelle est la capitale (siège du gouvernement) la plus haute du monde ?",a:["La Paz","Bogotá","Addis-Abeba","Katmandou"],i:"Environ 3 600 m. La capitale constitutionnelle de la Bolivie est Sucre. Parmi les capitales officielles, la plus haute est Quito (environ 2 850 m)."},
{c:"Géographie",d:3,q:"Quelle mer n'a aucune côte ?",a:["La mer des Sargasses","La mer Morte","La mer d'Aral","La mer Caspienne"],i:"Dans l'Atlantique Nord, elle est délimitée par des courants océaniques, dont le Gulf Stream, et non par des terres."},
{c:"Géographie",d:3,q:"Quel est le lac le plus profond du monde ?",a:["Le lac Baïkal","Le lac Tanganyika","Le lac Titicaca","Le lac Supérieur"],i:"Plus de 1 600 m de profondeur. Il contient environ 20 % de l'eau douce liquide de surface de la planète."},

// ---------- Architecture ----------
{c:"Architecture",d:1,q:"Dans quelle ville se trouve l'opéra aux « voiles » blanches conçu par Jørn Utzon ?",a:["Sydney","Oslo","Copenhague","Auckland"],i:"Inauguré en 1973. Utzon a démissionné en 1966 après des conflits avec le gouvernement et n'a jamais vu le bâtiment achevé."},
{c:"Architecture",d:1,q:"À quel style architectural appartient Notre-Dame de Paris ?",a:["Gothique","Roman","Baroque","Néoclassique"],i:"Chantier lancé en 1163. Ravagée par un incendie le 15 avril 2019, elle a rouvert en décembre 2024."},
{c:"Architecture",d:2,q:"Quel roi a transformé le pavillon de chasse de Versailles en palais ?",a:["Louis XIV","Louis XIII","Henri IV","Louis XV"],i:"Louis XIII fait bâtir un modeste pavillon de chasse en 1623. Louis XIV l'agrandit considérablement et y installe la Cour en 1682."},
{c:"Architecture",d:2,q:"Qui a fondé l'école du Bauhaus en 1919 ?",a:["Walter Gropius","Ludwig Mies van der Rohe","Le Corbusier","Alvar Aalto"],i:"À Weimar, puis à Dessau. Mies van der Rohe en fut le dernier directeur, avant la fermeture sous la pression des nazis en 1933."},
{c:"Architecture",d:2,q:"Quel est le plus ancien pont de Paris encore debout ?",a:["Le Pont-Neuf","Le pont Alexandre-III","Le pont des Arts","Le pont Marie"],i:"Achevé en 1607, malgré son nom. C'était le premier pont parisien sans maisons construites dessus, et il avait des trottoirs."},
{c:"Architecture",d:2,q:"Quel monument de Rome possède la plus grande coupole en béton non armé du monde ?",a:["Le Panthéon","Le Colisée","La basilique Saint-Pierre","Le château Saint-Ange"],i:"Environ 43 m de diamètre, bâtie sous Hadrien au IIe siècle. Son sommet est percé d'un oculus d'environ 8 m, sa seule source de lumière."},
{c:"Architecture",d:2,q:"Qu'est-ce qu'une ziggourat ?",a:["Un temple mésopotamien à étages","Un tombeau égyptien","Un théâtre grec","Un aqueduc romain"],i:"Une tour à gradins surmontée d'un sanctuaire. Celle de Babylone a sans doute inspiré le récit de la tour de Babel."},
{c:"Architecture",d:2,q:"Quel architecte a conçu le musée Guggenheim de New York, construit autour d'une rampe en spirale ?",a:["Frank Lloyd Wright","Frank Gehry","Ieoh Ming Pei","Oscar Niemeyer"],i:"Inauguré en 1959, six mois après la mort de Wright. Frank Gehry a conçu celui de Bilbao."},
{c:"Architecture",d:3,q:"Quel est le plus haut gratte-ciel de France ?",a:["La tour First","La tour Montparnasse","La tour Hekla","La tour Incity"],i:"231 m, à La Défense. La tour Montparnasse (210 m) a longtemps été la plus haute tour de Paris intra-muros."},
{c:"Architecture",d:3,q:"Quelle ville est surnommée « la Ville blanche » pour ses milliers de bâtiments de style Bauhaus ?",a:["Tel-Aviv","Dessau","Casablanca","Brasília"],i:"Environ 4 000 bâtiments, construits surtout dans les années 1930 par des architectes formés en Europe. Classée à l'UNESCO en 2003."},
{c:"Architecture",d:3,q:"Quelle formule est associée à Ludwig Mies van der Rohe ?",a:["« Less is more »","« Form follows function »","« Ornement et crime »","« Une maison est une machine à habiter »"],i:"« Form follows function » vient de Louis Sullivan, « Ornement et crime » d'Adolf Loos, et la « machine à habiter » de Le Corbusier."},
{c:"Architecture",d:3,q:"Quel architecte a conçu l'Institut du monde arabe, à Paris ?",a:["Jean Nouvel","Christian de Portzamparc","Dominique Perrault","Paul Andreu"],i:"Inauguré en 1987. Sa façade sud est faite de centaines de diaphragmes métalliques qui s'ouvrent et se ferment selon la lumière, à la manière de moucharabiehs."},

// ---------- Arts & Culture ----------
{c:"Arts & Culture",d:1,q:"Qui a peint le plafond de la chapelle Sixtine ?",a:["Michel-Ange","Raphaël","Léonard de Vinci","Botticelli"],i:"De 1508 à 1512. Il se considérait avant tout comme sculpteur et avait accepté la commande à contrecœur."},
{c:"Arts & Culture",d:1,q:"Qui a écrit « Le Petit Prince » ?",a:["Antoine de Saint-Exupéry","Albert Camus","Jacques Prévert","Marcel Pagnol"],i:"Publié d'abord à New York en 1943. C'est l'un des livres les plus traduits au monde."},
{c:"Arts & Culture",d:1,q:"Quel compositeur a écrit « Les Quatre Saisons » ?",a:["Antonio Vivaldi","Jean-Sébastien Bach","Georg Friedrich Haendel","Wolfgang Amadeus Mozart"],i:"Quatre concertos pour violon publiés en 1725, chacun accompagné d'un sonnet qui décrit la saison."},

function lsGet(k,def){ try{ const r=localStorage.getItem(k); return r ? JSON.parse(r) : def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

function normQ(o){
  if(!o || typeof o!=="object") return null;
  const q = typeof o.q==="string" ? o.q.trim() : "";
  const d = Number(o.d);
  const a = Array.isArray(o.a) ? o.a.map(x=>String(x==null?"":x).trim()).filter(Boolean) : [];
  if(!q || ![1,2,3].includes(d) || a.length<2 || a.length>6) return null;
  if(new Set(a.map(x=>x.toLowerCase())).size!==a.length) return null;
  const c = (typeof o.c==="string" && o.c.trim()) ? o.c.trim() : "Divers";
  const i = typeof o.i==="string" ? o.i.trim() : "";
  return {c,d,q,a,i};
}
function loadCustom(){ const arr=lsGet(STORE_Q,[]); return Array.isArray(arr) ? arr.map(normQ).filter(Boolean) : []; }
function saveCustom(){ return lsSet(STORE_Q, CUSTOM); }

}

function download(name, data){

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();

function recordQ(q,ok){
  const k=qkey(q); const s=QSTATS[k]||{n:0,ok:0,d:q.d};
  s.n++; if(ok) s.ok++; s.d=q.d; QSTATS[k]=s; saveQStats();
}
function diffPrior(d){
  let n=0, ok=0;
  Object.values(QSTATS).forEach(s=>{ if(s && s.d===d){ n+=s.n; ok+=s.ok; } });
  const def=DIFF_PRIOR[d];
  return {p: n>=20 ? (ok+10*def)/(n+10) : def, n, ok};
}

const SFX = (()=>{
  let ctx=null, noiseBuf=null;
  function ac(){
    if(SETUP.sound===false) return null;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    try{ if(!ctx) ctx=new C(); if(ctx.state==="suspended") ctx.resume(); }catch(e){ return null; }
    return ctx;
  }
  function tone(f,t0,dur,type,vol,f2){
    const c=ac(); if(!c) return;
    try{
      const t=c.currentTime+t0, o=c.createOscillator(), gn=c.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
      if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
      gn.gain.setValueAtTime(0.0001,t); gn.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  }
  function noise(t0,dur,vol,ftype,freq,q,f2){
    const c=ac(); if(!c) return;
    try{
      if(!noiseBuf){ noiseBuf=c.createBuffer(1,c.sampleRate*1.5,c.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      const t=c.currentTime+t0, src=c.createBufferSource(), fl=c.createBiquadFilter(), gn=c.createGain();
      src.buffer=noiseBuf; fl.type=ftype||"bandpass"; fl.frequency.setValueAtTime(freq||1000,t); fl.Q.value=q||1;
      if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
      gn.gain.setValueAtTime(0.0001,t); gn.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(fl); fl.connect(gn); gn.connect(c.destination); src.start(t); src.stop(t+dur+0.05);
    }catch(e){}
  }
  return {
    click(){ tone(900,0,.05,"square",.04); },
    tick(){ tone(1500,0,.05,"square",.07); },
    alarm(){ [0,.16,.32,.48].forEach(t=>tone(880,t,.12,"square",.14)); },
    drum(){ for(let i=0;i<15;i++) noise(i*0.072,.06,0.10+i*0.012,"bandpass",160+i*25,1.2); tone(196,1.05,.18,"triangle",.12,392); },
    correct(s){ const b=523.25*Math.pow(2,Math.min(s||1,12)/12); [0,4,7,12].forEach((st,k)=>tone(b*Math.pow(2,st/12),k*.07,.24,"triangle",.17)); if(s>=5) tone(b*4,.3,.4,"sine",.06); },
    wrong(){ tone(220,0,.4,"sawtooth",.13,110); tone(208,.04,.4,"sawtooth",.09,98); },
    glass(){ noise(0,.55,.35,"highpass",2800,.7); tone(150,0,.3,"sawtooth",.12,55); for(let i=0;i<10;i++) tone(2400+Math.random()*4200,.02+Math.random()*.3,.12+Math.random()*.3,"sine",.05+Math.random()*.05); },
    fire(){ noise(0,.8,.28,"bandpass",300,.9,2400); tone(110,0,.5,"sine",.08,220); },
    coin(){ tone(988,0,.08,"square",.08); tone(1319,.08,.28,"square",.08); },
    fanfare(){ [523,659,784,1047].forEach((f,k)=>tone(f,k*.1,.28,"triangle",.18)); tone(1047,.42,.7,"triangle",.18); tone(1319,.42,.7,"sine",.06); },
    pay(){ tone(660,0,.1,"triangle",.1); tone(440,.1,.2,"triangle",.1); }
  };
})();

function burst(x,y,n,colors,opt){
  if(REDUCED) return;
  const box=document.getElementById("fx"); if(!box) return;
  opt=opt||{};
  for(let k=0;k<n;k++){
    const el=document.createElement("div");
    el.className="pt"+(opt.shard?" shard":"");
    const ang=opt.up ? (-Math.PI/2 + (Math.random()-.5)*Math.PI*1.1) : Math.random()*Math.PI*2;
    const sp=(opt.power||260)*(0.35+Math.random());
    const dx=Math.cos(ang)*sp, dy=Math.sin(ang)*sp + (opt.gravity||160);
    el.style.left=x+"px"; el.style.top=y+"px";
    el.style.setProperty("--dx",dx.toFixed(0)+"px"); el.style.setProperty("--dy",dy.toFixed(0)+"px");
    el.style.setProperty("--r",(Math.random()*720-360).toFixed(0)+"deg");
    el.style.setProperty("--d",(0.8+Math.random()*0.7).toFixed(2)+"s");
    if(!opt.shard) el.style.background=colors[k%colors.length];
    if(!opt.shard && Math.random()<.4) el.style.borderRadius="50%";
    box.appendChild(el);
    setTimeout(()=>el.remove(),1700);
  }
}

function animateCount(el){
  const from=Number(el.dataset.from), to=Number(el.dataset.to);
  if(!isFinite(from) || !isFinite(to) || from===to || REDUCED){ el.textContent=to; return; }
  const t0=performance.now(), dur=650;
  el.textContent=from;
  const step=now=>{ const k=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-k,3); el.textContent=Math.round(from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
